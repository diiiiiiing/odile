<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5c5c5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<title>ODILE — WORK</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
<link rel="preconnect" href="https://zgrgr7sj.api.sanity.io" crossorigin>
<style>
  /* work13 — one piece at a time. The whole work runs as a single
     sequence, project after project; a tap on the right half of the
     screen goes on, on the left half goes back (a swipe too). Under the
     piece, one line says what it is. Two words in the corner open the
     index and the infos. Same ground as work8 — the dark grey and its
     slow colour — black ink, lowercase, regular only; italic marks what's
     open, never bold, never grey. */
  :root{
    --bg:#5c5c5e;--fg:#000;
    --fs:11.232px;--pad:14px;
    --top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px);
    --head:calc(48px + var(--top));
    --foot:calc(64px + var(--bottom));
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  html{
    background:var(--bg);
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  }
  body{
    color:var(--fg);
    font-family:Times,'Times New Roman',serif;
    font-size:var(--fs);line-height:1.3;letter-spacing:-.03em;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  *{font-weight:400!important;font-synthesis-weight:none;}
  a,a:visited{color:var(--fg);text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:0;letter-spacing:inherit;cursor:pointer;}
  .u{text-decoration:underline;text-underline-offset:.15em;text-decoration-thickness:1px;}

  #iri{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  #iri i{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}

  /* ── CORNERS — the name, and the two words ── */
  #bar{
    position:fixed;left:0;right:0;top:0;z-index:20;height:var(--head);
    padding:var(--top) var(--pad) 0;
    display:flex;align-items:center;justify-content:space-between;
  }
  #bar nav{display:flex;gap:16px;}
  #bar button,#bar a{height:44px;display:flex;align-items:center;}
  #bar .on{font-style:italic;}

  /* ── STAGE — the pieces lie on top of each other; only the current one
     shows, the change is a cross-fade ── */
  #stage{position:fixed;left:0;right:0;top:var(--head);bottom:var(--foot);}
  .slide{
    position:absolute;inset:0;padding:0 var(--pad);
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .45s ease;pointer-events:none;
  }
  .slide.on{opacity:1;}
  .slide img,.slide video{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  /* tap zones: left half back, right half on */
  #zones{position:fixed;left:0;right:0;top:var(--head);bottom:var(--foot);z-index:5;display:flex;}
  #zones div{flex:1;}
  @media (hover:hover){#zones .l{cursor:w-resize;}#zones .r{cursor:e-resize;}}

  /* ── CAPTION — one line under the piece ── */
  #cap{
    position:fixed;left:0;right:0;bottom:0;z-index:10;height:var(--foot);
    padding:0 var(--pad) var(--bottom);
    display:flex;align-items:center;justify-content:center;text-align:center;
  }
  #cap .line{max-width:34em;transition:opacity .25s ease;}
  #cap .more{margin-left:.3em;}

  /* ── SHEETS — index, infos, a project's text: they come over the piece,
     on the same grey, and go with the same word ── */
  .sheet{
    position:fixed;inset:0;z-index:15;
    padding:var(--head) var(--pad) calc(28px + var(--bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    background:var(--bg);
    opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s;
    -webkit-user-select:text;user-select:text;
  }
  .sheet.on{opacity:1;visibility:visible;transition:opacity .25s ease;}
  .sheet .in{max-width:34em;margin:0 auto;padding-top:28px;}
  .sheet .close{display:inline-block;margin-top:34px;}
  /* index: the names, one per line, the medium after each */
  .ix a{display:block;padding:7px 0;}
  .ix a .c{font-style:italic;margin-left:.45em;}
  .ix a.cur .t{font-style:italic;}
  /* infos and a project's text: short blocks with air between them */
  .blk+.blk{margin-top:26px;}
  .blk .h{font-style:italic;margin-bottom:4px;}
  .rows{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;}
  .ptext p{margin-bottom:.7em;}

  /* ── GALLERY — work8's band: pieces of varied height side by side, no
     gap, scrolling sideways without end ── */
  #gallery{
    position:fixed;left:0;right:0;top:var(--head);bottom:var(--foot);z-index:12;
    display:flex;align-items:center;
    opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;
  }
  #gallery.on{opacity:1;visibility:visible;transition:opacity .3s ease;}
  #band{
    width:100%;height:min(60vh,700px);display:flex;align-items:center;gap:0;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  #band::-webkit-scrollbar{display:none;}
  #band .it{flex:0 0 auto;height:100%;display:block;background:rgba(0,0,0,.05);}
  #band .it img,#band .it video{display:block;height:100%;width:100%;object-fit:cover;opacity:0;transition:opacity .3s ease;}
  #band .it .ok{opacity:1;}
  body.g #stage,body.g #zones,body.g #cap{visibility:hidden;}
  /* on a phone the band is lower, so several pieces sit side by side */
  @media (max-width:640px) and (orientation:portrait){#band{height:40svh;}}

  /* ── a project's pieces under its text: three to a row, square, a tap
     shows that piece ── */
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:22px;}
  .pgrid button{display:block;aspect-ratio:1;overflow:hidden;background:rgba(0,0,0,.05);}
  .pgrid img,.pgrid video{display:block;width:100%;height:100%;object-fit:cover;}

  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;}
  @media (prefers-reduced-motion:reduce){.slide,.sheet,#cap .line{transition:none;}}
</style>
</head>
<body>
<script>
/* ── lowercase ── every word in lowercase, except names set in capitals
   (COHL, UNVEIL®, AI…); a possessive after them goes lowercase. Applied to
   what's here and to every text that arrives later */
(()=>{
  const word=w=>{
    const m=w.match(/^([^a-z]*?)(['’]s)?([^A-Za-zÀ-ÿ]*)$/);
    if(m&&(m[1].match(/[A-ZÀ-Þ]/g)||[]).length>=2&&!/[a-zß-ÿ]/.test(m[1]))return m[1]+(m[2]||'').toLowerCase()+m[3];
    return w.toLowerCase();
  };
  const lc=t=>t.replace(/\S+/g,word);
  window.lowerText=lc;
  const SKIP=new Set(['SCRIPT','STYLE','NOSCRIPT']);
  const fix=n=>{
    if(n.nodeType===3){
      if(n.parentNode&&SKIP.has(n.parentNode.nodeName))return;
      const v=lc(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;
    }else if(n.nodeType===1&&!SKIP.has(n.nodeName)){
      const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);
      for(let t=w.nextNode();t;t=w.nextNode())fix(t);
    }
  };
  fix(document.body);
  new MutationObserver(ms=>ms.forEach(m=>{
    if(m.type==='characterData')fix(m.target);
    else m.addedNodes.forEach(fix);
  })).observe(document.body,{subtree:true,childList:true,characterData:true});
})();
</script>

<div id="iri" aria-hidden="true"></div>

<header id="bar">
  <a href="#" id="ding">ding</a>
  <nav>
    <button id="bIndex">index</button>
    <button id="bGallery">gallery</button>
    <button id="bInfos">infos</button>
  </nav>
</header>

<div id="stage" aria-live="polite"></div>
<div id="zones"><div class="l" aria-label="previous"></div><div class="r" aria-label="next"></div></div>
<div id="cap"><div class="line"></div></div>
<div id="loading">…</div>
<div id="gallery" aria-hidden="true"><div id="band"></div></div>

<div id="index" class="sheet" aria-hidden="true"><div class="in ix"></div></div>
<div id="infos" class="sheet" aria-hidden="true"><div class="in inf"></div></div>
<div id="text" class="sheet" aria-hidden="true"><div class="in ptext"></div></div>

<script>
const $=s=>document.querySelector(s);
const stageEl=$('#stage'),capEl=$('#cap .line');
let projects=[],order=[],seq=[],cur=0,sheet=null,GALLERY=[];
const nameOf=p=>p.displayTitle||p.client||p.title;
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Sanity images at this screen's real size; GIFs untouched */
const PX=Math.min(2000,Math.ceil(Math.max(innerWidth,innerHeight*.75)*Math.min(3,devicePixelRatio||1)/200)*200);
const isSanity=u=>/^https:\/\/cdn\.sanity\.io\/images\//.test(u)&&!/\.gif(\?|$)/i.test(u);
const sized=u=>isSanity(u)?`${u}?w=${PX}&fit=max&auto=format&q=82`:u;
/* small square crops for the grid, and band pieces at the band's height */
const TH=Math.ceil(innerWidth/3*Math.min(3,devicePixelRatio||1)/100)*100;
const thumb=u=>isSanity(u)?`${u}?w=${TH}&h=${TH}&fit=crop&auto=format&q=75`:u;
const bandSize=u=>isSanity(u)?`${u}?h=${Math.min(2000,Math.ceil(innerHeight*Math.min(3,devicePixelRatio||1)/200)*200)}&fit=max&auto=format&q=80`:u;

/* ── THE SEQUENCE ── every visible piece of every project, project after
   project in the index's order. Each slide is built once; only the
   current one and its neighbours are given their file, and only the
   current video plays */
function buildStage(){
  stageEl.innerHTML='';
  seq.forEach((s,k)=>{
    const el=document.createElement('div');el.className='slide';
    if(s.m.type==='image'){
      const img=new Image();img.alt='';img.decoding='async';img.dataset.src=sized(s.m.url);el.appendChild(img);
    }else{
      const v=document.createElement('video');
      v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';
      v.setAttribute('playsinline','');v.setAttribute('muted','');v.disablePictureInPicture=true;
      v.dataset.src=s.m.url+'#t=0.1';
      el.appendChild(v);
    }
    s.el=el;stageEl.appendChild(el);
  });
}
function feed(k){
  const s=seq[(k+seq.length)%seq.length];if(!s)return;
  const media=s.el.firstChild;
  if(!media.getAttribute('src'))media.src=media.dataset.src;
}
function starve(k){
  const s=seq[(k+seq.length)%seq.length];if(!s)return;
  const media=s.el.firstChild;
  if(media.tagName==='VIDEO'&&media.getAttribute('src')){media.pause();media.removeAttribute('src');media.load();}
}
function show(k,{fromHash=false}={}){
  if(!seq.length)return;
  const prev=seq[cur];
  k=(k+seq.length)%seq.length;
  cur=k;
  seq.forEach((s,i)=>{
    const d=Math.min(Math.abs(i-k),seq.length-Math.abs(i-k));
    s.el.classList.toggle('on',i===k);
    if(d<=2)feed(i);else if(d>4)starve(i);
    const media=s.el.firstChild;
    if(media.tagName==='VIDEO'){if(i===k)media.play().catch(()=>{});else media.pause();}
  });
  const s=seq[k],p=projects[s.p];
  if(!prev||prev.p!==s.p||!capEl.textContent)caption(s.p);
  if(!fromHash&&location.hash.slice(1)!==p.slug)history.replaceState(null,'','#'+p.slug);
  document.title=`${nameOf(p).toUpperCase()} — ODILE — WORK`;
  markIndex();
  window.nudgeColour?.(k);
}
const MEDIUM={videos:'film',images:'images','graphic design':'graphic design'};
function caption(pi){
  const p=projects[pi];
  const bits=[nameOf(p),p.year].filter(Boolean);
  const hasText=true;   // "more" always has something: the text and/or the pieces
  capEl.style.opacity=0;
  setTimeout(()=>{
    capEl.innerHTML=`${bits.map(esc).join('. ')}.${hasText?' <button class="more u">more</button>':''}`;
    capEl.style.opacity=1;
  },120);
}
const next=()=>show(cur+1),prev=()=>show(cur-1);
$('#zones .l').addEventListener('click',prev);
$('#zones .r').addEventListener('click',next);
capEl.addEventListener('click',e=>{if(e.target.closest('.more'))openText(seq[cur].p);});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(sheet)closeSheet();else closeGallery();return;}
  if(sheet||galleryOn)return;
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft')prev();
});
/* swipe: a clear horizontal stroke turns the page */
(()=>{
  let x0=0,y0=0,t0=0;
  const z=$('#zones');
  z.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();},{passive:true});
  z.addEventListener('touchend',e=>{
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3&&Date.now()-t0<700){
      e.preventDefault();   // not also a tap
      dx<0?next():prev();
    }
  });
})();
document.addEventListener('visibilitychange',()=>{
  const v=seq[cur]?.el.firstChild;
  if(v&&v.tagName==='VIDEO'){if(document.hidden)v.pause();else v.play().catch(()=>{});}
});

/* ── SHEETS ── */
function openSheet(id,btn){
  if(sheet===id){closeSheet();return;}
  closeSheet();
  sheet=id;
  const el=$('#'+id);el.classList.add('on');el.setAttribute('aria-hidden','false');el.scrollTop=0;
  btn?.classList.add('on');
  const v=seq[cur]?.el.firstChild;if(v&&v.tagName==='VIDEO')v.pause();
}
function closeSheet(){
  if(!sheet)return;
  const el=$('#'+sheet);el.classList.remove('on');el.setAttribute('aria-hidden','true');
  document.querySelectorAll('#bar .on').forEach(b=>b.classList.remove('on'));
  sheet=null;
  const v=seq[cur]?.el.firstChild;if(v&&v.tagName==='VIDEO'&&!galleryOn)v.play().catch(()=>{});
}
$('#bIndex').addEventListener('click',()=>openSheet('index',$('#bIndex')));
$('#bInfos').addEventListener('click',()=>openSheet('infos',$('#bInfos')));
$('#ding').addEventListener('click',e=>{e.preventDefault();closeSheet();closeGallery();show(0);});
$('#bGallery').addEventListener('click',()=>{closeSheet();galleryOn?closeGallery():openGallery();});
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target.closest('.close'))closeSheet();}));

function buildIndex(){
  const ix=$('#index .in');
  ix.innerHTML='';
  order.forEach(i=>{
    const p=projects[i];
    const a=document.createElement('a');a.href='#'+p.slug;a.dataset.i=i;
    a.innerHTML='<span class="t"></span><span class="c"></span>';
    a.querySelector('.t').textContent=nameOf(p);
    a.querySelector('.c').textContent=MEDIUM[p.cat]||p.cat;
    a.addEventListener('click',e=>{e.preventDefault();closeSheet();closeGallery();show(firstOf(i));});
    ix.appendChild(a);
  });
  const c=document.createElement('button');c.className='close u';c.textContent='close';ix.appendChild(c);
}
function markIndex(){
  const pi=seq[cur]?.p;
  document.querySelectorAll('#index a').forEach(a=>a.classList.toggle('cur',+a.dataset.i===pi));
}
const firstOf=i=>Math.max(0,seq.findIndex(s=>s.p===i));

/* a project's text: name, what it is, the words, its link */
function normalizeUrl(href){
  const h=String(href||'').trim();
  if(/^(https?:|mailto:|tel:|#|\/)/i.test(h))return h;
  return 'https://'+h.replace(/^\/+/,'');
}
function openText(pi){
  const p=projects[pi],box=$('#text .in');
  box.innerHTML='';
  const head=document.createElement('div');head.className='blk';
  head.innerHTML=`<div class="h"></div><div class="m"></div>`;
  head.querySelector('.h').textContent=nameOf(p);
  head.querySelector('.m').textContent=[[MEDIUM[p.cat]||p.cat,...p.tags.filter(t=>t!==p.cat&&t!==MEDIUM[p.cat])].join(', '),p.year].filter(Boolean).join(' — ');
  box.appendChild(head);
  if(p.description.length){
    const d=document.createElement('div');d.className='blk';
    p.description.forEach(line=>{
      const para=document.createElement('p');
      line.forEach(run=>{
        if(run.href){const l=document.createElement('a');l.className='u';l.href=normalizeUrl(run.href);l.target='_blank';l.rel='noopener';l.textContent=run.text;para.appendChild(l);}
        else para.appendChild(document.createTextNode(run.text));
      });
      d.appendChild(para);
    });
    box.appendChild(d);
  }
  if(p.link){const b=document.createElement('div');b.className='blk';b.innerHTML=`<a class="u" target="_blank" rel="noopener"></a>`;b.firstChild.href=normalizeUrl(p.link);b.firstChild.textContent='visit project ↗';box.appendChild(b);}
  /* every piece of the project, small; a tap closes the sheet on it */
  const grid=document.createElement('div');grid.className='pgrid';
  p.media.forEach((m,k)=>{
    const b=document.createElement('button');b.setAttribute('aria-label','piece '+(k+1));
    if(m.type==='image'){const img=new Image();img.alt='';img.decoding='async';img.loading='lazy';img.src=thumb(m.url);b.appendChild(img);}
    else{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';v.setAttribute('playsinline','');v.src=m.url+'#t=0.1';b.appendChild(v);}
    b.addEventListener('click',()=>{closeSheet();show(firstOf(pi)+k);});
    grid.appendChild(b);
  });
  box.appendChild(grid);
  const c=document.createElement('button');c.className='close u';c.textContent='close';box.appendChild(c);
  openSheet('text',null);
}

/* ── INFOS ── from the CMS's Infos document; each part can be switched off
   in the Studio ("Masquer sur le site") */
const ext=(label,url)=>url?`<a class="u" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`:esc(label);
const clientList=c=>(typeof c==='string'?c.split(/[\n,]+/):(c||[]).map(x=>x&&x.name)).map(x=>(x||'').trim()).filter(Boolean);
function renderInfo(d){
  d={...(d||{})};
  const off=(flag,...keys)=>{if(d[flag])keys.forEach(k=>{d[k]=null;});};
  off('hideName','name');off('hideLocation','location','showTime');
  off('hideCurrent','currentText','currentPlace');off('hideEmail','email');
  off('hideInstagram','instagram');off('hideLinks','links');
  off('hideExperiences','experiences');off('hideServices','services');off('hideClients','clients');
  const blk=(h,body)=>body?`<div class="blk">${h?`<div class="h">${h}</div>`:''}<div>${body}</div></div>`:'';
  let html='';
  html+=blk('',[esc(d.name),[esc(d.location),d.showTime?'<span class="paris-time"></span>':''].filter(Boolean).join(' '),
    (d.currentText||d.currentPlace)?[esc(d.currentText),ext(d.currentPlace,d.currentUrl)].filter(Boolean).join(' '):''].filter(Boolean).join('<br>'));
  if(d.services)html+=blk('services',d.services.split(/\s*,\s*/).map(esc).join('<br>'));
  const xp=(d.experiences||[]).filter(x=>x&&(x.company||x.role));
  if(xp.length)html+=blk('experiences',`<div class="rows">${xp.map(x=>`<span>${esc([x.from,x.to].filter(Boolean).join(' — '))}</span><span>${ext(x.company,x.url)}, ${esc(x.role)}</span>`).join('')}</div>`);
  const cl=clientList(d.clients);
  if(cl.length)html+=blk('clients',cl.map(esc).join(', '));
  const h=(d.instagram||'').replace(/^@/,'');
  html+=blk('contact',[d.email&&`<a class="u" href="mailto:${esc(d.email)}">${esc(d.email)}</a>`,h&&ext('@'+h,'https://instagram.com/'+encodeURIComponent(h)),...(d.links||[]).filter(l=>l&&l.label).map(l=>ext(l.label,l.url))].filter(Boolean).join('<br>'));
  html+='<button class="close u">close</button>';
  $('#infos .in').innerHTML=html;
  window.tickParis?.();
}

/* ── GALLERY ── the CMS's gallery as work8's band: three copies laid end to
   end; when the scroll runs into the first or the last, it jumps by one
   copy's width to the same picture in the middle one — so it never ends.
   Heights vary (48–100% of the band, the same each visit); every piece
   has its width before it loads, and all three copies of a piece load
   together */
let galleryOn=false;
const bandEl=$('#band');
let arCache={};
try{arCache=JSON.parse(localStorage.getItem('odile-video-ar')||'{}')||{};}catch(e){}
const bandNear=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting)return;
  bandEl.querySelectorAll(`[data-g="${en.target.dataset.g}"]`).forEach(x=>{
    bandNear.unobserve(x);
    const m=x.firstChild;
    if(!m.getAttribute('src'))m.src=m.dataset.src;
  });
}),{root:bandEl,rootMargin:'0px 1200px'});
const bandPlay=new IntersectionObserver(es=>es.forEach(({target,isIntersecting})=>{
  const v=target.firstChild;if(v.tagName!=='VIDEO')return;
  if(isIntersecting&&galleryOn)v.play().catch(()=>{});else v.pause();
}),{root:bandEl,threshold:.5});
function buildBand(){
  bandEl.innerHTML='';
  if(!GALLERY.length)return;
  let seed=2004;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const hs=GALLERY.map(()=>Math.round(48+rnd()*52));
  for(let c=0;c<3;c++)GALLERY.forEach((m,n)=>{
    const it=document.createElement('div');it.className='it';it.dataset.g=n;
    it.style.height=hs[n]+'%';
    it.style.aspectRatio=String(m.ar||arCache[m.url]||16/9);
    let el;
    if(m.type==='image'){el=new Image();el.alt='';el.decoding='async';el.dataset.src=bandSize(m.url);el.onload=()=>el.classList.add('ok');}
    else{el=document.createElement('video');el.muted=true;el.loop=true;el.playsInline=true;el.preload='metadata';el.setAttribute('playsinline','');el.dataset.src=m.url+'#t=0.1';el.addEventListener('loadeddata',()=>el.classList.add('ok'));}
    it.appendChild(el);bandEl.appendChild(it);
    bandNear.observe(it);bandPlay.observe(it);
  });
}
const copyWidth=()=>{const it=bandEl.children,n=GALLERY.length;return it[n]?it[n].offsetLeft-it[0].offsetLeft:0;};
bandEl.addEventListener('scroll',()=>{
  const w=copyWidth();if(w<bandEl.clientWidth)return;
  if(bandEl.scrollLeft<w*.5)bandEl.scrollLeft+=w;
  else if(bandEl.scrollLeft>w*1.5)bandEl.scrollLeft-=w;
},{passive:true});
/* on a computer the wheel scrolls it sideways */
bandEl.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();bandEl.scrollLeft+=e.deltaY*(e.deltaMode===1?40:1);}
},{passive:false});
function openGallery(){
  if(!GALLERY.length)return;
  galleryOn=true;document.body.classList.add('g');
  $('#gallery').classList.add('on');$('#gallery').setAttribute('aria-hidden','false');
  $('#bGallery').classList.add('on');
  if(!bandEl.dataset.placed){bandEl.scrollLeft=copyWidth();bandEl.dataset.placed=1;}
  const v=seq[cur]?.el.firstChild;if(v&&v.tagName==='VIDEO')v.pause();
}
function closeGallery(){
  if(!galleryOn)return;
  galleryOn=false;document.body.classList.remove('g');
  $('#gallery').classList.remove('on');$('#gallery').setAttribute('aria-hidden','true');
  $('#bGallery').classList.remove('on');
  bandEl.querySelectorAll('video').forEach(v=>v.pause());
  const v=seq[cur]?.el.firstChild;if(v&&v.tagName==='VIDEO'&&!sheet)v.play().catch(()=>{});
}

/* ── DATA ── the same CMS as work8 */
const PID='zgrgr7sj',DS='production';
const Q=`{
  "projects":*[_type=="project"]|order(year desc){
    title,client,displayTitle,"year":string(year),"favorite":favorite==true,description,link,
    "tags":tags[]->title,
    "media":media[]{_type,"hidden":hidden==true,
      _type=="image"=>{"url":asset->url,"ar":asset->metadata.dimensions.aspectRatio},
      _type=="file"=>{"url":asset->url},
      _type=="mediaImage"=>{"url":image.asset->url,"ar":image.asset->metadata.dimensions.aspectRatio},
      _type=="mediaVideo"=>{"url":video.asset->url}}
  },
  "gallery":*[_id=="workGallery"][0].media[]{_type,"url":asset->url,"ar":asset->metadata.dimensions.aspectRatio},
  "about":*[_id=="about"][0]
}`;
const CAT_ORDER=['videos','images','graphic design'];
function category(p){
  if((p.title||'').toLowerCase()==="runner's high")return 'images';
  const t=p.tags;
  if(t.includes('film')||t.includes('music video')||t.includes('video'))return 'videos';
  if(t.includes('graphic design'))return 'graphic design';
  return 'images';
}
const SLUG={'ø':'o','œ':'oe','æ':'ae','ð':'d','þ':'th','ł':'l','ß':'ss'};
const slugify=s=>String(s||'').toLowerCase().replace(/[øœæðþłß]/g,c=>SLUG[c]).normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'project';

(async()=>{
  try{
    const res=await fetch(`https://${PID}.api.sanity.io/v2021-10-21/data/query/${DS}?query=${encodeURIComponent(Q)}`);
    const{result}=await res.json();
    projects=(result.projects||[]).map(p=>{
      const q={
        title:p.title||'',client:p.client||'',displayTitle:p.displayTitle||'',year:p.year||'',
        favorite:!!p.favorite,link:p.link||'',
        tags:(p.tags||[]).filter(Boolean).map(t=>t.toLowerCase().trim()),
        description:Array.isArray(p.description)?p.description.filter(b=>b._type==='block'&&Array.isArray(b.children)).map(b=>{
          const defs=Object.fromEntries((b.markDefs||[]).map(d=>[d._key,d]));
          return b.children.map(c=>({text:c.text||'',href:(c.marks||[]).map(k=>defs[k]).find(d=>d&&d._type==='link')?.href||null}));
        }).filter(r=>r.some(x=>x.text.trim())):[],
        media:(p.media||[]).filter(m=>m&&m.url&&!m.hidden).map(m=>m._type==='image'||m._type==='mediaImage'?{type:'image',url:m.url}:{type:'video',url:m.url}),
      };
      q.cat=category(q);
      return q;
    });
    renderInfo(result.about);
    GALLERY=(result.gallery||[]).filter(m=>m&&m.url).map(m=>m._type==='file'?{type:'video',url:m.url}:{type:'image',url:m.url,ar:m.ar||1});
  }catch(e){console.warn('[Sanity]',e.message);renderInfo(null);}
  const seen=new Set();
  projects.forEach(p=>{let b=slugify(nameOf(p)),s=b,n=2;while(seen.has(s))s=b+'-'+(n++);seen.add(s);p.slug=s;});
  order=projects.map((_,i)=>i).sort((a,b)=>CAT_ORDER.indexOf(projects[a].cat)-CAT_ORDER.indexOf(projects[b].cat)||(projects[b].favorite-projects[a].favorite));
  seq=order.flatMap(i=>projects[i].media.map(m=>({p:i,m})));
  buildStage();buildIndex();
  $('#loading').remove();
  buildBand();
  const h=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===h);
  show(i!==-1?firstOf(i):0,{fromHash:i!==-1});
})();
addEventListener('popstate',()=>{
  const h=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===h);
  if(i!==-1&&seq[cur]?.p!==i)show(firstOf(i),{fromHash:true});
});

/* ── COLOUR ── work8's four blobs, same colours and sizes, each its own
   small layer only ever moved. They lean toward the pointer on a computer;
   on a phone they shift a little with each turn of the page */
(()=>{
  const iri=document.getElementById('iri');
  const DEF=[
    {x:50,y:100,ax:.38,ay:.30,ease:.05,c:'212,184,110',op:.40,ex:90,ey:70},
    {x:20,y:60,ax:-.42,ay:.34,ease:.04,c:'200,160,210',op:.36,ex:70,ey:60},
    {x:80,y:40,ax:.36,ay:-.38,ease:.045,c:'172,202,198',op:.16,ex:95,ey:85},
    {x:50,y:50,ax:.18,ay:.16,ease:.03,c:'210,200,190',op:.20,ex:80,ey:80},
  ];
  const S=4;
  const blobs=DEF.map(d=>{
    const el=document.createElement('i');
    el.style.background=`radial-gradient(ellipse 50% 50% at 50% 50%,rgba(${d.c},${d.op}) 0%,transparent 55%)`;
    iri.appendChild(el);
    return{d,el,x:d.x,y:d.y};
  });
  let Wd=0,H=0,mx=.5,my=.5,running=false;
  const size=()=>{Wd=innerWidth;H=innerHeight;blobs.forEach(({d,el})=>{el.style.width=(2*d.ex/100*Wd/S)+'px';el.style.height=(2*d.ey/100*H/S)+'px';});};
  const place=b=>{const rx=b.d.ex/100*Wd,ry=b.d.ey/100*H;b.el.style.transform=`translate3d(${(b.x/100*Wd-rx).toFixed(1)}px,${(b.y/100*H-ry).toFixed(1)}px,0) scale(${S})`;};
  const tick=()=>{
    let moving=false;
    blobs.forEach(b=>{
      const tx=b.d.x+(mx-.5)*b.d.ax*100,ty=b.d.y+(my-.5)*b.d.ay*100;
      b.x+=(tx-b.x)*b.d.ease;b.y+=(ty-b.y)*b.d.ease;
      if(Math.abs(tx-b.x)>.02||Math.abs(ty-b.y)>.02)moving=true;
      place(b);
    });
    running=moving;
    if(moving)requestAnimationFrame(tick);
  };
  const wake=()=>{if(!running){running=true;requestAnimationFrame(tick);}};
  size();blobs.forEach(place);
  addEventListener('resize',()=>{size();blobs.forEach(place);});
  addEventListener('mousemove',e=>{mx=e.clientX/Wd;my=e.clientY/H;wake();},{passive:true});
  /* a turn of the page on a phone nudges the colour */
  window.nudgeColour=k=>{if(matchMedia('(hover:hover)').matches)return;mx=.5+.3*Math.sin(k*.7);my=.5+.25*Math.cos(k*.5);wake();};
})();
</script>
