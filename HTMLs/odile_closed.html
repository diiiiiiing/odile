<style>
  /* Website closed — from Figma, PORTFOLIO-CLEAN › Frame 8 (153:298).
     work8's background, with one 600×1081 column in its middle:
     a lock screen, a notification over it, the Siri orb at the bottom.
     That column is laid out at its Figma size and scaled to fit the
     window (see the script). */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  /* the background is work5's light mode: white, with four wide soft
     washes of colour that lean toward the pointer (see the script) */
  :root{--bg:#fff;}
  html,body{height:100%;background:var(--bg);overflow:hidden;}
  body{isolation:isolate;}
  #iri{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;}
  #iri i{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  body{-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:none;}

  #stage{
    position:fixed;left:50%;top:50%;width:600px;height:1081px;
    transform:translate(-50%,-50%) scale(var(--s,1)) perspective(2600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  }

  /* ── the phone ── */
  .phone-col{position:absolute;inset:0;padding:24px;display:flex;flex-direction:column;gap:24px;border-radius:40px;}
  .phone{position:relative;flex:1 0 0;min-height:1px;width:100%;border-radius:32px;}
  .lock{position:absolute;inset:0;overflow:clip;border-radius:48px;background:rgba(128,128,128,.3);}
  .lock>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
  .btn{position:absolute;bottom:50px;width:50px;height:50px;}
  .btn img{position:absolute;inset:0;width:100%;height:100%;}
  .btn.cam{right:46px;}
  .btn.torch{left:46px;}
  .swipe{position:absolute;top:43.8px;right:47.8px;width:48px;height:2.333px;border-radius:1.167px;background:#fff;opacity:.35;-webkit-backdrop-filter:blur(14.951px);backdrop-filter:blur(14.951px);}
  .status{position:absolute;left:0;right:0;top:0;height:53px;}
  .status>*{position:absolute;translate:0 -50%;}
  .status img{position:absolute;inset:0;width:100%;height:100%;}
  .bat-border{right:34.8px;top:calc(50% + 2.6px);width:25px;height:13px;border:1px solid #fff;border-radius:4.3px;opacity:.35;}
  .bat-cap{right:32.57px;top:calc(50% + 2.77px);width:1.328px;height:4px;}
  .bat-fill{right:37px;top:calc(50% + 2.6px);width:21px;height:9px;border-radius:2.5px;background:#fff;}
  .wifi{right:67.16px;top:calc(50% + 2.75px);width:17.142px;height:12.1px;}
  .cell{right:91.8px;top:calc(50% + 2.6px);width:19.2px;height:12px;}
  .home-ind{position:absolute;inset:97.54% 0 0 0;}
  .home-ind i{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:139px;height:5px;border-radius:100px;background:#fff;}


  /* ── the notification ── liquid glass, as on iOS 26: a capsule of clear
     glass that keeps the colours behind it, only lightly frosted; a thick
     rim that bends and brightens what is under it; a thin specular line
     that catches the light top left and bottom right and turns with the
     tilt of the column (--ry, from the tilt script); a soft shadow under */
  .note{
    position:absolute;left:50%;top:50%;translate:-50% -50%;width:775px;
    padding:24px 28px;border-radius:999px;
    display:flex;flex-direction:column;align-items:flex-start;
    box-shadow:0 12px 32px -18px rgba(0,0,0,.16),0 1px 4px -2px rgba(0,0,0,.06);
  }
  .note>.glass,.note>.lens,.note>.rim{position:absolute;inset:0;border-radius:inherit;pointer-events:none;}
  /* the body: a little frost, colours kept, and a smoky tint — over the
     white background the white text needs it, as iOS glass darkens over
     light content */
  .note>.glass{
    -webkit-backdrop-filter:blur(16px) saturate(135%) brightness(1.02);backdrop-filter:blur(16px) saturate(135%) brightness(1.02);
    background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02) 55%,rgba(255,255,255,.05)),rgba(28,28,34,.19);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(255,255,255,.05);
  }
  /* the thick edge: a band along the rim, more frosted and brighter, as
     glass is where it curves away */
  .note>.lens{
    -webkit-backdrop-filter:blur(6px) saturate(130%) brightness(1.05);backdrop-filter:blur(6px) saturate(130%) brightness(1.05);
    -webkit-mask:linear-gradient(180deg,#000,transparent 12px,transparent calc(100% - 12px),#000),
                 linear-gradient(90deg,#000,transparent 28px,transparent calc(100% - 28px),#000);
            mask:linear-gradient(180deg,#000,transparent 12px,transparent calc(100% - 12px),#000),
                 linear-gradient(90deg,#000,transparent 28px,transparent calc(100% - 28px),#000);
  }
  /* the specular line: one hairline, bright where the light hits */
  .note>.rim{
    padding:1px;
    background:linear-gradient(calc(118deg + var(--ry,0deg)*6),
      rgba(255,255,255,.5),rgba(255,255,255,.12) 14%,rgba(255,255,255,.04) 38%,
      rgba(255,255,255,.04) 62%,rgba(255,255,255,.12) 86%,rgba(255,255,255,.32));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
            mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  }
  .note .row{position:relative;width:100%;display:flex;align-items:center;justify-content:space-between;}
  .note p{white-space:nowrap;letter-spacing:-.4px;font-family:-apple-system,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;}
  .note .who{font-size:16px;line-height:21px;font-weight:590;color:#fff;}
  .note .lock-i{display:block;width:13px;height:17px;color:#fff;}
  .note .what{font-size:15px;line-height:20px;font-weight:510;color:rgba(255,255,255,.6);}

<script>
/* ── the background ── work5's light mode, as it is there: white, four
   washes of colour (each fading out at 70% of its radii) that lean
   toward the pointer and ease after it. work5 repaints one big gradient
   every frame; here each wash is its own layer, drawn at a quarter size
   and scaled up (a soft gradient loses nothing), only ever moved, and
   still once it has caught up. */
(()=>{
  const iri=document.getElementById('iri');
  const DEF=[
    {x:50,y:100,ax:.28, ay:.22, ease:.022,c:'220,180,60', op:.22,ex:120,ey:100},
    {x:20,y:60, ax:-.30,ay:.26, ease:.018,c:'200,160,210',op:.18,ex:110,ey:95},
    {x:80,y:40, ax:.26, ay:-.28,ease:.02, c:'160,210,200',op:.16,ex:105,ey:90},
    {x:50,y:50, ax:.13, ay:.12, ease:.013,c:'210,200,190',op:.13,ex:120,ey:110},
  ];
  const S=4;
  const blobs=DEF.map(d=>{
    const el=document.createElement('i');
    el.style.background=`radial-gradient(closest-side,rgba(${d.c},${d.op}) 0%,transparent 70%)`;
    iri.appendChild(el);
    return{d,el,x:d.x,y:d.y};
  });
  let W=0,H=0,mx=.5,my=.5,running=false,last=0;
  const size=()=>{
    W=innerWidth;H=innerHeight;
    blobs.forEach(({d,el})=>{el.style.width=(2*d.ex/100*W/S)+'px';el.style.height=(2*d.ey/100*H/S)+'px';});
  };
  const place=b=>{
    const rx=b.d.ex/100*W,ry=b.d.ey/100*H;
    b.el.style.transform=`translate3d(${(b.x/100*W-rx).toFixed(1)}px,${(b.y/100*H-ry).toFixed(1)}px,0) scale(${S})`;
  };
  const tick=now=>{
    const f=last?Math.min(3,(now-last)/16.67):1; last=now;
    let moving=false;
    blobs.forEach(b=>{
      const tx=b.d.x+(mx-.5)*b.d.ax*100,ty=b.d.y+(my-.5)*b.d.ay*100,e=1-Math.pow(1-b.d.ease,f);
      b.x+=(tx-b.x)*e;b.y+=(ty-b.y)*e;
      if(Math.abs(tx-b.x)>.02||Math.abs(ty-b.y)>.02)moving=true;
      place(b);
    });
    running=moving;
    if(moving)requestAnimationFrame(tick);else last=0;
  };
  const wake=()=>{if(!running){running=true;requestAnimationFrame(tick);}};
  size();blobs.forEach(place);
  addEventListener('resize',()=>{size();blobs.forEach(place);});
  addEventListener('pointermove',e=>{mx=e.clientX/W;my=e.clientY/H;wake();},{passive:true});
})();
</script>

<script>
/* the 600×1081 column scaled to the window, as large as it fits — with room for the notification, 775 wide, that spills past it */
(()=>{
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerHeight/1081,innerWidth/823));
  fit();addEventListener('resize',fit);
})();

/* the column turns a little toward the mouse, as if orbiting it:
   at most 5° each way, eased, still once it has caught up */
(()=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!matchMedia('(hover: hover)').matches)return;
  const st=document.getElementById('stage').style, MAX=5;
  let tx=0,ty=0,x=0,y=0,raf=0;
  const tick=()=>{
    x+=(tx-x)*.06; y+=(ty-y)*.06;
    st.setProperty('--ry',x.toFixed(3)+'deg');
    st.setProperty('--rx',y.toFixed(3)+'deg');
    raf=(Math.abs(tx-x)+Math.abs(ty-y)>.002)?requestAnimationFrame(tick):0;
  };
  const go=()=>{if(!raf)raf=requestAnimationFrame(tick);};
  addEventListener('pointermove',e=>{
    tx=(e.clientX/innerWidth-.5)*2*MAX;
    ty=-(e.clientY/innerHeight-.5)*2*MAX;
    go();
  },{passive:true});
  document.documentElement.addEventListener('pointerleave',()=>{tx=ty=0;go();});
})();
</script>
