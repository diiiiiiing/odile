<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Thomas Ding — Website closed</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="closed/lockscreen.jpg" as="image">
<style>
  /* Website closed — from Figma, PORTFOLIO-CLEAN › COMMERCIAL—HOME (125:42851).
     The 1920×1081 frame is white with one 600×1081 column in its middle:
     a lock screen, a notification over it, the Siri orb at the bottom.
     That column is laid out at its Figma size and scaled to fit the
     window (see the script). */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#fff;overflow:hidden;}
  body{-webkit-font-smoothing:antialiased;}
  img{display:block;max-width:none;}

  #stage{
    position:fixed;left:50%;top:50%;width:600px;height:1081px;
    transform:translate(-50%,-50%) scale(var(--s,1)) perspective(2600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  }

  /* ── the phone ── */
  .phone-col{position:absolute;inset:0;padding:24px;display:flex;flex-direction:column;gap:24px;border-radius:40px;}
  .phone{position:relative;flex:1 0 0;min-height:1px;width:100%;border-radius:32px;}
  .lock{position:absolute;inset:0;overflow:clip;border-radius:48px;background:rgba(128,128,128,.3);}
  .lock>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
  .btn{position:absolute;bottom:50px;width:50px;height:50px;}
  .btn img{position:absolute;inset:0;width:100%;height:100%;}
  .btn.cam{right:46px;}
  .btn.torch{left:46px;}
  .swipe{position:absolute;top:43.8px;right:47.8px;width:48px;height:2.333px;border-radius:1.167px;background:#fff;opacity:.35;-webkit-backdrop-filter:blur(14.951px);backdrop-filter:blur(14.951px);}
  .status{position:absolute;left:0;right:0;top:0;height:53px;}
  .status>*{position:absolute;translate:0 -50%;}
  .status img{position:absolute;inset:0;width:100%;height:100%;}
  .bat-border{right:34.8px;top:calc(50% + 2.6px);width:25px;height:13px;border:1px solid #fff;border-radius:4.3px;opacity:.35;}
  .bat-cap{right:32.57px;top:calc(50% + 2.77px);width:1.328px;height:4px;}
  .bat-fill{right:37px;top:calc(50% + 2.6px);width:21px;height:9px;border-radius:2.5px;background:#fff;}
  .wifi{right:67.16px;top:calc(50% + 2.75px);width:17.142px;height:12.1px;}
  .cell{right:91.8px;top:calc(50% + 2.6px);width:19.2px;height:12px;}
  .home-ind{position:absolute;inset:97.54% 0 0 0;}
  .home-ind i{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:139px;height:5px;border-radius:100px;background:#fff;}

  /* ── the orb ── drawn live in a canvas (see the script): a dark glass
     sphere, coloured ribbons swirling round it on tilted orbits, added
     together so they turn white where they cross, a core that swells
     as if Siri were speaking, and a glass rim */
  .siri{position:absolute;left:50%;bottom:61px;width:150px;height:150px;translate:-50% 0;border-radius:50%;}
  .siri canvas{display:block;width:100%;height:100%;}

  /* ── the notification ── */
  .note{
    position:absolute;left:50%;top:50%;translate:-50% -50%;width:456px;
    padding:24px;border-radius:40px;border:1.4px solid rgba(255,255,255,.4);
    display:flex;flex-direction:column;align-items:flex-start;
  }
  .note::before{
    content:"";position:absolute;inset:0;border-radius:40px;pointer-events:none;
    background:rgba(128,128,128,.3);mix-blend-mode:luminosity;
    -webkit-backdrop-filter:blur(50px);backdrop-filter:blur(50px);
  }
  .note .row{position:relative;width:100%;display:flex;align-items:center;justify-content:space-between;}
  .note p{white-space:nowrap;letter-spacing:-.4px;font-family:-apple-system,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;}
  .note .who{font-size:16px;line-height:21px;font-weight:590;color:#fff;}
  .note .what{font-size:15px;line-height:20px;font-weight:510;color:rgba(255,255,255,.6);}

</style>
</head>
<body>
<main id="stage" aria-label="Thomas Ding — website closed">

  <div class="phone-col">
    <div class="phone">
      <div class="lock">
        <img class="bg" src="closed/lockscreen.jpg" alt="">
        <div class="btn cam"><img src="closed/camera.svg" alt=""></div>
        <div class="btn torch"><img src="closed/flashlight.svg" alt=""></div>
        <div class="swipe"></div>
        <div class="status">
          <div class="bat-border"></div>
          <div class="bat-cap"><img src="closed/battery-cap.svg" alt=""></div>
          <div class="bat-fill"></div>
          <div class="wifi"><img src="closed/wifi.svg" alt=""></div>
          <div class="cell"><img src="closed/cellular.svg" alt=""></div>
        </div>
      </div>
      <div class="home-ind"><i></i></div>
    </div>
  </div>

  <div class="siri" aria-hidden="true"><canvas></canvas></div>

  <div class="note" role="status">
    <div class="row">
      <p class="who">Thomas:Ding</p>
      <p class="what">Website closed</p>
    </div>
  </div>

</main>
<script>
/* the 600×1081 column scaled to the window, as large as it fits */
(()=>{
  const fit=()=>document.documentElement.style.setProperty('--s',Math.min(innerHeight/1081,innerWidth/600));
  fit();addEventListener('resize',fit);
})();

/* the column turns a little toward the mouse, as if orbiting it:
   at most 5° each way, eased, still once it has caught up */
(()=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!matchMedia('(hover: hover)').matches)return;
  const st=document.getElementById('stage').style, MAX=5;
  let tx=0,ty=0,x=0,y=0,raf=0;
  const tick=()=>{
    x+=(tx-x)*.06; y+=(ty-y)*.06;
    st.setProperty('--ry',x.toFixed(3)+'deg');
    st.setProperty('--rx',y.toFixed(3)+'deg');
    raf=(Math.abs(tx-x)+Math.abs(ty-y)>.002)?requestAnimationFrame(tick):0;
  };
  const go=()=>{if(!raf)raf=requestAnimationFrame(tick);};
  addEventListener('pointermove',e=>{
    tx=(e.clientX/innerWidth-.5)*2*MAX;
    ty=-(e.clientY/innerHeight-.5)*2*MAX;
    go();
  },{passive:true});
  document.documentElement.addEventListener('pointerleave',()=>{tx=ty=0;go();});
})();

/* Siri. Each ribbon is a soft arc drawn once into its own sprite; every
   frame the sprites are turned round the centre, squashed by a tilt that
   wanders (so each reads as a ring round a sphere seen at an angle) and
   added together. A made-up voice level drives size, speed and the core. */
(()=>{
  const cv=document.querySelector('.siri canvas'), ctx=cv.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const D=150, TAU=Math.PI*2;
  const RIB=[ // colour, arc length, thickness, radius, spin (turns/s), tilt speed, phase
    {c:[255, 46,140], len:2.6, w:.36, r:.54, spin: .22, tilt:.19, ph:0.0, a:1},
    {c:[ 48,105,255], len:2.9, w:.40, r:.50, spin:-.17, tilt:.23, ph:2.1, a:1},
    {c:[ 32,212,236], len:2.3, w:.32, r:.56, spin: .27, tilt:.15, ph:4.0, a:.95},
    {c:[150, 64,255], len:2.6, w:.34, r:.44, spin:-.24, tilt:.27, ph:1.3, a:.8},
    {c:[ 72,236,172], len:1.8, w:.26, r:.50, spin: .19, tilt:.21, ph:5.2, a:.5},
  ];
  let px=1, sprites=[];
  const sprite=(rb)=>{
    const o=document.createElement('canvas'); o.width=o.height=px;
    const g=o.getContext('2d'), R=px/2, N=48;
    for(let i=0;i<=N;i++){
      const u=i/N, p=Math.sin(Math.PI*u), ang=(u-.5)*rb.len;
      const x=R+Math.cos(ang)*rb.r*R, y=R+Math.sin(ang)*rb.r*R;
      const rad=rb.w*R*(.35+.65*p), al=.21*Math.pow(p,1.2);
      const gr=g.createRadialGradient(x,y,0,x,y,rad);
      gr.addColorStop(0,`rgba(${rb.c},${al})`);
      gr.addColorStop(.45,`rgba(${rb.c},${al*.55})`);
      gr.addColorStop(1,`rgba(${rb.c},0)`);
      g.fillStyle=gr; g.beginPath(); g.arc(x,y,rad,0,TAU); g.fill();
    }
    return o;
  };
  const size=()=>{
    const s=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s'))||1;
    const n=Math.round(D*s*(devicePixelRatio||1));
    if(n===px)return; px=cv.width=cv.height=n; sprites=RIB.map(sprite);
  };
  // a voice: syllables (fast wobble) inside phrases (slow gate), never quite silent
  const voice=t=>{
    const syl=(Math.sin(t*7.1)+Math.sin(t*11.3+1.7)+Math.sin(t*4.7+.6))/3;
    const x=Math.sin(t*.9)*.5+Math.sin(t*.37+2)*.5, gate=Math.min(1,Math.max(0,(x+.15)/.6));
    return .18+.82*gate*gate*(3-2*gate)*(.55+.45*syl);
  };
  let last=0, ph=RIB.map(r=>r.ph), lv=.3;
  const frame=now=>{
    const t=now/1000, dt=Math.min(.05,last?t-last:0); last=t;
    lv+=(voice(t)-lv)*Math.min(1,dt*9);
    const R=px/2;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation='source-over';
    ctx.clearRect(0,0,px,px);
    ctx.save();
    ctx.beginPath(); ctx.arc(R,R,R,0,TAU); ctx.clip();
    // the glass: dark, a little blue, deeper at the edge
    let g=ctx.createRadialGradient(R*.85,R*.75,0,R,R,R);
    g.addColorStop(0,'rgba(18,16,40,.92)'); g.addColorStop(.7,'rgba(6,6,20,.95)'); g.addColorStop(1,'rgba(0,0,8,.98)');
    ctx.fillStyle=g; ctx.fillRect(0,0,px,px);
    // the ribbons, added together
    ctx.globalCompositeOperation='lighter';
    const grow=.92+.22*lv;
    RIB.forEach((rb,i)=>{
      ph[i]+=dt*TAU*rb.spin*(.55+.9*lv);
      const axis=t*rb.tilt+rb.ph, squash=.48+.52*Math.abs(Math.cos(t*rb.tilt*1.6+rb.ph*2));
      const k=grow*(1+.06*Math.sin(t*1.3+i));
      ctx.setTransform(1,0,0,1,R,R);
      ctx.rotate(axis); ctx.scale(k,k*squash); ctx.rotate(ph[i]-axis);
      ctx.globalAlpha=rb.a*(.75+.25*squash);
      ctx.drawImage(sprites[i],-R,-R);
    });
    ctx.globalAlpha=1; ctx.setTransform(1,0,0,1,0,0);
    // the core: white light that swells with the voice
    const cr=R*(.22+.3*lv);
    g=ctx.createRadialGradient(R,R,0,R,R,cr);
    g.addColorStop(0,`rgba(255,255,255,${.25+.6*lv})`); g.addColorStop(.4,`rgba(235,230,255,${.12+.3*lv})`); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,px,px);
    // depth: the edge of the ball darkens, then catches a cold fresnel light
    ctx.globalCompositeOperation='source-over';
    g=ctx.createRadialGradient(R,R,R*.78,R,R,R);
    g.addColorStop(0,'rgba(0,0,10,0)'); g.addColorStop(1,'rgba(0,0,10,.3)');
    ctx.fillStyle=g; ctx.fillRect(0,0,px,px);
    ctx.globalCompositeOperation='lighter';
    g=ctx.createRadialGradient(R,R,R*.86,R,R,R);
    g.addColorStop(0,'rgba(120,150,255,0)'); g.addColorStop(1,'rgba(150,170,255,.1)');
    ctx.fillStyle=g; ctx.fillRect(0,0,px,px);
    // a soft highlight up top, as on glass
    g=ctx.createRadialGradient(R*.82,R*.42,0,R*.82,R*.42,R*.42);
    g.addColorStop(0,'rgba(255,255,255,.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,px,px);
    ctx.restore();
    // the rim
    ctx.globalCompositeOperation='source-over';
    ctx.lineWidth=Math.max(1,px/150);
    g=ctx.createLinearGradient(0,0,0,px);
    g.addColorStop(0,'rgba(255,255,255,.2)'); g.addColorStop(.5,'rgba(255,255,255,.04)'); g.addColorStop(1,'rgba(255,255,255,.12)');
    ctx.strokeStyle=g; ctx.beginPath(); ctx.arc(R,R,R-ctx.lineWidth/2,0,TAU); ctx.stroke();
    if(!still)requestAnimationFrame(frame);
  };
  size(); addEventListener('resize',size);
  if(still)frame(4200); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
