<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODILE — WORK</title>
<style>
  :root{
    --bg:#e8e7e3; --fg:#0a0a0a;
    --dim1:rgba(0,0,0,0.65); --dim2:rgba(0,0,0,0.28); --hl:rgba(0,0,0,0.88);
    --pad:36px; --font:-apple-system,'Helvetica Neue',sans-serif; --fs:12px; --nav:50px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;
    font-family:var(--font);font-weight:300;font-size:var(--fs);
    color:var(--dim1);cursor:none;}
  body{animation:fadeIn .6s ease both;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  #cur{position:fixed;width:5px;height:5px;background:#E5FF00;
    box-shadow:0 0 5px 0px #E5FF0066;
    pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
  #overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;
    opacity:0;pointer-events:none;transition:opacity .7s ease;}
  #overlay.on{opacity:1;pointer-events:auto;}

  /* NAV */
  #topNav{
    position:fixed;top:0;left:0;right:0;height:var(--nav);
    padding:0 var(--pad);display:flex;align-items:center;z-index:400;
  }
  #navHome{color:var(--dim2);text-decoration:none;cursor:none;transition:color .2s;}
  #navHome:hover{color:var(--dim1);}
  #navSep{color:var(--dim2);margin:0 2px;}
  #navSection{color:var(--dim1);}

  /* SCENE — :D tiles */
  #scene{
    position:fixed;inset:0;z-index:1;overflow:hidden;
    transition:opacity .6s ease;
  }
  #scene.dimmed{opacity:0.07;}

  .img-tile{
    position:absolute;cursor:none;overflow:hidden;
    transition:transform .28s cubic-bezier(0.22,1,0.36,1), opacity .5s ease;
    opacity:0;
  }
  .img-tile.visible{opacity:1;}
  .img-tile:hover{transform:scale(1.08) !important;z-index:80;}
  .img-tile{position:relative;}
  .tile-label{
    position:absolute;bottom:0;left:0;right:0;
    padding:18px 6px 6px;
    background:linear-gradient(transparent,rgba(0,0,0,0.32));
    color:rgba(255,255,255,0.92);
    font-size:var(--fs);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    opacity:0;transition:opacity .2s ease;
    pointer-events:none;
  }
  .img-tile:hover .tile-label{opacity:1;}

  /* ── INDEX PANEL ── */
  #indexPanel{
    position:fixed;left:0;top:0;bottom:0;
    width:260px;z-index:20;
    pointer-events:none;opacity:0;
    transform:translateX(-16px);
    transition:opacity .4s ease,transform .45s cubic-bezier(0.16,1,0.3,1);
    background:rgba(232,231,227,0.95);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    overflow-y:auto;overflow-x:hidden;
    padding:calc(var(--nav) + 20px) 28px 80px;
  }
  #indexPanel.open{opacity:1;pointer-events:auto;transform:translateX(0);}
  .cat-group{border-bottom:1px solid rgba(0,0,0,.1);}
  .cat-hd{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;cursor:none;user-select:none;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dim2);transition:color .2s;
  }
  .cat-hd:hover{color:var(--dim1);}
  .cat-arrow{display:inline-block;transition:transform .35s cubic-bezier(0.16,1,0.3,1);}
  .cat-group.open .cat-arrow{transform:rotate(90deg);}
  .cat-items{overflow:hidden;max-height:0;transition:max-height .5s cubic-bezier(0.16,1,0.3,1);}
  .cat-group.open .cat-items{max-height:2000px;}
  .c-entry{padding:7px 0 6px;border-bottom:1px solid rgba(0,0,0,.05);cursor:none;}
  .c-entry:last-child{border-bottom:none;}
  .c-year{font-size:10px;letter-spacing:.06em;color:var(--dim2);margin-bottom:2px;}
  .c-title{font-size:13px;font-weight:300;color:var(--dim1);transition:color .15s;}
  .c-entry:hover .c-title,.c-entry.active .c-title{color:var(--hl);}
  #cornerThumb{
    position:fixed;bottom:var(--pad);right:var(--pad);
    width:140px;height:110px;overflow:hidden;
    opacity:0;transition:opacity .25s ease;
    pointer-events:none;z-index:25;
  }
  #cornerThumb img{width:100%;height:100%;object-fit:cover;display:block;}
  #cornerThumb.show{opacity:1;}

  /* TOGGLE */
  #toggleBtn{
    position:fixed;bottom:26px;left:var(--pad);
    cursor:none;z-index:500;user-select:none;
    color:var(--dim2);transition:color .2s;
  }
  #toggleBtn:hover{color:var(--dim1);}
  #toggleBtn.open{color:var(--hl);}

  /* no custom cursor on touch devices */
  @media (hover:none){
    #cur{display:none;}
    *,*::before,*::after{cursor:auto!important;}
  }
</style>
</head>
<body>
<div id="overlay"></div>
<script>window.addEventListener('pageshow',()=>{const o=document.getElementById('overlay');if(o)o.classList.remove('on');});</script>
<div id="cur"></div>

<nav id="topNav">
  <a id="navHome" href="odile_hub.html">odile.xyz</a>
  <span id="navSep"> / </span>
  <span id="navSection">work</span>
</nav>

<div id="scene"></div>

<div id="indexPanel"><div id="catMenu"></div></div>
<div id="cornerThumb"><img id="cornerImg" src="" alt=""></div>

<div id="toggleBtn">+ index</div>

<script>
/* cursor */
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{
  cur.style.left=e.clientX+'px';
  cur.style.top=e.clientY+'px';
});

document.getElementById('navHome').addEventListener('click',e=>{
  e.preventDefault();
  document.getElementById('overlay').classList.add('on');
  setTimeout(()=>{window.location.href='odile_hub.html';},700);
});


/* ── SANITY ── */
const PID='zgrgr7sj',DS='production';
const GROQ=`*[_type=="project"]|order(year desc){
  _id,title,"year":string(year),"tags":tags,
  "mediaImgs": media[_type=="image"].asset->{url},
  "imgs": images[].asset->{url}
}`;
let projects=[];
let imagePool=[]; // flat list of {url, projIdx}

async function loadFromSanity(){
  try{
    const res=await fetch(`https://${PID}.api.sanity.io/v2021-10-21/data/query/${DS}?query=${encodeURIComponent(GROQ)}`);
    const{result}=await res.json();
    if(result?.length){
      projects=result.map(p=>({
        _id:p._id||'',title:p.title||'(untitled)',
        year:p.year||'—',
        cat:Array.isArray(p.tags)&&p.tags.length?p.tags.join(', '):'—',
        tags:Array.isArray(p.tags)&&p.tags.length?p.tags:['—'],
      }));
      // flat pool of all images across all projects
      imagePool=result.flatMap((p,pi)=>{
        const urls=[
          ...(Array.isArray(p.mediaImgs)?p.mediaImgs.map(i=>i?.url).filter(Boolean):[]),
          ...(Array.isArray(p.imgs)?p.imgs.map(i=>i?.url).filter(Boolean):[]),
        ];
        return urls.map(url=>({url, projIdx:pi}));
      });
    }
  }catch(e){console.warn('[Sanity]',e.message);}
  buildScene();
  buildCatMenu();
}

/* ── SVG RECT DATA (viewBox 1440×1024) ── */
// Each entry: [x, y, w, h, rotation_deg]
// rotation pivot is always the rect's own top-left corner (x, y)
const SVG_RECTS=[
  [275.043,345.514,57.0157,71.2204,0],
  [385.883,781.863,57.0157,71.2204,90],
  [325.004,355.262,57.0157,71.2204,0],
  [376.135,831.824,57.0157,71.2204,90],
  [512.94,282.824,100.373,125.38,0],
  [570.213,311.135,100.373,125.38,0],
  [512.94,632.62,100.373,125.38,0],
  [563.127,706.444,100.373,125.38,0],
  [941.171,734.952,100.373,125.38,0],
  [991.357,672.263,100.373,125.38,0],
  [1041.54,581.559,100.373,125.38,0],
  [1041.54,334.836,100.373,125.38,0],
  [1012.75,229.882,100.373,125.38,0],
  [962.566,180.701,100.373,125.38,0],
  [546.066,581.559,100.373,125.38,0],
  [530,214.567,96.5676,166.626,-90],
  [651.856,228.985,96.5676,166.626,-90],
  [804.904,234.567,96.5676,166.626,-90],
  [503.96,513.302,96.5676,166.626,-90],
  [284.107,460.216,47.4023,81.792,-90],
  [271.18,790.928,47.4023,81.792,0],
  [512.94,311.135,96.5676,166.626,-90],
  [512.94,601.339,96.5676,166.626,-90],
  [1041.54,537.456,96.5676,166.626,-90],
  [1041.54,629.843,96.5676,166.626,-90],
  [824.731,886,96.5676,166.626,-90],
  [679.566,894.21,96.5676,166.626,-90],
  [530,891.584,96.5676,166.626,-90],
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function buildScene(){
  const scene=document.getElementById('scene');
  scene.innerHTML='';
  if(!imagePool.length&&!projects.length)return;

  const VW=window.innerWidth, VH=window.innerHeight;
  const sx=VW/1440, sy=VH/1024;

  // Shuffle image pool, cycle to fill all rects
  const pool=shuffle([...imagePool]);
  const rectOrder=shuffle([...Array(SVG_RECTS.length).keys()]);

  rectOrder.forEach((ri,i)=>{
    const [rx,ry,rw,rh,rot]=SVG_RECTS[ri];
    const entry=pool.length?pool[i%pool.length]:null;

    const tile=document.createElement('div');
    tile.className='img-tile';
    // Width fixed to SVG rect width; height = auto (real image ratio)
    tile.style.cssText=`
      left:${rx*sx}px; top:${ry*sy}px;
      width:${rw*sx}px;
    `;

    if(entry?.url){
      const img=document.createElement('img');
      img.src=entry.url;
      // display at natural ratio: width=100%, height=auto
      img.style.cssText='width:100%;height:auto;display:block;';
      img.onload=()=>tile.classList.add('visible');
      tile.appendChild(img);
    }else{
      const ph=document.createElement('div');
      ph.style.cssText=`width:100%;height:${rh*sy}px;background:rgba(0,0,0,0.06);display:block;`;
      tile.appendChild(ph);
      setTimeout(()=>tile.classList.add('visible'),50);
    }

    const delay=(rx/1440*0.6+ry/1024*0.3)*0.8;
    tile.style.transitionDelay=delay.toFixed(3)+'s';

    const projIdx=entry?.projIdx??0;
    const proj=projects[projIdx];
    if(proj){
      const lbl=document.createElement('div');
      lbl.className='tile-label';
      lbl.textContent=proj.title;
      tile.appendChild(lbl);
    }
    tile.addEventListener('click',()=>openProjectFromTile(projIdx));
    scene.appendChild(tile);
    tile.addEventListener('transitionend',()=>{tile.style.transitionDelay='0s';},{once:true});
  });
}

/* ── CATEGORY INDEX ── */
const cornerThumb=document.getElementById('cornerThumb');
const cornerImg=document.getElementById('cornerImg');

function buildCatMenu(){
  const menu=document.getElementById('catMenu');
  menu.innerHTML='';
  if(!projects.length)return;
  const catMap=new Map();
  projects.forEach((proj,i)=>{
    const key=proj.tags[0]||'—';
    if(!catMap.has(key))catMap.set(key,[]);
    catMap.get(key).push({proj,i});
  });
  catMap.forEach((items,catName)=>{
    const grp=document.createElement('div');
    grp.className='cat-group';
    grp.dataset.cat=catName;
    const hd=document.createElement('div');
    hd.className='cat-hd';
    hd.innerHTML=`<span>${catName}</span><span class="cat-arrow">›</span>`;
    hd.addEventListener('click',()=>grp.classList.toggle('open'));
    grp.appendChild(hd);
    const list=document.createElement('div');
    list.className='cat-items';
    items.forEach(({proj,i})=>{
      const ent=document.createElement('div');
      ent.className='c-entry';
      ent.dataset.idx=i;
      ent.innerHTML=`<div class="c-year">${proj.year}</div><div class="c-title">${proj.title}</div>`;
      ent.addEventListener('click',()=>goToProject(i));
      list.appendChild(ent);
    });
    grp.appendChild(list);
    menu.appendChild(grp);
  });
}

function openCatForProject(projIdx){
  const proj=projects[projIdx];
  if(!proj)return;
  const catKey=proj.tags[0]||'—';
  if(!indexOpen){
    indexOpen=true;
    toggleBtn.textContent='− index';
    toggleBtn.classList.add('open');
    indexPanel.classList.add('open');
  }
  const menu=document.getElementById('catMenu');
  const grp=menu.querySelector(`.cat-group[data-cat="${catKey}"]`);
  if(grp&&!grp.classList.contains('open'))grp.classList.add('open');
  menu.querySelectorAll('.c-entry').forEach(e=>e.classList.remove('active'));
  const activeEnt=menu.querySelector(`.c-entry[data-idx="${projIdx}"]`);
  if(activeEnt){
    activeEnt.classList.add('active');
    setTimeout(()=>activeEnt.scrollIntoView({block:'nearest',behavior:'smooth'}),200);
  }
}

function openProjectFromTile(projIdx){
  openCatForProject(projIdx);
  setTimeout(()=>goToProject(projIdx),700);
}

/* ── NAVIGATE ── */
function goToProject(i){
  document.getElementById('overlay').classList.add('on');
  setTimeout(()=>{
    const proj=projects[i],next=projects[(i+1)%projects.length];
    const q=new URLSearchParams({
      id:proj._id,title:proj.title,year:proj.year,cat:proj.cat,
      next:next.title,nextIndex:(i+1)%projects.length,index:i,
      projects:JSON.stringify(projects),
    });
    window.location.href='odile_project.html?'+q.toString();
  },300);
}

/* ── TOGGLE ── */
let indexOpen=false;
const toggleBtn=document.getElementById('toggleBtn');
const scene=document.getElementById('scene');
const indexPanel=document.getElementById('indexPanel');

toggleBtn.addEventListener('click',()=>{
  indexOpen=!indexOpen;
  toggleBtn.textContent=indexOpen?'− index':'+ index';
  toggleBtn.classList.toggle('open',indexOpen);
  scene.classList.toggle('dimmed',indexOpen);
  indexPanel.classList.toggle('open',indexOpen);
  if(!indexOpen){
    document.querySelectorAll('.c-entry.active').forEach(e=>e.classList.remove('active'));
  }
});

loadFromSanity();
</script>
</body>
</html>
