<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>thomasding.biz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
<link rel="preconnect" href="https://zgrgr7sj.api.sanity.io" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* work11 — thomasding.biz, reduced: one wireframe globe in deep blue, a
     list, one glass panel, and the binary tunnel between projects.
     Nothing else moves. */
  :root{--ink:#e6f2ff;--dim:rgba(200,222,255,.5);--cyan:#6ff3ff;--line:rgba(190,232,255,.55);--fs:12px;--c:14px;--pad:32px;}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#030a1c;}
  body{
    color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    font-size:var(--fs);line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background:radial-gradient(110% 85% at 64% 48%,#0c2f70 0%,#061943 40%,#030a1c 75%);
  }
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  a:focus-visible,button:focus-visible{outline:1px solid var(--cyan);outline-offset:3px;}
  ::selection{background:var(--cyan);color:#021;}

  #bg{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;transition:opacity .8s ease;}
  body.open #bg{opacity:.28;}
  #tunnel{position:fixed;inset:0;z-index:90;width:100%;height:100%;display:block;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  #tunnel.on{opacity:1;}

  /* ── TEXT ── */
  #side{position:fixed;left:var(--pad);top:var(--pad);bottom:var(--pad);z-index:20;width:260px;display:flex;flex-direction:column;}
  #brand{font-weight:500;letter-spacing:.02em;margin-bottom:36px;}
  #brand::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);margin-right:10px;vertical-align:1px;}
  #list{list-style:none;}
  #list a{display:flex;gap:14px;padding:1px 0;color:var(--dim);transition:color .2s;}
  #list a span:first-child{opacity:.6;}
  #list a:hover,#list a.on{color:var(--ink);}
  #list a.on span:last-child::after{content:' ←';color:var(--cyan);}
  #foot{margin-top:auto;color:var(--dim);}
  #foot a:hover{color:var(--ink);}
  #clock{margin-top:10px;}

  /* ── PANEL ── cut corners and a single hairline, nothing else */
  #panel{
    position:fixed;z-index:30;
    left:calc(var(--pad) + 300px);right:var(--pad);top:var(--pad);bottom:var(--pad);
    display:flex;flex-direction:column;gap:14px;padding:22px 24px 20px;
    clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));
    background:linear-gradient(170deg,rgba(40,90,190,.26),rgba(6,20,64,.55));
    opacity:0;pointer-events:none;transition:opacity .5s ease;
  }
  body.open #panel{opacity:1;pointer-events:auto;}
  #panel svg.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  #panel svg.frame path{fill:none;stroke:var(--line);stroke-width:1;}
  #stage{flex:1;min-height:0;position:relative;}
  .slot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s ease;}
  .slot.front{opacity:1;}
  .slot img,.slot video{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
  .slot img{cursor:pointer;}
  #meta{display:flex;align-items:baseline;gap:18px;flex:0 0 auto;}
  #title{font-weight:500;}
  #year,#count{color:var(--dim);}
  #nav{margin-left:auto;display:flex;gap:18px;}
  #nav button{color:var(--dim);}
  #nav button:hover{color:var(--cyan);}
  #nav button[hidden]{display:none;}
  #desc{flex:0 0 auto;max-width:78ch;max-height:7.5em;overflow:auto;color:var(--dim);scrollbar-width:none;}
  #desc::-webkit-scrollbar{display:none;}
  #desc p{margin-bottom:.4em;}
  #desc a{color:var(--ink);border-bottom:1px solid var(--line);}

  @media (max-width:760px){
    :root{--pad:18px;}
    html,body{overflow:auto;}
    #side{position:relative;left:auto;top:auto;bottom:auto;width:auto;padding:var(--pad);}
    #brand{margin-bottom:22px;}
    #foot{margin-top:24px;}
    #panel{position:relative;left:auto;right:auto;top:auto;bottom:auto;margin:0 10px 18px;display:none;}
    body.open #panel{display:flex;}
    #stage{flex:none;height:56vh;}
    #meta{flex-wrap:wrap;gap:6px 14px;}
    #desc{max-height:none;}
  }
  @media (prefers-reduced-motion:reduce){#bg,#panel,.slot{transition:none;}}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<aside id="side">
  <a href="#" id="brand">thomasding.biz</a>
  <ul id="list"></ul>
  <div id="foot">
    <div>thomas ding, multi-disciplinary designer at <a href="https://unveil.fr" target="_blank" rel="noopener">unveil®</a></div>
    <div><a href="mailto:thomasding227@gmail.com">thomasding227@gmail.com</a></div>
    <div><a href="https://instagram.com/diiiiiiiiiiiiing" target="_blank" rel="noopener">@diiiiiiiiiiiiing</a></div>
    <div id="clock"></div>
  </div>
</aside>

<section id="panel" aria-live="polite">
  <div id="stage"><div class="slot"></div><div class="slot"></div></div>
  <div id="meta">
    <span id="title"></span><span id="year"></span><span id="count"></span>
    <span id="nav"><button id="prev">‹ prev</button><button id="next">next ›</button><button id="close">close ×</button></span>
  </div>
  <div id="desc"></div>
</section>

<canvas id="tunnel"></canvas>

<script>
const $=s=>document.querySelector(s);
const mobile=()=>innerWidth<=760;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const nameOf=p=>p.displayTitle||p.client||p.title;
const pad2=n=>String(n).padStart(2,'0');
let projects=[],openIdx=null;
let mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;},{passive:true});

function sizedUrl(url,cssW,cssH){
  if(!/^https:\/\/cdn\.sanity\.io\/images\//.test(url)||/\.gif(\?|$)/i.test(url))return url;
  const d=window.devicePixelRatio||1;
  const b=v=>Math.min(2600,Math.max(100,Math.ceil(v*d/100)*100));
  return `${url}${url.includes('?')?'&':'?'}w=${b(cssW)}&h=${b(cssH)}&fit=max&auto=format&q=84`;
}

/* ── GLOBE ── one wireframe sphere, turning slowly; nothing else drawn */
const bg=$('#bg'),bx=bg.getContext('2d');
let W=0,H=0,DPR=1;
const NP=innerWidth<=760?140:220;
const sphere=[];
for(let i=0;i<NP;i++){
  const y=1-(i/(NP-1))*2,r=Math.sqrt(1-y*y),th=i*2.399963;
  sphere.push([Math.cos(th)*r,y,Math.sin(th)*r]);
}
const pairs=[];
for(let i=0;i<NP;i++)for(let j=i+1;j<NP;j++){
  const a=sphere[i],b=sphere[j];
  if(Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])<1.2*Math.sqrt(4*Math.PI/NP))pairs.push([i,j]);
}
const proj=new Float32Array(NP*3);
let smx=0,smy=0;
function drawGlobe(time){
  smx+=(mx-smx)*.03;smy+=(my-smy)*.03;
  bx.clearRect(0,0,W,H);
  const gx=W*(mobile()?.5:.62),gy=H*(mobile()?.4:.5),R=Math.min(W,H)*(mobile()?.34:.3);
  const ay=time*.00006+smx*.35,ax=-.3+smy*.2;
  const cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
  for(let i=0;i<NP;i++){
    const [x0,y0,z0]=sphere[i];
    const x1=x0*cy+z0*sy,z1=-x0*sy+z0*cy;
    const y2=y0*cx-z1*sx,z2=y0*sx+z1*cx;
    const f=2.6/(2.6+z2);
    proj[i*3]=gx+x1*R*f;proj[i*3+1]=gy+y2*R*f;proj[i*3+2]=z2;
  }
  for(let b=0;b<3;b++){
    bx.beginPath();
    for(const [i,j] of pairs){
      const z=(proj[i*3+2]+proj[j*3+2])/2;
      if(Math.min(2,Math.floor((1-z)/2*3))!==b)continue;
      bx.moveTo(proj[i*3],proj[i*3+1]);bx.lineTo(proj[j*3],proj[j*3+1]);
    }
    bx.strokeStyle=`rgba(150,210,255,${[.05,.13,.3][b]})`;
    bx.lineWidth=.8;
    bx.stroke();
  }
}

/* ── BINARY TUNNEL ── the one flourish kept, and shorter */
const tun=$('#tunnel');
const gl=tun.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});
let tProg=null,tU={},tEnd=0,tStart=0;
if(gl){
  const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs=`precision mediump float;uniform vec2 r;uniform float t;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float glyph(vec2 f,float d){vec2 p=f*2.-1.;p.x*=1.7;
    if(d<.5){float e=abs(length(p*vec2(1.,.72))-.62);return smoothstep(.2,.07,e);}
    float b=max(abs(p.x)-.16,abs(p.y)-.78);return smoothstep(.08,-.02,b);}
  void main(){
    vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;
    vec2 q=uv-vec2(sin(t*.9)*.15,cos(t*.7)*.1);
    float rad=max(length(q),.001),a=atan(q.y,q.x)/6.2831853+.5;
    float z=.32/rad+t*3.4;
    vec2 g=vec2(a*40.,z*2.4),id=floor(g),f=fract(g);
    float dig=glyph(f,step(.5,h(id)))*step(.35,h(id+7.3));
    float rail=smoothstep(0.,.05,abs(fract(a*10.)-.5)-.45);
    float depth=clamp(rad*2.2,0.,1.);
    vec3 col=vec3(.02,.07,.2)+vec3(.55,.85,1.)*dig*depth*.8+vec3(.35,1.,1.)*rail*depth*.7;
    col+=vec3(.7,.95,1.)*pow(max(0.,.2-rad)*5.,2.);
    gl_FragColor=vec4(col,1.);
  }`;
  const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;};
  tProg=gl.createProgram();
  gl.attachShader(tProg,sh(gl.VERTEX_SHADER,vs));gl.attachShader(tProg,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(tProg);
  if(!gl.getProgramParameter(tProg,gl.LINK_STATUS))tProg=null;
  else{
    gl.useProgram(tProg);
    const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(tProg,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    tU={r:gl.getUniformLocation(tProg,'r'),t:gl.getUniformLocation(tProg,'t')};
  }
}
function travel(ms,mid){
  if(!tProg||reduce){mid();return;}
  tStart=performance.now();tEnd=tStart+ms+250;
  tun.classList.add('on');
  setTimeout(mid,ms/2);
  setTimeout(()=>tun.classList.remove('on'),ms);
}

function resize(){
  DPR=Math.min(1.5,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  bg.width=W*DPR;bg.height=H*DPR;bx.setTransform(DPR,0,0,DPR,0,0);
  tun.width=Math.ceil(W*.75);tun.height=Math.ceil(H*.75);
  if(gl)gl.viewport(0,0,tun.width,tun.height);
  drawFrame();
}
function loop(now){
  drawGlobe(now);
  if(tProg&&now<tEnd){
    gl.uniform2f(tU.r,tun.width,tun.height);
    gl.uniform1f(tU.t,(now-tStart)/1000);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  requestAnimationFrame(loop);
}

/* ── PANEL OUTLINE ── */
const panel=$('#panel');
function drawFrame(){
  let svg=panel.querySelector('svg.frame');
  if(!svg){svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','frame');panel.prepend(svg);}
  const w=panel.offsetWidth,h=panel.offsetHeight,c=14,o=.5;
  if(!w)return;
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.innerHTML=`<path d="M${c},${o}H${w-c}L${w-o},${c}V${h-c}L${w-c},${h-o}H${c}L${o},${h-c}V${c}Z"/>`;
}
new ResizeObserver(drawFrame).observe(panel);

/* ── LIST ── */
function buildList(){
  const ul=$('#list');
  ul.innerHTML='';
  projects.forEach((p,i)=>{
    const li=document.createElement('li');
    const a=document.createElement('a');
    a.href='#'+p.slug;
    a.innerHTML='<span></span><span></span>';
    a.firstChild.textContent=pad2(i+1);
    a.lastChild.textContent=nameOf(p).toLowerCase();
    a.addEventListener('click',e=>{e.preventDefault();openIdx===i?closeProject():openProject(i);});
    li.appendChild(a);
    ul.appendChild(li);
  });
}
function markList(){$('#list').querySelectorAll('a').forEach((a,i)=>a.classList.toggle('on',i===openIdx));}
$('#brand').addEventListener('click',e=>{e.preventDefault();closeProject();});

/* ── PROJECT ── */
let vList=[],vPos=-1,vFront=0,vToken=0;
const slots=[...document.querySelectorAll('.slot')];
function openProject(i,{push=true}={}){
  const p=projects[i];
  if(!p||i===openIdx)return;
  const wasOpen=openIdx!==null;
  openIdx=i;markList();
  travel(wasOpen?600:800,()=>{
    if(openIdx!==i)return;
    document.body.classList.add('open');
    $('#title').textContent=nameOf(p).toLowerCase();
    $('#year').textContent=[p.year,(p.tags||[]).join(', ')].filter(Boolean).join(' — ');
    const desc=$('#desc');desc.innerHTML='';desc.scrollTop=0;
    (p.description||[]).forEach(runs=>{
      const line=document.createElement('p');
      runs.forEach(run=>{
        if(run.href){const l=document.createElement('a');l.href=normalizeUrl(run.href);l.target='_blank';l.rel='noopener';l.textContent=run.text;line.appendChild(l);}
        else line.appendChild(document.createTextNode(run.text));
      });
      desc.appendChild(line);
    });
    if(p.link){const l=document.createElement('a');l.href=p.link;l.target='_blank';l.rel='noopener';l.textContent='visit ↗';desc.appendChild(l);}
    vList=p.media;vPos=-1;
    slots.forEach(clearSlot);
    if(vList.length)vGo(0);
    else $('#count').textContent='no media';
    $('#prev').hidden=$('#next').hidden=vList.length<2;
    drawFrame();
    if(mobile())requestAnimationFrame(()=>panel.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}));
  });
  document.title=`${nameOf(p).toLowerCase()} — thomasding.biz`;
  if(push&&p.slug)history.pushState(null,'','#'+p.slug);
}
function closeProject({push=true}={}){
  if(openIdx===null)return;
  openIdx=null;markList();
  document.body.classList.remove('open');
  vToken++;
  setTimeout(()=>{if(openIdx===null)slots.forEach(clearSlot);},500);
  document.title='thomasding.biz';
  if(push&&location.hash)history.pushState(null,'',location.pathname+location.search);
}
function clearSlot(s){
  s.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load();});
  s.innerHTML='';s.classList.remove('front');
}
function buildMedia(m,box){
  if(m.type==='image'){
    const img=document.createElement('img');
    img.alt='';img.draggable=false;
    const ready=new Promise(res=>{
      img.addEventListener('load',()=>{(img.decode?img.decode():Promise.resolve()).catch(()=>{}).then(res);setTimeout(res,300);},{once:true});
      img.addEventListener('error',res,{once:true});
      setTimeout(res,8000);
    });
    img.src=sizedUrl(m.url,box.w,box.h);
    return{el:img,ready};
  }
  const v=document.createElement('video');
  v.controls=true;v.loop=true;v.playsInline=true;v.autoplay=true;v.muted=true;
  v.controlsList='nodownload noremoteplayback';v.disablePictureInPicture=true;
  v.src=m.url;
  const ready=new Promise(res=>{v.addEventListener('loadeddata',res,{once:true});v.addEventListener('error',res,{once:true});setTimeout(res,5000);});
  return{el:v,ready};
}
function vGo(k){
  if(!vList.length)return;
  k=((k%vList.length)+vList.length)%vList.length;
  if(k===vPos)return;
  vPos=k;
  const stage=$('#stage');
  const back=slots[1-vFront],front=slots[vFront];
  clearSlot(back);
  const box={w:stage.clientWidth||900,h:stage.clientHeight||600};
  const{el,ready}=buildMedia(vList[k],box);
  back.appendChild(el);
  const my=++vToken;
  $('#count').textContent=`${pad2(k+1)}/${pad2(vList.length)}`;
  ready.then(()=>{
    if(my!==vToken)return;
    back.classList.add('front');front.classList.remove('front');
    front.querySelectorAll('video').forEach(v=>v.pause());
    back.querySelector('video')?.play().catch(()=>{});
    vFront=1-vFront;
  });
  if(vList[k+1]?.type==='image'){const pre=new Image();pre.src=sizedUrl(vList[k+1].url,box.w,box.h);}
}
$('#prev').addEventListener('click',()=>vGo(vPos-1));
$('#next').addEventListener('click',()=>vGo(vPos+1));
$('#close').addEventListener('click',()=>closeProject());
$('#stage').addEventListener('click',e=>{if(e.target.tagName==='IMG')vGo(vPos+1);});
let tsx=null;
$('#stage').addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;},{passive:true});
$('#stage').addEventListener('touchend',e=>{if(tsx===null)return;const d=e.changedTouches[0].clientX-tsx;tsx=null;if(Math.abs(d)>50)vGo(vPos+(d<0?1:-1));},{passive:true});
addEventListener('keydown',e=>{
  if(e.target.closest?.('video')||openIdx===null)return;
  if(e.key==='ArrowRight')vGo(vPos+1);
  else if(e.key==='ArrowLeft')vGo(vPos-1);
  else if(e.key==='Escape')closeProject();
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)document.querySelector('.slot.front video')?.play().catch(()=>{});
});
addEventListener('popstate',()=>{
  const slug=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===slug);
  if(i!==-1)openProject(i,{push:false});
  else closeProject({push:false});
});

const clockFmt=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit'});
function tick(){$('#clock').textContent='paris '+clockFmt.format(new Date());}

/* ── SANITY ── */
const PID='zgrgr7sj',DS='production';
const GROQ=`*[_type=="project"]|order(year desc){
  _id,title,client,displayTitle,"year":string(year),description,link,
  "tags":tags[]->{title},
  "media":media[]{
    _type,"hidden":hidden==true,
    _type=="image"=>{"url":asset->url},
    _type=="file"=>{"url":asset->url},
    _type=="mediaImage"=>{"url":image.asset->url},
    _type=="mediaVideo"=>{"url":video.asset->url}
  }
}`;
function normalizeUrl(href){return /^([a-z][a-z0-9+.-]*:|\/|#)/i.test(href)?href:'https://'+href;}
const SLUG_LETTERS={'ø':'o','œ':'oe','æ':'ae','ð':'d','þ':'th','ł':'l','ß':'ss'};
function slugify(s){
  return String(s||'').toLowerCase().replace(/[øœæðþłß]/g,c=>SLUG_LETTERS[c])
    .normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'project';
}
async function load(){
  try{
    const res=await fetch(`https://${PID}.api.sanity.io/v2021-10-21/data/query/${DS}?query=${encodeURIComponent(GROQ)}`);
    const{result}=await res.json();
    projects=(result||[]).map(p=>({
      title:p.title||'(untitled)',client:p.client||'',displayTitle:p.displayTitle||'',
      year:p.year||'',link:p.link||'',
      description:Array.isArray(p.description)
        ?p.description.filter(b=>b._type==='block'&&Array.isArray(b.children)).map(b=>{
            const defs=Object.fromEntries((b.markDefs||[]).map(d=>[d._key,d]));
            return b.children.map(c=>({text:c.text||'',href:(c.marks||[]).map(k=>defs[k]).find(d=>d&&d._type==='link')?.href||null}));
          }).filter(runs=>runs.some(r=>r.text.trim()))
        :[],
      tags:Array.isArray(p.tags)?p.tags.map(t=>(t?.title||'').toLowerCase().trim()).filter(Boolean):[],
      media:Array.isArray(p.media)?p.media.map(m=>{
        if(!m||m.hidden||!m.url)return null;
        if(m._type==='image'||m._type==='mediaImage')return{type:'image',url:m.url};
        if(m._type==='file'||m._type==='mediaVideo')return{type:'video',url:m.url};
        return null;
      }).filter(Boolean):[],
    }));
  }catch(e){console.warn('[Sanity]',e.message);}
  const seen=new Set();
  projects.forEach(p=>{let b=slugify(nameOf(p)),s=b,n=2;while(seen.has(s))s=b+'-'+(n++);seen.add(s);p.slug=s;});
  buildList();
  const slug=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===slug);
  if(i!==-1)openProject(i,{push:false});
}

resize();
addEventListener('resize',resize,{passive:true});
requestAnimationFrame(loop);
tick();setInterval(tick,10000);
load();
</script>
</body>
</html>
