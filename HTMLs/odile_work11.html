<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>thomas ding</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
<link rel="preconnect" href="https://zgrgr7sj.api.sanity.io" crossorigin>
<style>
  /* work11 — one media at a time, straight, large, and nothing moves
     until you ask it to. The page is typed rather than designed: default
     Times, old blue/purple links, and the whole archive laid out along
     the bottom edge as a ruler you can point at. */
  :root{--fs:15px;--pad:12px;}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#fff;overflow:hidden;}
  body{
    color:#000;font-family:'Times New Roman',Times,serif;
    font-size:var(--fs);line-height:1.3;
    text-transform:lowercase;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  a{color:#0000ee;text-decoration:underline;cursor:pointer;}
  a:visited{color:#551a8b;}
  a:active{color:#e00;}

  /* ── TEXT ── */
  #about,#projText{
    position:fixed;left:var(--pad);top:var(--pad);z-index:20;
    width:min(300px,calc(100vw - 2*var(--pad)));
  }
  #projText{display:none;}
  body.proj #about{display:none;}
  body.proj #projText{display:block;}
  #projText p{margin-bottom:.6em;}
  #projTitle{font-style:italic;}
  #index{
    position:fixed;right:var(--pad);top:var(--pad);z-index:20;
    text-align:right;list-style:none;
  }
  #index .here{color:#000;}

  /* ── STAGE ── two frames crossfading; whatever is in the front one
     simply stays there until you move on */
  #stage{position:fixed;inset:0;z-index:10;}
  .frame{
    position:absolute;left:50%;top:46%;translate:-50% -50%;
    opacity:0;transition:opacity .7s ease;
  }
  .frame.front{opacity:1;}
  .frame img,.frame video{
    display:block;width:auto;height:auto;
    max-width:62vw;max-height:66vh;
    -webkit-user-drag:none;user-select:none;
  }
  .frame img{cursor:pointer;}

  #caption{
    position:fixed;left:50%;bottom:40px;translate:-50% 0;z-index:20;
    text-align:center;white-space:nowrap;
  }
  #hint{font-style:italic;}

  /* ── RULER ── one mark per media across the whole width; the open
     project's marks are black, the current one stands taller */
  #ruler{position:fixed;left:0;right:0;bottom:0;height:24px;z-index:15;cursor:pointer;}
  #ruler i{
    position:absolute;bottom:0;width:1px;height:5px;background:#b8b8b8;
  }
  #ruler i.in{background:#000;}
  #ruler i.cur{height:14px;width:2px;background:#000;}
  #ruler b{
    position:absolute;bottom:0;height:24px;padding-left:4px;
    border-left:1px solid #000;font-weight:400;font-size:12px;line-height:1;
    pointer-events:none;
  }
  #tip{
    position:fixed;bottom:28px;z-index:25;translate:-50% 0;
    white-space:nowrap;font-size:12px;pointer-events:none;display:none;
    background:#fff;
  }

  /* on a phone it's simply a page: text, the media, the caption, the
     index, one after the other — a long description scrolls instead of
     running into the image */
  @media (max-width:700px),(hover:none){
    :root{--fs:14px;}
    html,body{height:auto;overflow:visible;}
    body{
      display:flex;flex-direction:column;min-height:100svh;
      padding:var(--pad) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
    }
    #about,#projText,#index,#caption{position:static;width:auto;translate:none;}
    #about,#projText{order:1;}
    #stage{order:2;position:relative;inset:auto;height:58svh;margin:18px calc(-1*var(--pad)) 10px;}
    .frame{top:50%;}
    .frame img,.frame video{max-width:calc(100vw - 2*var(--pad));max-height:58svh;}
    #caption{order:3;white-space:normal;}
    #index{order:4;text-align:left;margin-top:auto;padding-top:28px;}
    #index li{display:inline;}
    #index li:not(:last-child)::after{content:' / ';color:#000;}
    #ruler,#tip{display:none;}
  }
  @media (prefers-reduced-motion:reduce){.frame{transition:none;}}
</style>
</head>
<body>

<div id="about">
  thomas ding makes images, films and graphic design in paris.
  multi-disciplinary designer at <a href="https://unveil.fr" target="_blank" rel="noopener">unveil®</a>,
  before that women management and dream factory. born 2004.
  write to <a href="mailto:thomasding227@gmail.com">thomasding227@gmail.com</a>
  or find <a href="https://instagram.com/diiiiiiiiiiiiing" target="_blank" rel="noopener">@diiiiiiiiiiiiing</a>.
</div>
<div id="projText"></div>
<ul id="index"></ul>

<div id="stage"><div class="frame"></div><div class="frame"></div></div>
<div id="caption"><div id="capText">loading</div><div id="capNav"></div><div id="hint"></div></div>
<div id="ruler"></div>
<div id="tip"></div>

<script>
const stageEl=document.getElementById('stage');
const frames=[...stageEl.querySelectorAll('.frame')];
const capText=document.getElementById('capText');
const capNav=document.getElementById('capNav');
const hintEl=document.getElementById('hint');
const indexEl=document.getElementById('index');
const projTextEl=document.getElementById('projText');
const rulerEl=document.getElementById('ruler');
const tipEl=document.getElementById('tip');
const BASE_TITLE=document.title;
const touchy=matchMedia('(hover:none)').matches;
const nameOf=p=>p.displayTitle||p.client||p.title;

let projects=[];
let items=[];        // every media of every project: {g,p,m,k,n}
let seq=[];          // global indices currently being looked through
let pos=0;
let openIdx=null;
let moved=false;     // the hint goes once you've moved on once

function sizedUrl(url){
  if(!/^https:\/\/cdn\.sanity\.io\/images\//.test(url)||/\.gif(\?|$)/i.test(url))return url;
  const css=Math.max(innerWidth*.62,innerHeight*.66);
  const w=Math.min(2600,Math.max(600,Math.ceil(css*(window.devicePixelRatio||1)/200)*200));
  return `${url}${url.includes('?')?'&':'?'}w=${w}&h=${w}&fit=max&auto=format&q=85`;
}

/* ── SHOWING ONE MEDIA ── the next one is built in the back frame and
   only crossfades in once it can actually be seen, so there's never a
   blank or half-loaded moment in between */
let front=0,token=0;
function build(it){
  if(it.m.type==='image'){
    const img=document.createElement('img');
    img.alt='';img.draggable=false;
    /* waits for the decode so the crossfade never starts on a half-painted
       frame — but never on the decode alone: a background tab can hold it
       pending indefinitely, so a loaded image goes up regardless */
    const ready=new Promise(res=>{
      img.addEventListener('load',()=>{
        (img.decode?img.decode():Promise.resolve()).catch(()=>{}).then(res);
        setTimeout(res,300);
      },{once:true});
      img.addEventListener('error',res,{once:true});
      setTimeout(res,8000);
    });
    img.src=sizedUrl(it.m.url);
    return{el:img,ready};
  }
  const v=document.createElement('video');
  v.controls=true;v.loop=true;v.playsInline=true;v.autoplay=true;v.muted=true;
  v.controlsList='nodownload noremoteplayback';
  v.disablePictureInPicture=true;
  /* remembers whether a pause was yours, so coming back to the tab only
     restarts a film you hadn't stopped yourself */
  v.addEventListener('pause',()=>{if(!document.hidden&&!v._ours)v._userPaused=true;v._ours=false;});
  v.addEventListener('play',()=>{v._userPaused=false;});
  v.src=it.m.url;
  const ready=new Promise(res=>{
    v.addEventListener('loadeddata',res,{once:true});
    v.addEventListener('error',res,{once:true});
    setTimeout(res,4000);
  });
  return{el:v,ready};
}
function clearFrame(f){
  f.querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load();});
  f.innerHTML='';
}
function show(p,{instant=false}={}){
  if(!seq.length)return;
  pos=((p%seq.length)+seq.length)%seq.length;
  const it=items[seq[pos]];
  const my=++token;
  const back=frames[1-front];
  clearFrame(back);
  const{el,ready}=build(it);
  back.appendChild(el);
  back.dataset.g=it.g;
  caption(it);
  paintRuler();
  ready.then(()=>{
    if(my!==token)return;
    const old=frames[front];
    if(instant)frames.forEach(f=>{f.style.transition='none';});
    back.classList.add('front');
    old.classList.remove('front');
    old.querySelectorAll('video').forEach(v=>{v._ours=true;v.pause();});
    front=1-front;
    back.querySelector('video')?.play().catch(()=>{});
    if(instant){void back.offsetHeight;frames.forEach(f=>{f.style.transition='';});}
    setTimeout(()=>{if(my===token)clearFrame(old);},800);
  });
  preload();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const v=frames[front].querySelector('video');
  if(v&&v.paused&&!v._userPaused)v.play().catch(()=>{});
});
function preload(){
  [1,2,-1].forEach(d=>{
    const it=items[seq[((pos+d)%seq.length+seq.length)%seq.length]];
    if(it&&it.m.type==='image'){const i=new Image();i.decoding='async';i.src=sizedUrl(it.m.url);}
  });
}
function go(d){
  if(!seq.length)return;
  if(!moved){moved=true;hintEl.textContent='';}
  show(pos+d);
}

/* ── CAPTION ── where you are, and the only two ways onward */
function caption(it){
  const p=projects[it.p];
  capText.innerHTML='';
  if(openIdx===null){
    const a=document.createElement('a');
    a.href='#'+p.slug;a.textContent=nameOf(p);
    a.addEventListener('click',e=>{e.preventDefault();openProject(it.p,{keep:it.g});});
    capText.appendChild(a);
  }else capText.appendChild(document.createTextNode(nameOf(p)));
  capText.appendChild(document.createTextNode(`${p.year?', '+p.year:''} — ${it.k+1} of ${it.n}`));
  capNav.innerHTML='';
  if(seq.length>1){
    const prev=document.createElement('a');prev.href='#';prev.textContent='← previous';
    prev.addEventListener('click',e=>{e.preventDefault();go(-1);});
    const next=document.createElement('a');next.href='#';next.textContent='next →';
    next.addEventListener('click',e=>{e.preventDefault();go(1);});
    capNav.append(prev,document.createTextNode('   '),next);
    capNav.style.whiteSpace='pre';
  }
}

/* clicking a still turns to the next one; a video's own click stays its
   own (play/pause), so a film is never skipped by accident */
stageEl.addEventListener('click',e=>{if(e.target.tagName==='IMG')go(1);});
let sx=null,sy=null;
stageEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stageEl.addEventListener('touchend',e=>{
  if(sx===null)return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);
},{passive:true});
window.addEventListener('keydown',e=>{
  if(e.target.closest?.('video'))return;
  if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='Escape')closeProject();
});

/* ── RULER ── */
function buildRuler(){
  rulerEl.innerHTML='';
  let last=null;
  items.forEach(it=>{
    const x=(it.g+.5)/items.length*100;
    const y=projects[it.p].year;
    if(y&&y!==last){
      last=y;
      const b=document.createElement('b');
      b.style.left=(it.g/items.length*100)+'%';
      b.textContent=y;
      rulerEl.appendChild(b);
    }
    const i=document.createElement('i');
    i.style.left=x+'%';
    rulerEl.appendChild(i);
  });
}
function paintRuler(){
  const marks=rulerEl.querySelectorAll('i');
  if(!marks.length)return;
  const cur=seq[pos];
  marks.forEach((m,g)=>{
    m.classList.toggle('cur',g===cur);
    m.classList.toggle('in',openIdx===null||items[g].p===openIdx);
  });
}
const gAt=x=>Math.max(0,Math.min(items.length-1,Math.floor(x/innerWidth*items.length)));
rulerEl.addEventListener('mousemove',e=>{
  const it=items[gAt(e.clientX)];
  if(!it)return;
  tipEl.textContent=`${nameOf(projects[it.p])}, ${it.k+1} of ${it.n}`;
  tipEl.style.left=Math.min(innerWidth-80,Math.max(80,e.clientX))+'px';
  tipEl.style.display='block';
});
rulerEl.addEventListener('mouseleave',()=>{tipEl.style.display='none';});
rulerEl.addEventListener('click',e=>{
  const it=items[gAt(e.clientX)];
  if(!it)return;
  if(!moved){moved=true;hintEl.textContent='';}
  if(openIdx!==null&&it.p!==openIdx){openProject(it.p,{keep:it.g});return;}
  show(seq.indexOf(it.g));
});

/* ── PROJECT ── only its media, its text in the corner */
function openProject(i,{push=true,keep=null}={}){
  const p=projects[i];
  if(!p)return;
  openIdx=i;
  document.body.classList.add('proj');
  seq=items.filter(it=>it.p===i).map(it=>it.g);

  projTextEl.innerHTML='';
  const t=document.createElement('p');
  t.id='projTitle';
  t.textContent=[nameOf(p),p.year].filter(Boolean).join(', ');
  projTextEl.appendChild(t);
  if(p.tags?.length){const m=document.createElement('p');m.textContent=p.tags.join(', ');projTextEl.appendChild(m);}
  (p.description||[]).forEach(runs=>{
    const line=document.createElement('p');
    runs.forEach(run=>{
      if(run.href){
        const a=document.createElement('a');
        a.href=normalizeUrl(run.href);a.target='_blank';a.rel='noopener';
        a.textContent=run.text;line.appendChild(a);
      }else line.appendChild(document.createTextNode(run.text));
    });
    projTextEl.appendChild(line);
  });
  const nav=document.createElement('p');
  if(p.link){
    const a=document.createElement('a');
    a.href=p.link;a.target='_blank';a.rel='noopener';a.textContent='visit';
    nav.append(a,document.createTextNode(' / '));
  }
  const back=document.createElement('a');
  back.href='#';back.textContent='back to everything';
  back.addEventListener('click',e=>{e.preventDefault();closeProject();});
  nav.appendChild(back);
  projTextEl.appendChild(nav);

  markIndex();
  document.title=`${nameOf(p)} — ${BASE_TITLE}`.toLowerCase();
  if(push&&p.slug)history.pushState(null,'','#'+p.slug);
  if(!seq.length){
    frames.forEach(clearFrame);
    capText.textContent=`${nameOf(p)} — nothing here yet`;capNav.innerHTML='';
    paintRuler();
    return;
  }
  const at=keep!==null&&seq.includes(keep)?seq.indexOf(keep):0;
  if(frames[front].firstElementChild&&items[seq[at]]&&+frames[front].dataset.g===seq[at]){pos=at;caption(items[seq[at]]);paintRuler();}
  else show(at);
}
function closeProject({push=true}={}){
  if(openIdx===null)return;
  const keepG=seq[pos];
  openIdx=null;
  document.body.classList.remove('proj');
  seq=items.map(it=>it.g);
  pos=Math.max(0,seq.indexOf(keepG));
  if(items[seq[pos]])caption(items[seq[pos]]);
  paintRuler();
  markIndex();
  document.title=BASE_TITLE;
  if(push&&location.hash)history.pushState(null,'',location.pathname+location.search);
}
window.addEventListener('popstate',()=>{
  const slug=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===slug);
  if(i!==-1){if(i!==openIdx)openProject(i,{push:false});}
  else closeProject({push:false});
});

/* ── INDEX ── */
function buildIndex(){
  indexEl.innerHTML='';
  const all=document.createElement('li');
  const a=document.createElement('a');
  a.href=location.pathname+location.search;a.textContent=`everything (${items.length})`;
  a.addEventListener('click',e=>{e.preventDefault();closeProject();});
  all.appendChild(a);
  indexEl.appendChild(all);
  projects.forEach((p,i)=>{
    const li=document.createElement('li');
    const link=document.createElement('a');
    link.href='#'+p.slug;
    link.textContent=[nameOf(p),p.year?`(${p.year})`:''].filter(Boolean).join(' ');
    link.addEventListener('click',e=>{e.preventDefault();openProject(i);});
    const here=document.createElement('span');
    here.className='here';
    li.append(link,here);
    indexEl.appendChild(li);
  });
  markIndex();
}
function markIndex(){
  [...indexEl.querySelectorAll('.here')].forEach((s,i)=>{s.textContent=i===openIdx?' ← you are here':'';});
}

/* ── SANITY ── same content and query as the other work pages */
const PID='zgrgr7sj',DS='production';
const GROQ=`*[_type=="project"]|order(year desc){
  _id,title,subtitle,client,displayTitle,"year":string(year),"favorite":favorite==true,description,link,
  "tags":tags[]->{title},
  "media":media[]{
    _type,"hidden":hidden==true,
    _type=="image"=>{"url":asset->url,"ar":asset->metadata.dimensions.aspectRatio},
    _type=="file"=>{"url":asset->url,"mime":asset->mimeType},
    _type=="mediaImage"=>{"url":image.asset->url,"ar":image.asset->metadata.dimensions.aspectRatio},
    _type=="mediaVideo"=>{"url":video.asset->url,"mime":video.asset->mimeType}
  }
}`;
function normalizeUrl(href){
  return /^([a-z][a-z0-9+.-]*:|\/|#)/i.test(href)?href:'https://'+href;
}
const SLUG_LETTERS={'ø':'o','œ':'oe','æ':'ae','ð':'d','þ':'th','ł':'l','ß':'ss'};
function slugify(s){
  return String(s||'').toLowerCase()
    .replace(/[øœæðþłß]/g,c=>SLUG_LETTERS[c])
    .normalize('NFKD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')||'project';
}
function assignSlugs(){
  const seen=new Set();
  projects.forEach(p=>{
    const base=slugify(p.displayTitle||p.client||p.title);
    let slug=base,n=2;
    while(seen.has(slug))slug=base+'-'+(n++);
    seen.add(slug);
    p.slug=slug;
  });
}
async function load(){
  try{
    const res=await fetch(`https://${PID}.api.sanity.io/v2021-10-21/data/query/${DS}?query=${encodeURIComponent(GROQ)}`);
    const{result}=await res.json();
    projects=(result||[]).map(p=>({
      title:p.title||'(untitled)',
      client:p.client||'',
      displayTitle:p.displayTitle||'',
      year:p.year||'',
      link:p.link||'',
      description:Array.isArray(p.description)
        ?p.description.filter(b=>b._type==='block'&&Array.isArray(b.children))
          .map(b=>{
            const defs=Object.fromEntries((b.markDefs||[]).map(d=>[d._key,d]));
            return b.children.map(c=>({
              text:c.text||'',
              href:(c.marks||[]).map(k=>defs[k]).find(d=>d&&d._type==='link')?.href||null,
            }));
          })
          .filter(runs=>runs.some(r=>r.text.trim()))
        :[],
      tags:Array.isArray(p.tags)?p.tags.map(t=>(t?.title||'').toLowerCase().trim()).filter(Boolean):[],
      media:Array.isArray(p.media)?p.media.map(m=>{
        if(!m||m.hidden||!m.url)return null;
        if(m._type==='image'||m._type==='mediaImage')return{type:'image',url:m.url,ar:m.ar||1};
        if(m._type==='file'||m._type==='mediaVideo')return{type:'video',url:m.url};
        return null;
      }).filter(Boolean):[],
    }));
  }catch(e){console.warn('[Sanity]',e.message);}
  if(!projects.length){capText.textContent='nothing to show right now';return;}
  assignSlugs();
  projects.forEach((p,i)=>p.media.forEach((m,k)=>items.push({g:items.length,p:i,m,k,n:p.media.length})));
  seq=items.map(it=>it.g);
  buildIndex();
  buildRuler();
  hintEl.textContent=touchy?'(tap the image or swipe)':'(click the image, or use ← →)';
  const slug=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===slug);
  if(i!==-1)openProject(i,{push:false});
  else show(0,{instant:true});
}
load();
</script>
</body>
</html>
