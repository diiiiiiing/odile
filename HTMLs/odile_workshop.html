<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODILE — WORKSHOP</title>
<style>
  :root{
    --bg:#e2241b; --fg:#000;
    --dim1:rgba(0,0,0,0.88); --dim2:rgba(0,0,0,0.45);
    --pad:36px;
    --font:-apple-system,'Helvetica Neue',sans-serif;
    --fs:13px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);color:var(--fg);
    font-family:var(--font);font-weight:300;
    font-size:var(--fs);line-height:1.55;
    overflow:hidden;cursor:none;
  }

  #cur{position:fixed;width:5px;height:5px;background:#000;
    box-shadow:0 0 5px 0px rgba(0,0,0,.4);
    pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}

  #overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;
    opacity:0;pointer-events:none;transition:opacity .7s ease;}
  #overlay.on{opacity:1;pointer-events:auto;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  body{animation:fadeIn .7s ease both;}

  /* NAV */
  #topNav{
    position:fixed;top:0;left:0;right:0;height:50px;
    padding:0 var(--pad);
    display:flex;align-items:center;
    z-index:400;
    pointer-events:none;
  }
  #navHome{font-size:12.5px;color:var(--dim2);text-decoration:none;cursor:none;transition:color .2s;pointer-events:auto;}
  #navHome:hover{color:var(--dim1);}
  #navSep{color:var(--dim2);margin:0 2px;font-size:12.5px;}
  #navSection{color:var(--dim1);font-size:12.5px;}

  /* LINK LIST */
  #links{
    position:fixed;top:50%;left:50%;
    transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;
    gap:14px;
  }
  #links a{
    font-size:12.5px;color:var(--dim1);
    text-decoration:none;cursor:none;
    transition:opacity .2s;opacity:.6;
  }
  #links a::before{content:'[';margin-right:2px;}
  #links a::after{content:']';margin-left:2px;}
  #links a:hover{opacity:1;}

  @media (hover:none){
    #cur{display:none;}
    *,*::before,*::after{cursor:auto!important;}
  }
</style>
</head>
<body>
<div id="cur"></div>
<div id="overlay"></div>
<script>window.addEventListener('pageshow',()=>{const o=document.getElementById('overlay');if(o)o.classList.remove('on');});</script>

<nav id="topNav">
  <a id="navHome" href="odile_hub.html">odile.xyz</a><span id="navSep"> / </span><span id="navSection">workshop</span>
</nav>

<div id="links">
  <a href="odile_izee_blog.html">izée asept's blog</a>
  <a href="odile_feed.html">feed</a>
  <a href="odile_radio.html">radio</a>
</div>

<script>
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px';
});

document.querySelectorAll('#links a, #navHome').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    document.getElementById('overlay').classList.add('on');
    setTimeout(() => window.location.href = a.getAttribute('href'), 700);
  });
});
</script>
</body>
</html>
