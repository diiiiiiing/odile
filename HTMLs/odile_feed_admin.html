<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODILE — ADMIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#b8b8bc; min-height:100vh; }
  body { font: 12px/1.6 -apple-system, 'Helvetica Neue', sans-serif; color:rgba(0,0,0,.75); }

  /* shared pill button — same aspect across the whole site */
  #login-btn, #logout-btn, .tab-btn, .sub-actions button, .edit-save, .settings-btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 16px; border: 1px solid rgba(0,0,0,.25); border-radius: 14px;
    background: none; font: 300 12px/1.4 -apple-system, 'Helvetica Neue', sans-serif;
    letter-spacing: .04em; cursor: pointer; text-transform: lowercase;
    transition: color .15s, border-color .15s, background .15s;
  }

  /* login */
  #login {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; gap: 14px;
  }
  #login input {
    background: none; border: none;
    border-bottom: 1px solid rgba(0,0,0,.22);
    width: 240px; padding: 7px 0;
    font: 12px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: rgba(0,0,0,.8); letter-spacing: .05em;
    outline: none; text-transform: lowercase;
  }
  #login input::placeholder { color: rgba(0,0,0,.28); }
  #login-btn {
    color: rgba(0,0,0,.45);
    margin-top: 4px;
  }
  #login-btn:hover { color: rgba(0,0,0,.85); border-color: rgba(0,0,0,.85); }
  #login-err {
    font-size: 11px; color: rgba(160,0,0,.6);
    letter-spacing: .04em; min-height: 14px;
  }

  /* admin */
  #admin { display: none; padding: 36px 24px 60px; }

  #admin-header {
    display: flex; align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  #admin-header h1 {
    font: 12px/1 -apple-system, 'Helvetica Neue', sans-serif;
    letter-spacing: .08em; text-transform: uppercase; opacity: .4;
  }
  #logout-btn {
    color: rgba(0,0,0,.35);
  }
  #logout-btn:hover { color: rgba(0,0,0,.8); border-color: rgba(0,0,0,.8); }

  /* tabs */
  #tabs { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab-btn {
    color: rgba(0,0,0,.35);
  }
  .tab-btn:hover { color: rgba(0,0,0,.7); border-color: rgba(0,0,0,.5); }
  .tab-btn.active {
    background: rgba(0,0,0,.65);
    color: rgba(255,255,255,.88);
    border-color: transparent;
  }

  /* grid */
  .sub-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }

  .sub-card {
    background: rgba(255,255,255,.15);
    padding: 8px; display: flex;
    flex-direction: column; gap: 8px;
  }
  .sub-card .media-wrap {
    width: 100%; aspect-ratio: 1; overflow: hidden;
    background: rgba(0,0,0,.05);
    display: flex; align-items: center; justify-content: center;
  }
  .sub-card img, .sub-card video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .sub-meta {
    font-size: 11px; color: rgba(0,0,0,.55);
    letter-spacing: .03em; line-height: 1.5;
  }
  .sub-meta strong { color: rgba(0,0,0,.8); font-weight: 500; }
  .sub-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .sub-actions button {
    padding: 5px 14px;
  }
  .approve-btn { color: rgba(0,110,0,.65); border-color: rgba(0,110,0,.35); }
  .approve-btn:hover { color: rgba(0,110,0,1); border-color: rgba(0,110,0,1); }
  .reject-btn  { color: rgba(140,0,0,.55); border-color: rgba(140,0,0,.3); }
  .reject-btn:hover { color: rgba(140,0,0,.9); border-color: rgba(140,0,0,.9); }
  .unapprove-btn { color: rgba(0,0,0,.35); }
  .unapprove-btn:hover { color: rgba(0,0,0,.75); border-color: rgba(0,0,0,.75); }
  .edit-btn { color: rgba(0,0,0,.35); }
  .edit-btn:hover { color: rgba(0,0,0,.75); border-color: rgba(0,0,0,.75); }

  .edit-form {
    display: none; flex-direction: column; gap: 7px;
    align-items: flex-start;
  }
  .edit-form.on { display: flex; }
  .edit-form input {
    background: none; border: none;
    border-bottom: 1px solid rgba(0,0,0,.2);
    padding: 4px 0; width: 100%;
    font: 11px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: rgba(0,0,0,.8); letter-spacing: .03em;
    outline: none;
  }
  .edit-form input::placeholder { color: rgba(0,0,0,.28); }
  .edit-save {
    color: rgba(0,110,0,.65); border-color: rgba(0,110,0,.35);
    padding: 5px 14px;
  }
  .edit-save:hover { color: rgba(0,110,0,1); border-color: rgba(0,110,0,1); }

  #empty {
    font-size: 11px; color: rgba(0,0,0,.35);
    letter-spacing: .05em; text-transform: lowercase;
    margin-top: 12px;
  }

  /* settings */
  #settings-panel {
    display: flex; flex-direction: column; gap: 28px;
    max-width: 360px;
  }
  .settings-section h2 {
    font: 12px/1 -apple-system, 'Helvetica Neue', sans-serif;
    letter-spacing: .08em; text-transform: uppercase; opacity: .4;
    margin-bottom: 14px;
  }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 12px; font-size: 12px;
  }
  .settings-row input[type="number"] {
    background: none; border: none;
    border-bottom: 1px solid rgba(0,0,0,.22);
    width: 60px; padding: 4px 0; text-align: right;
    font: 12px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: rgba(0,0,0,.8); outline: none;
  }
  .settings-unit { margin-left: 6px; color: rgba(0,0,0,.4); }
  .settings-btn {
    align-self: flex-start;
    color: rgba(0,0,0,.4);
    margin-top: 4px;
  }
  .settings-btn:hover { color: rgba(0,0,0,.8); border-color: rgba(0,0,0,.8); }
  .settings-btn.danger { color: rgba(140,0,0,.55); border-color: rgba(140,0,0,.3); margin-top: 16px; }
  .settings-btn.danger:hover { color: rgba(140,0,0,.9); border-color: rgba(140,0,0,.9); }

  .toggle {
    position: relative; width: 34px; height: 18px;
    background: rgba(0,0,0,.15); border-radius: 10px;
    cursor: pointer; flex-shrink: 0; transition: background .2s;
  }
  .toggle.on { background: rgba(0,110,0,.5); }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; transition: left .2s;
  }
  .toggle.on::after { left: 18px; }

  #settings-status {
    font-size: 11px; color: rgba(0,0,0,.35);
    letter-spacing: .04em; min-height: 14px;
  }
</style>
</head>
<body>

<div id="login">
  <input type="email" id="email-input" placeholder="email" autocomplete="off">
  <input type="password" id="pw-input" placeholder="mot de passe">
  <button id="login-btn">connexion</button>
  <div id="login-err"></div>
</div>

<div id="admin">
  <div id="admin-header">
    <h1>feed — modération</h1>
    <button id="logout-btn">déconnexion</button>
  </div>
  <div id="tabs">
    <button class="tab-btn active" data-tab="pending">en attente</button>
    <button class="tab-btn" data-tab="approved">approuvés</button>
    <button class="tab-btn" data-tab="settings">réglages</button>
  </div>
  <div id="grid-pending" class="sub-grid"></div>
  <div id="grid-approved" class="sub-grid" style="display:none"></div>
  <div id="empty" style="display:none">aucune soumission</div>

  <div id="settings-panel" style="display:none">
    <div class="settings-section">
      <h2>chat</h2>
      <div class="settings-row">
        <span>cooldown entre les messages</span>
        <span><input type="number" id="cooldown-input" min="0" step="1"><span class="settings-unit">sec</span></span>
      </div>
      <button class="settings-btn" id="cooldown-save">enregistrer</button>
      <button class="settings-btn danger" id="clear-chat-btn">vider les messages du chat</button>
    </div>
    <div class="settings-section">
      <h2>soumissions</h2>
      <div class="settings-row">
        <span>valider chaque post avant publication</span>
        <div class="toggle" id="approval-toggle"></div>
      </div>
    </div>
    <div id="settings-status"></div>
  </div>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://iwmfhvhhbpcsjcsakigg.supabase.co',
  'sb_publishable_wp_9hP65hwOLHAoPDAhQRA_MYR5ER3-'
);

const loginEl   = document.getElementById('login');
const adminEl   = document.getElementById('admin');
const loginErr  = document.getElementById('login-err');
const emptyEl   = document.getElementById('empty');
let currentTab  = 'pending';

/* restore session */
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) showAdmin();
});

document.getElementById('login-btn').addEventListener('click', async () => {
  const email = document.getElementById('email-input').value.trim();
  const pw    = document.getElementById('pw-input').value;
  loginErr.textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { loginErr.textContent = 'identifiants incorrects'; return; }
  showAdmin();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await sb.auth.signOut();
  adminEl.style.display = 'none';
  loginEl.style.display = 'flex';
});

/* tabs */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    document.getElementById('grid-pending').style.display   = currentTab === 'pending'  ? '' : 'none';
    document.getElementById('grid-approved').style.display  = currentTab === 'approved' ? '' : 'none';
    document.getElementById('settings-panel').style.display = currentTab === 'settings' ? '' : 'none';
    emptyEl.style.display = 'none';
    if (currentTab === 'settings') {
      loadSettings();
    } else {
      loadTab(currentTab);
    }
  });
});

function showAdmin() {
  loginEl.style.display  = 'none';
  adminEl.style.display  = 'block';
  loadTab('pending');
}

async function loadTab(tab) {
  const gridId = tab === 'pending' ? 'grid-pending' : 'grid-approved';
  const grid   = document.getElementById(gridId);
  grid.innerHTML = '';
  emptyEl.style.display = 'none';

  const { data } = await sb.from('submissions')
    .select('id, pseudo, file_url, file_type, text_content, approved, created_at')
    .eq('approved', tab === 'approved')
    .order('created_at', { ascending: tab === 'pending' });

  if (!data?.length) { emptyEl.style.display = 'block'; return; }

  data.forEach(item => {
    const card = document.createElement('div');
    card.className = 'sub-card';
    card.id = `card-${item.id}`;

    const wrap = document.createElement('div');
    wrap.className = 'media-wrap';
    if (item.file_type === 'text') {
      wrap.style.cssText = 'padding:12px; align-items:flex-start; aspect-ratio:unset; min-height:80px;';
      const p = document.createElement('p');
      p.style.cssText = 'font:12px/1.6 -apple-system, "Helvetica Neue", sans-serif; color:rgba(0,0,0,.7); white-space:pre-wrap; word-break:break-word; margin:0;';
      p.textContent = item.text_content || '';
      wrap.appendChild(p);
    } else {
      const media = document.createElement(item.file_type === 'video' ? 'video' : 'img');
      media.src = item.file_url;
      if (item.file_type === 'video') {
        media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true;
      }
      wrap.appendChild(media);
    }

    const meta = document.createElement('div');
    meta.className = 'sub-meta';
    const d = new Date(item.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit' });
    meta.innerHTML = `<strong>${item.pseudo}</strong><br>${d}`;

    const actions = document.createElement('div');
    actions.className = 'sub-actions';

    if (tab === 'pending') {
      const ap = document.createElement('button');
      ap.className = 'approve-btn'; ap.textContent = 'approuver';
      ap.addEventListener('click', () => setApproved(item.id, true));

      const ed = document.createElement('button');
      ed.className = 'edit-btn'; ed.textContent = 'modifier';
      ed.addEventListener('click', () => {
        const form = card.querySelector('.edit-form');
        form.classList.toggle('on');
      });

      const rj = document.createElement('button');
      rj.className = 'reject-btn'; rj.textContent = 'refuser';
      rj.addEventListener('click', () => deleteItem(item.id, item.file_url));

      actions.append(ap, ed, rj);

      // edit form (hidden by default)
      const editForm = document.createElement('div');
      editForm.className = 'edit-form';

      const handleInput = document.createElement('input');
      handleInput.type = 'text'; handleInput.placeholder = '@instagram';
      handleInput.value = item.pseudo; handleInput.maxLength = 32;
      handleInput.autocomplete = 'off'; handleInput.spellcheck = false;

      const saveBtn = document.createElement('button');
      saveBtn.className = 'edit-save'; saveBtn.textContent = 'enregistrer';
      saveBtn.addEventListener('click', async () => {
        const newHandle = handleInput.value.trim().replace(/^@/, '');
        if (!newHandle) return;
        await sb.from('submissions').update({ pseudo: newHandle }).eq('id', item.id);
        item.pseudo = newHandle;
        meta.innerHTML = `<strong>${newHandle}</strong><br>${new Date(item.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'2-digit' })}`;
        editForm.classList.remove('on');
      });

      editForm.append(handleInput, saveBtn);
      card.append(wrap, meta, actions, editForm);
    } else {
      const ua = document.createElement('button');
      ua.className = 'unapprove-btn'; ua.textContent = 'retirer';
      ua.addEventListener('click', () => setApproved(item.id, false));

      const rj = document.createElement('button');
      rj.className = 'reject-btn'; rj.textContent = 'supprimer';
      rj.addEventListener('click', () => deleteItem(item.id, item.file_url));

      actions.append(ua, rj);
      card.append(wrap, meta, actions);
    }

    grid.appendChild(card);
  });
}

async function setApproved(id, approved) {
  await sb.from('submissions').update({ approved }).eq('id', id);
  document.getElementById(`card-${id}`)?.remove();
  const grid = document.getElementById(approved ? 'grid-pending' : 'grid-approved');
  if (!grid.children.length) emptyEl.style.display = 'block';
}

async function deleteItem(id, fileUrl) {
  await sb.from('submissions').delete().eq('id', id);
  const path = fileUrl.split('/object/public/media/')[1];
  if (path) await sb.storage.from('media').remove([decodeURIComponent(path)]);
  document.getElementById(`card-${id}`)?.remove();
  const grid = document.getElementById(`grid-${currentTab}`);
  if (!grid.children.length) emptyEl.style.display = 'block';
}

/* ── SETTINGS ── */
const settingsStatus  = document.getElementById('settings-status');
const cooldownInput   = document.getElementById('cooldown-input');
const cooldownSaveBtn = document.getElementById('cooldown-save');
const approvalToggle  = document.getElementById('approval-toggle');
const clearChatBtn    = document.getElementById('clear-chat-btn');

function flashStatus(msg) {
  settingsStatus.textContent = msg;
  setTimeout(() => { settingsStatus.textContent = ''; }, 1800);
}

async function loadSettings() {
  const { data, error } = await sb
    .from('app_settings')
    .select('chat_cooldown_seconds, require_approval')
    .eq('id', 1)
    .maybeSingle();
  if (error || !data) return;
  cooldownInput.value = data.chat_cooldown_seconds ?? 0;
  approvalToggle.classList.toggle('on', !!data.require_approval);
}

cooldownSaveBtn.addEventListener('click', async () => {
  const val = Math.max(0, parseInt(cooldownInput.value, 10) || 0);
  cooldownInput.value = val;
  const { error } = await sb.from('app_settings').update({ chat_cooldown_seconds: val }).eq('id', 1);
  flashStatus(error ? 'erreur' : 'enregistré');
});

approvalToggle.addEventListener('click', async () => {
  const newVal = !approvalToggle.classList.contains('on');
  approvalToggle.classList.toggle('on', newVal);
  const { error } = await sb.from('app_settings').update({ require_approval: newVal }).eq('id', 1);
  if (error) {
    approvalToggle.classList.toggle('on', !newVal);
    flashStatus('erreur');
  } else {
    flashStatus(newVal ? 'validation activée' : 'validation désactivée');
  }
});

clearChatBtn.addEventListener('click', async () => {
  if (!confirm('Supprimer tous les messages du chat ?')) return;
  const { error } = await sb.from('chat_messages').delete().gte('id', 0);
  flashStatus(error ? 'erreur' : 'messages supprimés');
});
</script>
</body>
</html>
