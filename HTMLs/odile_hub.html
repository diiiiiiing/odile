<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODILE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

body {
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; position: relative; overflow: hidden;
  background: #b8b8bc;
}

/* ── Page load fade-in ── */
@keyframes pageIn {
  from { opacity: 0; transform: scale(1.012); }
  to   { opacity: 1; transform: scale(1); }
}
body { animation: pageIn 1.2s cubic-bezier(0.22,1,0.36,1) both; }


/* ── Iridescent background ── */
.bg-iri {
  position: fixed; inset: 0; z-index: 0;
  background-color: #b8b8bc;
}

/* ── Crest — non-clickable ── */
.logo-wrap {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  height: 50px; display: flex; align-items: center;
  z-index: 40;
  pointer-events: none; user-select: none;
}
.logo-face.front { display: inline-block; }
.logo-face.front svg {
  width: clamp(32px,4vw,52px); height: auto;
  opacity: 0.88; display: block;
}

/* ── Scene — row layout ── */
.scene {
  position: relative; z-index: 20;
  display: flex; flex-direction: row; align-items: flex-end; justify-content: center;
  gap: clamp(18px, 3vw, 48px); width: 100%;
}

/* ── Figures ── */
.fig {
  cursor: none;
  display: flex; flex-direction: column; align-items: center;
  gap: 10px;
}
.fig svg {
  display: block; height: clamp(70px,11vh,120px); width: auto;
  transform-origin: center bottom;
  transition: fill 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
}
.fig:hover svg { transform: scale(1.12); }

/* Non-hovered figs dim when another is active */
body.h1 .fig-2 svg,
body.h1 .fig-3 svg,
body.h1 .fig-4 svg,
body.h1 .fig-5 svg { opacity: 0.3; }
body.h2 .fig-1 svg,
body.h2 .fig-3 svg,
body.h2 .fig-4 svg,
body.h2 .fig-5 svg { opacity: 0.3; }
body.h3 .fig-1 svg,
body.h3 .fig-2 svg,
body.h3 .fig-4 svg,
body.h3 .fig-5 svg { opacity: 0.3; }
body.h4 .fig-1 svg,
body.h4 .fig-2 svg,
body.h4 .fig-3 svg,
body.h4 .fig-5 svg { opacity: 0.3; }
body.h5 .fig-1 svg,
body.h5 .fig-2 svg,
body.h5 .fig-3 svg,
body.h5 .fig-4 svg { opacity: 0.3; }
.fig-1 svg, .fig-2 svg, .fig-3 svg, .fig-4 svg, .fig-5 svg { fill: rgba(255,255,255,0.88); }

body.h1 .fig-1 svg { fill: #c8f000; opacity: 1; }
body.h2 .fig-2 svg { fill: #7BC6C7; opacity: 1; }
body.h3 .fig-3 svg { fill: #6C0000; opacity: 1; }
body.h4 .fig-4 svg { fill: #FFD5F8; opacity: 1; }
body.h5 .fig-5 svg { fill: #FFFFFF; opacity: 1; }
/* explorer silhouette is wide/landscape — keep it compact */
.fig-3 svg { height: clamp(36px, 5vh, 60px) !important; }
/* ── URL bar ── */
.url {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); top: auto;
  height: 50px; display: flex; align-items: center;
  font-weight: 300; font-size: 12.5px; letter-spacing: 0;
  text-transform: lowercase;
  color: rgba(255,255,255,0.55); z-index: 60; white-space: nowrap;
  text-decoration: none;
  transition: color 0.4s ease;
  pointer-events: none;
  user-select: none;
}
body.h1 .url,
body.h2 .url { color: rgba(43,153,204,0.9); }
body.h3 .url { color: rgba(255,213,248,0.9); }

/* ── Cursor — jet silhouette, nose sitting on the hotspot ── */
@media (hover: hover) {
  body, body * { cursor: none !important; }
}
#cur {
  position: fixed; left: 0; top: 0; width: 20px; height: 20px;
  z-index: 990; pointer-events: none;
  opacity: 0; transition: opacity .35s ease;
  will-change: transform;
  /* the artwork's nose is at 0,0 of its viewBox, so the element's own
     top-left corner is the hotspot — no centring offset */
  -webkit-mask: url('cursor.svg') no-repeat 0 0 / 100% 100%;
          mask: url('cursor.svg') no-repeat 0 0 / 100% 100%;
  /* plain white would vanish over the white silhouettes; difference keeps
     it readable on the grey ground and on the figures alike */
  background: #fff;
  mix-blend-mode: difference;
}
#cur.on { opacity: 1; }
@media (hover: none) { #cur { display: none; } }


/* ── MOBILE — stack silhouettes top to bottom ── */
@media (max-width: 700px) {
  .logo-face.front svg { width: 40px; }
  .scene {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2.5vh, 22px);
  }
  .fig svg {
    height: clamp(60px, 10vh, 94px);
  }
  .fig-3 svg {
    height: clamp(32px, 4.8vh, 48px) !important;
  }
}

/* ── Loader ── */
#loader{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  background:#b8b8bc;
  opacity:1;transition:opacity 1.4s cubic-bezier(0.4,0,0.2,1);
  pointer-events:auto;
}
#loader.loaded{opacity:0;pointer-events:none;}
@keyframes loader-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
#loader svg{
  width:min(74vw,74vh);height:min(74vw,74vh);
  overflow:visible;
  animation:loader-in 1.2s cubic-bezier(0.22,1,0.36,1) both;
}
#loader .cls-1{fill:#fff!important;}
#loader .cls-2{stroke:#fff!important;fill:none!important;}
@keyframes spin-cw  {to{transform:rotate( 360deg);}}
@keyframes spin-ccw {to{transform:rotate(-360deg);}}
@keyframes snap-in  {to{opacity:1}}
@keyframes ci-in{from{opacity:0}to{opacity:var(--ci-op,1)}}
#lg-circles{transform-origin:570.86px 570.86px;animation:spin-ccw 40s linear infinite;}
#lg-circles circle{fill:none;stroke:#fff;stroke-miterlimit:10;}
#lg-circles .ci-9{--ci-op:.7;animation:ci-in .4s ease 0.00s both;}
#lg-circles .ci-8{--ci-op:.6;animation:ci-in .4s ease 0.09s both;}
#lg-circles .ci-7{--ci-op:.7;animation:ci-in .4s ease 0.18s both;}
#lg-circles .ci-6{--ci-op:.6;animation:ci-in .4s ease 0.27s both;}
#lg-circles .ci-5{--ci-op:.7;animation:ci-in .4s ease 0.36s both;}
#lg-circles .ci-4{--ci-op:.6;animation:ci-in .4s ease 0.45s both;}
#lg-circles .ci-3{--ci-op:.7;animation:ci-in .4s ease 0.54s both;}
#lg-circles .ci-2{--ci-op:.6;animation:ci-in .4s ease 0.63s both;}
#lg-circles .ci-1{--ci-op:.7;animation:ci-in .4s ease 0.72s both;}
#lg-outer{transform-origin:570.86px 570.86px;animation:spin-cw 22s linear infinite;}
/* hide hub content until loader fades */
.logo-wrap,.scene,.url{opacity:0;transition:opacity .5s ease;}
</style>
<style>
#overlay {
  position: fixed; inset: 0;
  background: #b8b8bc;
  z-index: 1000;
  opacity: 0; pointer-events: none;
  transition: opacity 0.7s ease;
}
#overlay.on { opacity: 1; pointer-events: auto; }
@keyframes hubFadeIn { from { opacity: 0; } to { opacity: 1; } }
body { animation: hubFadeIn 0.7s ease both; }
</style>
<noscript><style>body{background:#b8b8bc;cursor:auto}.scene{z-index:20;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(36px,6vw,90px)}</style></noscript>
</head>
<body id="bg">
<div id="overlay"></div>
<div id="loader"></div>

<script>
const bg  = document.getElementById('bg');
const url = document.getElementById('urlEl');
const iri = document.getElementById('iri');

/* ══════════════════════════════════════════════════════
   POLKA CANVAS — only active on fig-2 hover
══════════════════════════════════════════════════════ */
const canvas = document.getElementById('polka-canvas');
const ctx    = canvas.getContext('2d');
let polkaRaf;

const COLS_A = 7, COLS_B = 6, ROWS = 7;
const dots = [];

function buildDots() {
  dots.length = 0;
  const W = canvas.width, H = canvas.height;
  const stepX = W / 5.5;
  const stepY = H / 5.5;
  const R = Math.min(W, H) * 0.068;
  for (let row = 0; row < ROWS; row++) {
    const isEven  = row % 2 === 0;
    const cols    = isEven ? COLS_A : COLS_B;
    const offsetX = isEven ? 0 : stepX * 0.5;
    for (let col = 0; col < cols; col++) {
      const tx   = offsetX + col * stepX - stepX * 0.1;
      const ty   = row * stepY - stepY * 0.4;
      const dist = Math.sqrt((tx - W/2)**2 + (ty - H/2)**2);
      dots.push({ tx, ty, r: R, dist, floatOffset: Math.random() * Math.PI * 2 });
    }
  }
  dots.sort((a, b) => a.dist - b.dist);
  const maxDist = dots[dots.length - 1].dist;
  dots.forEach(d => { d.delay = (d.dist / maxDist) * 0.55; });
}

function resizePolka() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  buildDots();
}
resizePolka();
window.addEventListener('resize', resizePolka);

let polkaStart = null;
let polkaAlpha = 0;      // current global opacity 0→1
let polkaPhase = 'off';  // 'in' | 'hold' | 'out' | 'off'
let polkaFadeStart = null;
const INTRO_DUR  = 0.9;
const FADE_OUT   = 0.4;
const FLOAT_AMP  = 3;
const FLOAT_SPD  = 0.0008;

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function drawDotsFrame(now, alphaOverride) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const W = canvas.width, H = canvas.height;
  const elapsed = polkaStart !== null ? (now - polkaStart) / 1000 : INTRO_DUR + 1;
  const alpha   = alphaOverride !== undefined ? alphaOverride : polkaAlpha;

  dots.forEach(d => {
    const local = Math.max(0, elapsed - d.delay);
    const prog  = Math.min(1, local / INTRO_DUR);
    const ep    = easeOutBack(prog);
    const lp    = easeOutQuart(prog);
    const x     = d.tx * lp + (W / 2) * (1 - lp);
    const y     = d.ty * lp + (H / 2) * (1 - lp);
    const r     = d.r * ep;
    const floatBlend = Math.max(0, (prog - 0.8) / 0.2);
    const floatY     = Math.sin(now * FLOAT_SPD + d.floatOffset) * FLOAT_AMP * floatBlend;
    ctx.beginPath();
    ctx.arc(x, y + floatY, Math.max(0, r), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.15 * lp * alpha})`;
    ctx.fill();
  });
}

function polkaLoop(now) {
  if (polkaPhase === 'off') return;

  if (polkaPhase === 'in') {
    const elapsed = (now - polkaStart) / 1000;
    // quick fade-in of global alpha over first 0.2s to avoid hard pop
    polkaAlpha = Math.min(1, elapsed / 0.2);
    drawDotsFrame(now);
    polkaRaf = requestAnimationFrame(polkaLoop);
  }
  else if (polkaPhase === 'out') {
    const elapsed = (now - polkaFadeStart) / 1000;
    polkaAlpha = Math.max(0, 1 - elapsed / FADE_OUT);
    drawDotsFrame(now);
    if (polkaAlpha > 0) {
      polkaRaf = requestAnimationFrame(polkaLoop);
    } else {
      polkaPhase = 'off';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
}

function polkaIn() {
  cancelAnimationFrame(polkaRaf);
  polkaPhase = 'in';
  polkaStart = performance.now();
  polkaAlpha = 0;
  polkaRaf   = requestAnimationFrame(polkaLoop);
}

function polkaOut() {
  if (polkaPhase === 'off') return;
  cancelAnimationFrame(polkaRaf);
  polkaPhase     = 'out';
  polkaFadeStart = performance.now();
  polkaRaf       = requestAnimationFrame(polkaLoop);
}

function polkaClear() {
  cancelAnimationFrame(polkaRaf);
  polkaPhase = 'off';
  polkaAlpha = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

const SVG_W = 666.82, SVG_H = 600.32;

const SVG_CX = SVG_W / 2, SVG_CY = SVG_H / 2;

const N_STARS    = 12;
const STAR_INTRO = 0.9;

const TILT_X_DEG = 68;   // very flat — close to horizontal ellipse

function easeOutBack3(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2);
}

// Project a point on a circle with 3D tilt → 2D screen coords
// Returns { x, y, z, scaleF } where scaleF encodes depth
function project3D(angle, ringR, cx, cy) {
  // Circle in XY plane
  const x0 = Math.cos(angle) * ringR;
  const y0 = Math.sin(angle) * ringR;
  const z0 = 0;

  const z1 = y0 * Math.sin(tx) + z0 * Math.cos(tx);

  // Rotate around Z (lean/twist)
  const tz = TILT_Z_DEG * Math.PI / 180;
  const x2 = x0 * Math.cos(tz) - y1 * Math.sin(tz);
  const y2 = x0 * Math.sin(tz) + y1 * Math.cos(tz);

  const scaleF  = 0.45 + normalZ * 0.55;  // range 0.45–1.0

  return { x: cx + x2, y: cy + y2, z: z1, normalZ, scaleF };

    const sz    = pathScale * ep * proj.scaleF;
    // Depth alpha: back stars dimmer, front stars full opacity
    const alpha = 0.35 + proj.normalZ * 0.65;

    dctx.save();
    dctx.globalAlpha = distAlpha * lp * alpha;
    dctx.fillStyle   = '#ffffff';
    dctx.translate(ex, ey);
    dctx.rotate(tangentAngle);
    dctx.scale(sz, sz);
    dctx.translate(-SVG_CX, -SVG_CY);
    dctx.fill(STAR_PATH2D);
    dctx.restore();
  });
}

function distIn() {
  cancelAnimationFrame(distRaf);
  distPhase = 'in';
  distAlpha = 0;
  distEntranceStart = performance.now();
  const fadeStart = performance.now();
  function loop(now) {
    if (distPhase !== 'in') return;
    distAlpha = Math.min(1, (now - fadeStart) / 700);
    drawStarsFrame(now);
    distRaf = requestAnimationFrame(loop);
  }
  distRaf = requestAnimationFrame(loop);
}

function distOut() {
  if (distPhase === 'off') return;
  cancelAnimationFrame(distRaf);
  const alphaAtExit = distAlpha;
  distFadeStart = performance.now();
  distPhase = 'out';
  function loop(now) {
    if (distPhase !== 'out') return;
    distAlpha = Math.max(0, alphaAtExit - (now - distFadeStart) / 450);
    drawStarsFrame(now);
    if (distAlpha > 0) distRaf = requestAnimationFrame(loop);
    else {
      distPhase = 'off';
      dctx.clearRect(0, 0, dc.width, dc.height);
    }
  }
  distRaf = requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════
   HOVER HANDLERS
══════════════════════════════════════════════════════ */
let currentHover = '';



function setH(cls, text) {
  if (bg.classList.contains('leaving')) return;
  currentHover    = cls;
  bg.className    = cls;
  url.textContent = text;
  if (cls === 'h2') polkaIn();  else polkaOut();
  if (cls === 'h1') distIn();   else distOut();
}

function clearH() {
  if (bg.classList.contains('leaving')) return;
  currentHover    = '';
  bg.className    = '';
  url.textContent = 'hub';
  polkaOut();
  distOut();
}

function navigateTo(href) {
  const ov = document.getElementById('overlay');
  ov.classList.add('on');
  setTimeout(() => { window.location.href = href; }, 700);
}

/* ══════════════════════════════════════════════════════
   IRIDESCENT BACKGROUND PARALLAX
══════════════════════════════════════════════════════ */
let mx = 0.5, my = 0.5;
const blobs = [
  { x: 50, y: 100 }, { x: 20, y: 60 }, { x: 80, y: 40 }, { x: 50, y: 50 }
];
const base = [
  { x: 50, y: 100 }, { x: 20, y: 60 }, { x: 80, y: 40 }, { x: 50, y: 50 }
];
const blobDef = [
  { ax:  0.38, ay:  0.30, ease: 0.05, color: '220,180,60',  op: 0.70, ex: 90, ey: 70 },
  { ax: -0.42, ay:  0.34, ease: 0.04, color: '200,160,210', op: 0.50, ex: 70, ey: 60 },
  { ax:  0.36, ay: -0.38, ease: 0.045,color: '160,210,200', op: 0.40, ex: 60, ey: 50 },
  { ax:  0.18, ay:  0.16, ease: 0.03, color: '210,200,190', op: 0.30, ex: 80, ey: 80 },
];
document.addEventListener('mousemove', e => {
  mx = e.clientX / window.innerWidth;
  my = e.clientY / window.innerHeight;
});

/* Touch: clear hover on touchend outside a fig */
document.addEventListener('touchend', e => {
  if (!e.target.closest('.fig')) clearH();
});
(function tick() {
  let grad = '';
  blobs.forEach((b, i) => {
    const d = blobDef[i];
    b.x += (base[i].x + (mx - 0.5) * d.ax * 100 - b.x) * d.ease;
    b.y += (base[i].y + (my - 0.5) * d.ay * 100 - b.y) * d.ease;
    grad += `radial-gradient(ellipse ${d.ex}% ${d.ey}% at ${b.x.toFixed(1)}% ${b.y.toFixed(1)}%, rgba(${d.color},${d.op}) 0%, transparent 55%),`;
  });
  iri.style.backgroundImage = grad.slice(0, -1);
  requestAnimationFrame(tick);
})();

/* ── Cursor — the jet follows the pointer, nose on the hotspot ── */
(function(){
  const cur=document.getElementById('cur');
  if(!cur||matchMedia('(hover: none)').matches)return;
  let x=0,y=0,queued=false;
  document.addEventListener('mousemove', e=>{
    x=e.clientX; y=e.clientY;
    cur.classList.add('on');
    /* pointer events can outpace the display; fold a burst of them into
       one write per frame rather than restyling on every event */
    if(queued)return;
    queued=true;
    requestAnimationFrame(()=>{
      queued=false;
      cur.style.transform=`translate3d(${x}px,${y}px,0)`;
    });
  }, { passive:true });
  document.documentElement.addEventListener('mouseleave', ()=>cur.classList.remove('on'));
})();

/* ── Loader — same as work4 ── */
const loaderEl=document.getElementById('loader');
const loaderStart=Date.now();
fetch('./loadersvg.svg')
  .then(r=>r.text())
  .then(text=>{
    const doc=new DOMParser().parseFromString(text,'image/svg+xml');
    const svg=doc.documentElement;
    const groups=[...svg.children].filter(n=>n.tagName==='g');
    if(groups[0]){
      groups[0].id='lg-circles';
      [...groups[0].children].forEach((c,i)=>c.classList.add('ci-'+(i+1)));
    }
    if(groups[1]){
      groups[1].id='lg-outer';
      [...groups[1].children].forEach((g,i)=>{
        g.style.opacity='0';
        g.style.animation=`snap-in 0.15s ease ${(0.2+i*0.06).toFixed(2)}s both`;
      });
    }
    const CX=570.86,CY=570.86,TOL=18;
    const paths=[...svg.children].filter(n=>n.tagName==='path');
    svg.style.cssText='position:fixed;top:-9999px;width:1px;height:1px;overflow:visible;';
    document.body.appendChild(svg);
    const radii=paths.map(p=>{
      const b=p.getBBox();
      const cx=b.x+b.width/2,cy=b.y+b.height/2;
      return Math.round(Math.sqrt((cx-CX)**2+(cy-CY)**2)/TOL)*TOL;
    });
    document.body.removeChild(svg);
    svg.style.cssText='';
    const sortedR=[...new Set(radii)].sort((a,b)=>a-b);
    const stepMap=Object.fromEntries(sortedR.map((r,i)=>[r,i]));
    const STEP=0.04,START=0.05;
    paths.forEach((p,i)=>{
      const delay=(START+stepMap[radii[i]]*STEP).toFixed(3);
      p.style.opacity='0';
      p.style.animation=`snap-in 0.12s ease ${delay}s both`;
    });
    loaderEl.appendChild(svg);
  }).catch(()=>{});
const elapsed=Date.now()-loaderStart;
setTimeout(()=>{
  loaderEl.classList.add('loaded');
  loaderEl.addEventListener('transitionend',()=>loaderEl.remove(),{once:true});
  setTimeout(()=>{
    document.querySelectorAll('.logo-wrap,.scene,.url').forEach(el=>el.style.opacity='1');
  },700);
},Math.max(0,2200-elapsed));
</script>
