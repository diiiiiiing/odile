<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODILE</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }

body {
  font-family: -apple-system, 'Helvetica Neue', sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; position: relative; overflow: hidden;
  background: #b8b8bc;
}

/* ── Page load fade-in ── */
@keyframes pageIn {
  from { opacity: 0; transform: scale(1.012); }
  to   { opacity: 1; transform: scale(1); }
}
body { animation: pageIn 1.2s cubic-bezier(0.22,1,0.36,1) both; }


/* ── Iridescent background ── */
.bg-iri {
  position: fixed; inset: 0; z-index: 0;
  background-color: #b8b8bc;
}

/* ── Glass logo — clickable ── */
.logo-wrap {
  position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
  z-index: 40;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease;
}
.logo-wrap:hover { opacity: 0.65; transform: translateX(-50%) scale(1.06); }
.logo-face.front { display: inline-block; }
.logo-face.front svg {
  width: clamp(32px,4vw,52px); height: auto;
  opacity: 0.88; display: block;
}

/* ── Scene — row layout ── */
.scene {
  position: relative; z-index: 20;
  display: flex; flex-direction: row; align-items: flex-end; justify-content: center;
  gap: clamp(36px, 6vw, 90px); width: 100%;
}

/* ── Figures ── */
.fig {
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  gap: 10px;
}
.fig svg {
  display: block; height: clamp(70px,11vh,120px); width: auto;
  transform-origin: center bottom;
  transition: fill 0.3s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
}
.fig:hover svg { transform: scale(1.12); }

/* Non-hovered figs dim when another is active */
body.h1 .fig-2 svg,
body.h1 .fig-3 svg,
body.h1 .fig-4 svg { opacity: 0.3; }
body.h2 .fig-1 svg,
body.h2 .fig-3 svg,
body.h2 .fig-4 svg { opacity: 0.3; }
body.h3 .fig-1 svg,
body.h3 .fig-2 svg { opacity: 0.3; }
.fig-1 svg, .fig-2 svg, .fig-3 svg, .fig-4 svg { fill: rgba(255,255,255,0.88); }

body.h1 .fig-1 svg { fill: #c8f000; opacity: 1; }
body.h2 .fig-2 svg { fill: #2B99CC; opacity: 1; }
body.h3 .fig-3 svg { fill: #FFD5F8; opacity: 1; }
/* ── URL bar ── */
.url {
  position: fixed; top: 0; left: 36px;
  height: 50px; display: flex; align-items: center;
  font-weight: 300; font-size: 12.5px; letter-spacing: 0;
  text-transform: lowercase;
  color: rgba(255,255,255,0.55); z-index: 60; white-space: nowrap;
  text-decoration: none;
  transition: color 0.4s ease;
  pointer-events: none;
  user-select: none;
}
body.h1 .url,
body.h2 .url { color: rgba(43,153,204,0.9)
body.h3 .url { color: rgba(255,213,248,0.9)
}
</style>
<style>
#overlay {
  position: fixed; inset: 0;
  background: #b8b8bc;
  z-index: 1000;
  opacity: 0; pointer-events: none;
  transition: opacity 0.7s ease;
}
#overlay.on { opacity: 1; pointer-events: auto; }
@keyframes hubFadeIn { from { opacity: 0; } to { opacity: 1; } }
body { animation: hubFadeIn 0.7s ease both; }
</style>
<noscript><style>body{background:#b8b8bc;cursor:auto}.scene{z-index:20;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:clamp(36px,6vw,90px)}</style></noscript>
</head>
<body id="bg">
<div id="overlay"></div>
<script>window.addEventListener('pageshow',()=>{const o=document.getElementById('overlay');if(o)o.classList.remove('on');});</script>

<span class="url" id="urlEl">odile.xyz/hub</span>

<script>
const bg  = document.getElementById('bg');
const url = document.getElementById('urlEl');
const iri = document.getElementById('iri');

/* ══════════════════════════════════════════════════════
   POLKA CANVAS — only active on fig-2 hover
══════════════════════════════════════════════════════ */
const canvas = document.getElementById('polka-canvas');
const ctx    = canvas.getContext('2d');
let polkaRaf;

const COLS_A = 7, COLS_B = 6, ROWS = 7;
const dots = [];

function buildDots() {
  dots.length = 0;
  const W = canvas.width, H = canvas.height;
  const stepX = W / 5.5;
  const stepY = H / 5.5;
  const R = Math.min(W, H) * 0.068;
  for (let row = 0; row < ROWS; row++) {
    const isEven  = row % 2 === 0;
    const cols    = isEven ? COLS_A : COLS_B;
    const offsetX = isEven ? 0 : stepX * 0.5;
    for (let col = 0; col < cols; col++) {
      const tx   = offsetX + col * stepX - stepX * 0.1;
      const ty   = row * stepY - stepY * 0.4;
      const dist = Math.sqrt((tx - W/2)**2 + (ty - H/2)**2);
      dots.push({ tx, ty, r: R, dist, floatOffset: Math.random() * Math.PI * 2 });
    }
  }
  dots.sort((a, b) => a.dist - b.dist);
  const maxDist = dots[dots.length - 1].dist;
  dots.forEach(d => { d.delay = (d.dist / maxDist) * 0.55; });
}

function resizePolka() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  buildDots();
}
resizePolka();
window.addEventListener('resize', resizePolka);

let polkaStart = null;
let polkaAlpha = 0;      // current global opacity 0→1
let polkaPhase = 'off';  // 'in' | 'hold' | 'out' | 'off'
let polkaFadeStart = null;
const INTRO_DUR  = 0.9;
const FADE_OUT   = 0.4;
const FLOAT_AMP  = 3;
const FLOAT_SPD  = 0.0008;

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function drawDotsFrame(now, alphaOverride) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const W = canvas.width, H = canvas.height;
  const elapsed = polkaStart !== null ? (now - polkaStart) / 1000 : INTRO_DUR + 1;
  const alpha   = alphaOverride !== undefined ? alphaOverride : polkaAlpha;

  dots.forEach(d => {
    const local = Math.max(0, elapsed - d.delay);
    const prog  = Math.min(1, local / INTRO_DUR);
    const ep    = easeOutBack(prog);
    const lp    = easeOutQuart(prog);
    const x     = d.tx * lp + (W / 2) * (1 - lp);
    const y     = d.ty * lp + (H / 2) * (1 - lp);
    const r     = d.r * ep;
    const floatBlend = Math.max(0, (prog - 0.8) / 0.2);
    const floatY     = Math.sin(now * FLOAT_SPD + d.floatOffset) * FLOAT_AMP * floatBlend;
    ctx.beginPath();
    ctx.arc(x, y + floatY, Math.max(0, r), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.15 * lp * alpha})`;
    ctx.fill();
  });
}

function polkaLoop(now) {
  if (polkaPhase === 'off') return;

  if (polkaPhase === 'in') {
    const elapsed = (now - polkaStart) / 1000;
    // quick fade-in of global alpha over first 0.2s to avoid hard pop
    polkaAlpha = Math.min(1, elapsed / 0.2);
    drawDotsFrame(now);
    polkaRaf = requestAnimationFrame(polkaLoop);
  }
  else if (polkaPhase === 'out') {
    const elapsed = (now - polkaFadeStart) / 1000;
    polkaAlpha = Math.max(0, 1 - elapsed / FADE_OUT);
    drawDotsFrame(now);
    if (polkaAlpha > 0) {
      polkaRaf = requestAnimationFrame(polkaLoop);
    } else {
      polkaPhase = 'off';
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
}

function polkaIn() {
  cancelAnimationFrame(polkaRaf);
  polkaPhase = 'in';
  polkaStart = performance.now();
  polkaAlpha = 0;
  polkaRaf   = requestAnimationFrame(polkaLoop);
}

function polkaOut() {
  if (polkaPhase === 'off') return;
  cancelAnimationFrame(polkaRaf);
  polkaPhase     = 'out';
  polkaFadeStart = performance.now();
  polkaRaf       = requestAnimationFrame(polkaLoop);
}

function polkaClear() {
  cancelAnimationFrame(polkaRaf);
  polkaPhase = 'off';
  polkaAlpha = 0;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

/* ══════════════════════════════════════════════════════
   STARS CANVAS — fig-1 hover (work)
   SVG stars spinning/floating on screen
══════════════════════════════════════════════════════ */
const dc   = document.getElementById('dist-canvas');
const dctx = dc.getContext('2d');
let distPhase     = 'off';
let distRaf;
let distAlpha     = 0;
let distFadeStart = null;

function resizeDist() {
  dc.width  = window.innerWidth;
  dc.height = window.innerHeight;
}
resizeDist();
window.addEventListener('resize', resizeDist);

// Star path (single shape, used for all 12 stars on the ring)
const STAR_PATH_D = "M145.7,486.06c.25-.47,0-1.18.27-1.32,1.56-.35,2.32-1.6,2.84-2.7l1.99-4.26c4.18-.32.34-1.3-.31-4.42-.23-1.08,1.51-1.77,2.22-2.73-.28-.92-2.11-1.95-1.92-3.24,5.05-6.08,7.74-3.89,8.84-7.32,1.46-.06,3.05-.94,4.51-.8,2.49,1.67,5.84-1.73,7.47-.86,2.18,1.16,3.84-.47,4.22-1.77.66-2.27,0-4.59-2.36-4.66-1.29-.46-1.65-3.96-4.1-2.72l-3.01-1.2c2.24-.98,2.03-1.66-.07-1.6-7.38,2.84-1.92-3.32-9.9-7.16-.51-.78-1.29-2.11-1.32-3.26.15-.36.28-.79.4-1.29,1.44-1.65,1.56-3.03.69-4.57.88-2.14.32-4.64,1.72-7.13.9-1.59-1.79-2.08-3.02-2.33-1.88-.38-3.29,1.5-4.68,2.36-2.77,1.71-6.37,1.96-7.76,4.46.19.74.69,1.42.73,2.32-1.64.25-2.65.85-2.97,1.83-2.05-1.15-2.73,1.41-4.36,2.29-1.81.99-4.47.32-4.26,2.59l-1.2.03-1.04-.32c-.17-.47-.43-.99-.42-1.42.03-.89.94-1.03,1.7-1.79-3.35.34-5.18-.86-7.64-2.01-.5-.23-1.59.17-2.15-.03-.63-.22-.51-1.44-.98-1.96-3.46,1.79-2.51-1.67-5.77.78l-.84-4.18c-1.63,2.4-2.66,3.9-6.45,3.82l2.92,2.01c-.79.65-3.29,2.86-1.96,3.77,6.48,4.4-2.07.89,6.7,5.95-.24,1.18-.47,2.38-.99,3.51,3.83,7.71,5.56,2.92,6.56,8.02-3.17.99-4.3,3.79-6.57,5.6-2.15,1.72-4.27,3.22-5.53,5.43l-7.4,4.82c1.48,1.6,3.3,1,4.99.89,1.44-.09,3.18.96,4.69.61,3.39,2.85,1.04-3.55,11.69-1.67,0,.39.15,1.19,1.07.93.97-.36,1.75-2.2,3.34-1.99,2.75.37,4.85,2.18,7.33,1.92.61,3.91,4.91,6.84,6.13,10.83,2.05,6.71,2.44,2.42,4.88,6,.39.58.76.48,1.05-.07Z";

const SVG_W = 666.82, SVG_H = 600.32;
const STAR_PATH2D = new Path2D(STAR_PATH_D);
const SVG_CX = SVG_W / 2, SVG_CY = SVG_H / 2;

const N_STARS    = 12;
const STAR_INTRO = 0.9;
let distEntranceStart = null;

// More aggressive tilt — nearly flat like the reference (planet ring / UFO angle)
const TILT_X_DEG = 68;   // very flat — close to horizontal ellipse
const TILT_Z_DEG = -25;  // lean/rotation in plane

function easeOutBack3(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2);
}

// Project a point on a circle with 3D tilt → 2D screen coords
// Returns { x, y, z, scaleF } where scaleF encodes depth
function project3D(angle, ringR, cx, cy) {
  // Circle in XY plane
  const x0 = Math.cos(angle) * ringR;
  const y0 = Math.sin(angle) * ringR;
  const z0 = 0;

  // Rotate around X (flatten the ring)
  const tx = TILT_X_DEG * Math.PI / 180;
  const y1 = y0 * Math.cos(tx) - z0 * Math.sin(tx);
  const z1 = y0 * Math.sin(tx) + z0 * Math.cos(tx);

  // Rotate around Z (lean/twist)
  const tz = TILT_Z_DEG * Math.PI / 180;
  const x2 = x0 * Math.cos(tz) - y1 * Math.sin(tz);
  const y2 = x0 * Math.sin(tz) + y1 * Math.cos(tz);

  // Perspective-based scale: stars in front (positive z) appear bigger
  const normalZ = (z1 / ringR + 1) * 0.5; // 0=back 1=front
  const scaleF  = 0.45 + normalZ * 0.55;  // range 0.45–1.0

  return { x: cx + x2, y: cy + y2, z: z1, normalZ, scaleF };
}

function drawStarsFrame(now) {
  dctx.clearRect(0, 0, dc.width, dc.height);
  if (distAlpha <= 0) return;

  const W = dc.width, H = dc.height;
  const cx = W / 2, cy = H / 2;
  const elapsed = distEntranceStart !== null ? (now - distEntranceStart) / 1000 : 999;

  // Ring radius — wider to match reference (60% of min dim)
  const ringR = Math.min(W, H) * 0.42;

  // Slow ring rotation
  const ringAngle = now * 0.00016;

  // Base star size — bigger (13% of min dim)
  const baseSz    = Math.min(W, H) * 0.18;
  const pathScale = baseSz / Math.max(SVG_W, SVG_H);

  // Build all star data first for back-to-front sort
  const stars = [];
  for (let i = 0; i < N_STARS; i++) {
    const a     = (i / N_STARS) * Math.PI * 2 + ringAngle;
    const proj  = project3D(a, ringR, cx, cy);

    // Entrance: each star slides in from center, staggered
    const local = Math.max(0, elapsed - i * 0.07);
    const prog  = Math.min(1, local / STAR_INTRO);
    const ep    = easeOutBack3(prog);
    const lp    = 1 - Math.pow(1 - prog, 4);

    const ex = proj.x * lp + cx * (1 - lp);
    const ey = proj.y * lp + cy * (1 - lp);

    // Star orientation: tangent to the ring at this position
    // tangent angle = angle + 90° on the projected ellipse
    // approximate: rotate star so it "faces" along the ring
    const tangentAngle = a + Math.PI * 0.5;

    stars.push({ ex, ey, ep, lp, proj, tangentAngle });
  }

  // Sort back to front
  stars.sort((a, b) => a.proj.z - b.proj.z);

  stars.forEach(({ ex, ey, ep, lp, proj, tangentAngle }) => {
    const sz    = pathScale * ep * proj.scaleF;
    // Depth alpha: back stars dimmer, front stars full opacity
    const alpha = 0.35 + proj.normalZ * 0.65;

    dctx.save();
    dctx.globalAlpha = distAlpha * lp * alpha;
    dctx.fillStyle   = '#ffffff';
    dctx.translate(ex, ey);
    dctx.rotate(tangentAngle);
    dctx.scale(sz, sz);
    dctx.translate(-SVG_CX, -SVG_CY);
    dctx.fill(STAR_PATH2D);
    dctx.restore();
  });
}

function distIn() {
  cancelAnimationFrame(distRaf);
  distPhase = 'in';
  distAlpha = 0;
  distEntranceStart = performance.now();
  const fadeStart = performance.now();
  function loop(now) {
    if (distPhase !== 'in') return;
    distAlpha = Math.min(1, (now - fadeStart) / 700);
    drawStarsFrame(now);
    distRaf = requestAnimationFrame(loop);
  }
  distRaf = requestAnimationFrame(loop);
}

function distOut() {
  if (distPhase === 'off') return;
  cancelAnimationFrame(distRaf);
  const alphaAtExit = distAlpha;
  distFadeStart = performance.now();
  distPhase = 'out';
  function loop(now) {
    if (distPhase !== 'out') return;
    distAlpha = Math.max(0, alphaAtExit - (now - distFadeStart) / 450);
    drawStarsFrame(now);
    if (distAlpha > 0) distRaf = requestAnimationFrame(loop);
    else {
      distPhase = 'off';
      dctx.clearRect(0, 0, dc.width, dc.height);
    }
  }
  distRaf = requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════
   HOVER HANDLERS
══════════════════════════════════════════════════════ */
let currentHover = '';



function setH(cls, text) {
  if (bg.classList.contains('leaving')) return;
  currentHover    = cls;
  bg.className    = cls;
  url.textContent = text;
  if (cls === 'h2') polkaIn();  else polkaOut();
  if (cls === 'h1') distIn();   else distOut();
}

function clearH() {
  if (bg.classList.contains('leaving')) return;
  currentHover    = '';
  bg.className    = '';
  url.textContent = 'odile.xyz/hub';
  polkaOut();
  distOut();
}

function navigateTo(href) {
  const ov = document.getElementById('overlay');
  ov.classList.add('on');
  setTimeout(() => { window.location.href = href; }, 700);
}

document.querySelectorAll('.fig').forEach(fig => {
  fig.addEventListener('click', () => {
    if (fig.classList.contains('fig-1')) navigateTo('odile_work.html');
  });
});

/* ══════════════════════════════════════════════════════
   IRIDESCENT BACKGROUND PARALLAX
══════════════════════════════════════════════════════ */
let mx = 0.5, my = 0.5;
const blobs = [
  { x: 50, y: 100 }, { x: 20, y: 60 }, { x: 80, y: 40 }, { x: 50, y: 50 }
];
const base = [
  { x: 50, y: 100 }, { x: 20, y: 60 }, { x: 80, y: 40 }, { x: 50, y: 50 }
];
const blobDef = [
  { ax:  0.38, ay:  0.30, ease: 0.05, color: '220,180,60',  op: 0.70, ex: 90, ey: 70 },
  { ax: -0.42, ay:  0.34, ease: 0.04, color: '200,160,210', op: 0.50, ex: 70, ey: 60 },
  { ax:  0.36, ay: -0.38, ease: 0.045,color: '160,210,200', op: 0.40, ex: 60, ey: 50 },
  { ax:  0.18, ay:  0.16, ease: 0.03, color: '210,200,190', op: 0.30, ex: 80, ey: 80 },
];
document.addEventListener('mousemove', e => {
  mx = e.clientX / window.innerWidth;
  my = e.clientY / window.innerHeight;
});

/* Touch: clear hover on touchend outside a fig */
document.addEventListener('touchend', e => {
  if (!e.target.closest('.fig')) clearH();
});
(function tick() {
  let grad = '';
  blobs.forEach((b, i) => {
    const d = blobDef[i];
    b.x += (base[i].x + (mx - 0.5) * d.ax * 100 - b.x) * d.ease;
    b.y += (base[i].y + (my - 0.5) * d.ay * 100 - b.y) * d.ease;
    grad += `radial-gradient(ellipse ${d.ex}% ${d.ey}% at ${b.x.toFixed(1)}% ${b.y.toFixed(1)}%, rgba(${d.color},${d.op}) 0%, transparent 55%),`;
  });
  iri.style.backgroundImage = grad.slice(0, -1);
  requestAnimationFrame(tick);
})();
</script>
