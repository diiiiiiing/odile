<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>thomas ding</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
<link rel="preconnect" href="https://zgrgr7sj.api.sanity.io" crossorigin>
<style>
  /* work10 — the archive written out as one paragraph. Images sit inline
     like words on a shared baseline, each project at its own "type size";
     the project's name is written just before its pictures, and the bio
     is simply how the paragraph begins. */
  :root{--fs:13px;--pad:12px;}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#fff;}
  html{scrollbar-width:none;}
  html::-webkit-scrollbar{display:none;}
  body{
    color:#000;font-family:Arial,Helvetica,sans-serif;
    font-size:var(--fs);line-height:1;
    text-transform:lowercase;
    -webkit-tap-highlight-color:transparent;
    animation:in .5s ease both;
  }
  @keyframes in{from{opacity:0}to{opacity:1}}
  a,a:visited{color:inherit;text-decoration:none;}
  @media (hover:hover){a:hover{text-decoration:underline;text-underline-offset:2px;}}
  a:focus-visible{outline:1px solid currentColor;outline-offset:2px;}

  /* white + difference: black on the page, inverted over a photo. Set on
     the fixed element itself, which is its own stacking context */
  .ink{color:#fff;mix-blend-mode:difference;}

  /* ── THE PARAGRAPH ── */
  .flow{padding:var(--pad) var(--pad) 22vh;text-align:left;}
  .flow .w{white-space:normal;}
  .flow .w[data-p]{white-space:nowrap;} /* a project's name never breaks across its own pictures */
  .m{
    display:inline-block;vertical-align:baseline;
    /* a wide picture on a narrow screen shrinks to fit rather than
       being squeezed */
    height:min(var(--h),calc((100vw - 2*var(--pad)) / var(--ar,1)));width:auto;
    cursor:pointer;
    opacity:0;transition:opacity .45s ease;
    -webkit-user-drag:none;user-select:none;
  }
  .m.show{opacity:1;}
  video.m{background:#f2f2f2;opacity:1;}
  #proj .m{cursor:default;}
  .end{display:inline-block;margin-top:2em;}

  /* index = the same paragraph, shrunk until the whole archive fits:
     names stay legible, pictures become their own thumbnails */
  #home.mini .m{height:calc(var(--h) * .2);}
  #home.mini .m,#home.mini .w{cursor:pointer;}

  #proj{display:none;}
  body.proj #home{display:none;}
  body.proj #proj{display:block;}

  /* ── MENU ── one line, bottom left */
  #nav{
    position:fixed;left:var(--pad);bottom:calc(var(--pad) + env(safe-area-inset-bottom));z-index:50;
    white-space:nowrap;
  }
  #nav a.on{text-decoration:underline;text-underline-offset:2px;}
  #nav [hidden]{display:none;}

  #label{
    position:fixed;left:0;top:0;z-index:60;pointer-events:none;
    white-space:nowrap;opacity:0;
  }
  #label.on{opacity:1;}

  @media (prefers-reduced-motion:reduce){body{animation:none;}.m{transition:none;}}
</style>
</head>
<body>

<main id="home" class="flow"></main>
<section id="proj" class="flow"></section>

<nav id="nav" class="ink">
  <a href="#" id="navHome">thomas ding</a><span>, </span><a href="#" id="navIndex">index</a><span id="sepShuffle">, </span><a href="#" id="navShuffle">shuffle</a><span id="sepNext" hidden>, </span><a href="#" id="navNext" hidden>next</a>
</nav>
<div id="label" class="ink"></div>

<script>
history.scrollRestoration='manual';

const homeEl=document.getElementById('home');
const projEl=document.getElementById('proj');
const labelEl=document.getElementById('label');
const navHome=document.getElementById('navHome');
const navIndex=document.getElementById('navIndex');
const navShuffle=document.getElementById('navShuffle');
const navNext=document.getElementById('navNext');
const BASE_TITLE=document.title;
const nameOf=p=>p.displayTitle||p.client||p.title;
const narrow=()=>innerWidth<700;

let projects=[];
let order=[];
let openIdx=null;
let homeY=0;
let seed=2004;

function rng(s){
  return()=>{
    s|=0;s=s+0x6D2B79F5|0;
    let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function sizedUrl(url,vh){
  if(!/^https:\/\/cdn\.sanity\.io\/images\//.test(url)||/\.gif(\?|$)/i.test(url))return url;
  const px=vh/100*innerHeight*(window.devicePixelRatio||1);
  const h=Math.min(2400,Math.max(200,Math.ceil(px/200)*200));
  return `${url}${url.includes('?')?'&':'?'}h=${h}&fit=max&auto=format&q=82`;
}

/* ── MEDIA ── loaded as the page nears them; videos play only on screen,
   and not at all in the shrunken index */
const near=new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(!en.isIntersecting)return;
    const el=en.target;
    near.unobserve(el);
    if(el.getAttribute('src'))return;
    /* in the shrunken index a video only fetches enough to show its first
       frame — a still, not forty films playing at once */
    if(el.tagName==='VIDEO'&&inMini(el)){el.preload='metadata';el.src=el.dataset.src+'#t=0.1';}
    else el.src=el.dataset.src;
  });
},{rootMargin:'1200px 0px'});
const vidVis=new IntersectionObserver(entries=>{
  entries.forEach(({target:v,isIntersecting})=>{
    v._vis=isIntersecting;
    if(isIntersecting&&v.getAttribute('src')&&v.paused&&!inMini(v))v.play().catch(()=>{});
    else if(!isIntersecting&&!v.paused)v.pause();
  });
});
const inMini=el=>homeEl.classList.contains('mini')&&!!el.closest('#home');
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  document.querySelectorAll('video.m').forEach(v=>{
    if(v._vis&&v.paused&&v.getAttribute('src')&&!inMini(v))v.play().catch(()=>{});
  });
});
function release(container){
  container.querySelectorAll('.m').forEach(el=>{
    near.unobserve(el);
    if(el.tagName==='VIDEO'){vidVis.unobserve(el);el.pause();el.removeAttribute('src');el.load();}
  });
  container.innerHTML='';
}
function setAr(el,ar){el.style.aspectRatio=String(ar);el.style.setProperty('--ar',String(ar));}
function media(m,pIdx,vh){
  let el;
  if(m.type==='image'){
    el=document.createElement('img');
    el.alt='';el.decoding='async';el.draggable=false;
    setAr(el,m.ar||1);
    el.addEventListener('load',()=>{
      let done=false;const show=()=>{if(!done){done=true;el.classList.add('show');}};
      (el.decode?el.decode():Promise.resolve()).catch(()=>{}).then(show);
      setTimeout(show,300);
    });
    el.dataset.src=sizedUrl(m.url,vh);
  }else{
    el=document.createElement('video');
    el.muted=true;el.loop=true;el.playsInline=true;el.autoplay=true;
    el.preload='none';el.disablePictureInPicture=true;
    setAr(el,16/9);
    el.addEventListener('loadedmetadata',()=>{if(el.videoWidth&&el.videoHeight)setAr(el,el.videoWidth/el.videoHeight);});
    el.addEventListener('play',()=>{if(el._vis===false||inMini(el))el.pause();});
    el.dataset.src=m.url;
    vidVis.observe(el);
  }
  el.classList.add('m');
  el.style.setProperty('--h',vh+'vh');
  el.dataset.p=pIdx;
  near.observe(el);
  return el;
}
const usable=p=>(p.media||[]).filter(m=>m&&m.url&&(m.type==='image'||m.type==='video'));
const word=(text,cls='w')=>{const s=document.createElement('span');s.className=cls;s.textContent=text;return s;};
const space=()=>document.createTextNode(' ');
function link(text,href,{blank=false,onClick=null}={}){
  const a=document.createElement('a');
  a.href=href;a.textContent=text;
  if(blank){a.target='_blank';a.rel='noopener';}
  if(onClick)a.addEventListener('click',e=>{e.preventDefault();onClick();});
  return a;
}

/* ── HOME ── the bio opens the paragraph, then every project: its name,
   then its pictures at that project's own height */
function buildHome(){
  release(homeEl);
  const r=rng(seed);
  order=projects.map((_,i)=>i);
  if(seed!==2004)for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]];}

  const bio=document.createElement('span');
  bio.className='w';
  bio.append(
    'thomas ding, born 2004 in paris. multi-disciplinary designer at ',
    link('unveil®','https://unveil.fr',{blank:true}),
    ', before that women management and dream factory. art direction, graphic design, image, video, ai. ',
    link('thomasding227@gmail.com','mailto:thomasding227@gmail.com'),
    ', ',
    link('@diiiiiiiiiiiiing','https://instagram.com/diiiiiiiiiiiiing',{blank:true}),
    '.'
  );
  homeEl.append(bio,space());

  order.forEach(i=>{
    const p=projects[i];
    const vh=narrow()?12+r()*20:14+r()*34;
    const name=word([nameOf(p),p.year].filter(Boolean).join(', '));
    name.dataset.p=i;
    name.dataset.anchor=i;
    homeEl.append(name,space());
    usable(p).forEach(m=>homeEl.appendChild(media(m,i,vh)));
    homeEl.append(space());
  });
  const end=document.createElement('span');
  end.className='end w';
  end.append('that’s all. ',link('back to the top ↑','#',{onClick:()=>window.scrollTo({top:0,behavior:'smooth'})}));
  homeEl.appendChild(end);
  window.scrollTo(0,0);
}

/* ── PROJECT ── the same paragraph, just this one: its text first, its
   pictures much larger, and the next one named at the end */
function openProject(i,{push=true}={}){
  const p=projects[i];
  if(!p)return;
  if(openIdx===null)homeY=scrollY;
  setMini(false);
  openIdx=i;
  document.body.classList.add('proj');
  hideLabel();
  release(projEl);

  const text=document.createElement('span');
  text.className='w';
  text.append([nameOf(p),p.year].filter(Boolean).join(', '));
  if(p.tags?.length)text.append(' — '+p.tags.join(', '));
  text.append('. ');
  (p.description||[]).forEach(runs=>{
    runs.forEach(run=>{
      if(run.href)text.appendChild(link(run.text,normalizeUrl(run.href),{blank:true}));
      else text.append(run.text);
    });
    text.append(' ');
  });
  if(p.link)text.append(link('visit ↗',p.link,{blank:true}),' ');
  projEl.append(text,space());

  const vh=narrow()?46:66;
  const list=usable(p);
  list.forEach(m=>projEl.appendChild(media(m,i,vh)));
  if(!list.length)projEl.append(word('(nothing here yet)'),space());

  const next=order[(order.indexOf(i)+1)%order.length];
  const end=document.createElement('span');
  end.className='end w';
  end.append('next: ',link(nameOf(projects[next])+' →','#'+projects[next].slug,{onClick:()=>openProject(next)}));
  projEl.appendChild(end);

  navShuffle.hidden=document.getElementById('sepShuffle').hidden=true;
  navNext.hidden=document.getElementById('sepNext').hidden=false;
  navNext.onclick=e=>{e.preventDefault();openProject(next);};
  window.scrollTo(0,0);
  document.title=`${nameOf(p)} — ${BASE_TITLE}`.toLowerCase();
  if(push&&p.slug)history.pushState(null,'','#'+p.slug);
}
function closeProject({push=true,top=false}={}){
  if(openIdx===null){if(top)window.scrollTo({top:0,behavior:'smooth'});return;}
  openIdx=null;
  release(projEl);
  document.body.classList.remove('proj');
  navShuffle.hidden=document.getElementById('sepShuffle').hidden=false;
  navNext.hidden=document.getElementById('sepNext').hidden=true;
  window.scrollTo(0,top?0:homeY);
  document.title=BASE_TITLE;
  if(push&&location.hash)history.pushState(null,'',location.pathname+location.search);
}

/* ── INDEX ── shrink the home paragraph; clicking anything in it grows
   it back and lands you on that spot */
function setMini(on){
  if(on&&openIdx!==null)closeProject();
  homeEl.classList.toggle('mini',on);
  navIndex.classList.toggle('on',on);
  if(on){
    homeEl.querySelectorAll('video.m').forEach(v=>v.pause());
    window.scrollTo(0,0);
  }else{
    homeEl.querySelectorAll('video.m').forEach(v=>{if(v._vis&&v.getAttribute('src'))v.play().catch(()=>{});});
  }
}
homeEl.addEventListener('click',e=>{
  if(e.target.closest('a'))return;
  const el=e.target.closest('[data-p]');
  if(!el)return;
  if(homeEl.classList.contains('mini')){
    setMini(false);
    const target=el.classList.contains('m')?el:el.nextElementSibling||el;
    requestAnimationFrame(()=>target.scrollIntoView({block:'center'}));
    setTimeout(()=>target.scrollIntoView({block:'center'}),60);
    return;
  }
  openProject(+el.dataset.p);
});

navHome.addEventListener('click',e=>{e.preventDefault();setMini(false);closeProject({top:true});});
navIndex.addEventListener('click',e=>{e.preventDefault();setMini(!homeEl.classList.contains('mini'));});
navShuffle.addEventListener('click',e=>{
  e.preventDefault();
  setMini(false);
  seed=Math.floor(Math.random()*1e9);
  buildHome();
});

/* ── LABEL ── the project's name trails the pointer over its pictures */
if(matchMedia('(hover:hover)').matches){
  document.addEventListener('mousemove',e=>{
    const el=e.target.closest?.('.m[data-p]');
    if(!el||openIdx!==null){hideLabel();return;}
    const p=projects[+el.dataset.p];
    const text=[nameOf(p),p.year].filter(Boolean).join(', ');
    if(labelEl.textContent!==text)labelEl.textContent=text;
    const w=labelEl.offsetWidth;
    const x=e.clientX+14+w>innerWidth-8?e.clientX-14-w:e.clientX+14;
    labelEl.style.transform=`translate3d(${x}px,${e.clientY+14}px,0)`;
    labelEl.classList.add('on');
  },{passive:true});
  document.addEventListener('mouseleave',hideLabel);
}
function hideLabel(){labelEl.classList.remove('on');}

window.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(homeEl.classList.contains('mini'))setMini(false);
  else closeProject();
});
window.addEventListener('popstate',()=>{
  const slug=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===slug);
  if(i!==-1){if(i!==openIdx)openProject(i,{push:false});}
  else closeProject({push:false});
});

/* ── SANITY ── same content and query as the other work pages */
const PID='zgrgr7sj',DS='production';
const GROQ=`*[_type=="project"]|order(year desc){
  _id,title,subtitle,client,displayTitle,"year":string(year),"favorite":favorite==true,description,link,
  "tags":tags[]->{title},
  "media":media[]{
    _type,"hidden":hidden==true,
    _type=="image"=>{"url":asset->url,"ar":asset->metadata.dimensions.aspectRatio},
    _type=="file"=>{"url":asset->url,"mime":asset->mimeType},
    _type=="mediaImage"=>{"url":image.asset->url,"ar":image.asset->metadata.dimensions.aspectRatio},
    _type=="mediaVideo"=>{"url":video.asset->url,"mime":video.asset->mimeType}
  }
}`;
function normalizeUrl(href){
  return /^([a-z][a-z0-9+.-]*:|\/|#)/i.test(href)?href:'https://'+href;
}
const SLUG_LETTERS={'ø':'o','œ':'oe','æ':'ae','ð':'d','þ':'th','ł':'l','ß':'ss'};
function slugify(s){
  return String(s||'').toLowerCase()
    .replace(/[øœæðþłß]/g,c=>SLUG_LETTERS[c])
    .normalize('NFKD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')||'project';
}
function assignSlugs(){
  const seen=new Set();
  projects.forEach(p=>{
    const base=slugify(p.displayTitle||p.client||p.title);
    let slug=base,n=2;
    while(seen.has(slug))slug=base+'-'+(n++);
    seen.add(slug);
    p.slug=slug;
  });
}
async function load(){
  try{
    const res=await fetch(`https://${PID}.api.sanity.io/v2021-10-21/data/query/${DS}?query=${encodeURIComponent(GROQ)}`);
    const{result}=await res.json();
    projects=(result||[]).map(p=>({
      title:p.title||'(untitled)',
      client:p.client||'',
      displayTitle:p.displayTitle||'',
      year:p.year||'',
      link:p.link||'',
      description:Array.isArray(p.description)
        ?p.description.filter(b=>b._type==='block'&&Array.isArray(b.children))
          .map(b=>{
            const defs=Object.fromEntries((b.markDefs||[]).map(d=>[d._key,d]));
            return b.children.map(c=>({
              text:c.text||'',
              href:(c.marks||[]).map(k=>defs[k]).find(d=>d&&d._type==='link')?.href||null,
            }));
          })
          .filter(runs=>runs.some(r=>r.text.trim()))
        :[],
      tags:Array.isArray(p.tags)?p.tags.map(t=>(t?.title||'').toLowerCase().trim()).filter(Boolean):[],
      media:Array.isArray(p.media)?p.media.map(m=>{
        if(!m||m.hidden||!m.url)return null;
        if(m._type==='image'||m._type==='mediaImage')return{type:'image',url:m.url,ar:m.ar||1};
        if(m._type==='file'||m._type==='mediaVideo')return{type:'video',url:m.url};
        return null;
      }).filter(Boolean):[],
    }));
  }catch(e){console.warn('[Sanity]',e.message);}
  if(!projects.length){homeEl.textContent='nothing to show right now.';return;}
  assignSlugs();
  buildHome();
  const slug=decodeURIComponent(location.hash.slice(1));
  const i=projects.findIndex(p=>p.slug===slug);
  if(i!==-1)openProject(i,{push:false});
}
load();
</script>
</body>
</html>
