<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    background:#0b0e14; cursor:none;
    font-family:-apple-system,'Helvetica Neue',sans-serif; font-weight:300; font-size:12.5px;
  }

  /* ── Arrival ──
     The cabin resolves first, then the night outside comes up slowly, the
     way eyes take a moment to find anything through the glass. Plain CSS
     animations rather than JS-triggered transitions: they run on their own,
     so a tab opened in the background cannot strand the page dark. */
  @keyframes rise { from{opacity:0} to{opacity:1} }
  #frame  { animation:rise 1.2s ease .15s both; }
  #view   { animation:rise 3.0s ease .55s both; }
  #topNav { animation:rise 1.4s ease 2.2s both; }
  #cur    { animation:rise .8s ease 2.4s both; }

  #cur{position:fixed;width:5px;height:5px;background:#FFD5F8;
    box-shadow:0 0 5px 0px #FFD5F866;
    pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
  #overlay{position:fixed;inset:0;background:#b8b8bc;z-index:1000;
    opacity:0;pointer-events:none;transition:opacity .7s ease;}
  #overlay.on{opacity:1;pointer-events:auto;}

  /* ── the whole POV: shakes as one, as if the head were in the cabin ── */
  #scene{
    position:fixed;inset:0;z-index:1;
    will-change:transform;
  }

  /* ── outside the window ──
     Everything out here is flat polygons moved with transform only: no
     filters, no background-position, nothing that forces a repaint per
     frame. Each strip is two copies of one tile, so sliding it by exactly
     half its width loops seamlessly.

     #view is sized by JS to hug the window opening rather than the whole
     viewport. The sky is only ever visible through that hole, and every
     strip is 200% of this box — painting it full-bleed meant rasterising
     textures more than twice the area actually seen. */
  #view{
    position:absolute;inset:0;
    overflow:hidden;
    /* night: moon, a scattered field of stars and the sky itself, all
       painted into this layer. Static, so they cost one rasterisation
       and never a frame. */
    background:
      radial-gradient(circle 210px at 23% 14%, rgba(188,206,240,.09),  rgba(188,206,240,0) 70%),
      radial-gradient(circle 74px  at 23% 14%, rgba(204,219,248,.14),  rgba(204,219,248,0) 72%),
      radial-gradient(circle 16px  at 23% 14%, rgba(233,240,255,.94), rgba(233,240,255,.89) 74%, rgba(233,240,255,0) 100%),
      radial-gradient(0.8px 0.8px at 11.2% 26.9%, rgba(255,255,255,0.44), rgba(255,255,255,0) 100%),
      radial-gradient(1.0px 1.0px at 67.1% 8.6%, rgba(255,255,255,0.40), rgba(255,255,255,0) 100%),
      radial-gradient(1.3px 1.3px at 12.4% 55.1%, rgba(255,255,255,0.28), rgba(255,255,255,0) 100%),
      radial-gradient(1.0px 1.0px at 3.7% 41.9%, rgba(255,255,255,0.32), rgba(255,255,255,0) 100%),
      radial-gradient(1.0px 1.0px at 89.2% 46.1%, rgba(255,255,255,0.40), rgba(255,255,255,0) 100%),
      radial-gradient(1.1px 1.1px at 28.1% 5.7%, rgba(255,255,255,0.70), rgba(255,255,255,0) 100%),
      radial-gradient(0.9px 0.9px at 86.7% 37.9%, rgba(255,255,255,0.25), rgba(255,255,255,0) 100%),
      radial-gradient(1.2px 1.2px at 11.9% 61.4%, rgba(255,255,255,0.48), rgba(255,255,255,0) 100%),
      radial-gradient(0.9px 0.9px at 54.4% 53.2%, rgba(255,255,255,0.44), rgba(255,255,255,0) 100%),
      radial-gradient(0.8px 0.8px at 23.2% 44.5%, rgba(255,255,255,0.55), rgba(255,255,255,0) 100%),
      radial-gradient(1.0px 1.0px at 33.1% 42.1%, rgba(255,255,255,0.52), rgba(255,255,255,0) 100%),
      radial-gradient(1.3px 1.3px at 42.3% 50.7%, rgba(255,255,255,0.34), rgba(255,255,255,0) 100%),
      radial-gradient(1.0px 1.0px at 27.3% 32.9%, rgba(255,255,255,0.45), rgba(255,255,255,0) 100%),
      radial-gradient(1.2px 1.2px at 95.5% 31.5%, rgba(255,255,255,0.29), rgba(255,255,255,0) 100%),
      radial-gradient(0.8px 0.8px at 51.3% 60.0%, rgba(255,255,255,0.71), rgba(255,255,255,0) 100%),
      radial-gradient(1.2px 1.2px at 66.5% 35.5%, rgba(255,255,255,0.35), rgba(255,255,255,0) 100%),
      radial-gradient(0.9px 0.9px at 69.9% 14.0%, rgba(255,255,255,0.49), rgba(255,255,255,0) 100%),
      radial-gradient(0.9px 0.9px at 11.5% 18.5%, rgba(255,255,255,0.34), rgba(255,255,255,0) 100%),
      radial-gradient(1.0px 1.0px at 41.4% 60.9%, rgba(255,255,255,0.31), rgba(255,255,255,0) 100%),
      radial-gradient(1.3px 1.3px at 76.0% 14.7%, rgba(255,255,255,0.52), rgba(255,255,255,0) 100%),
      radial-gradient(0.9px 0.9px at 42.0% 7.0%, rgba(255,255,255,0.30), rgba(255,255,255,0) 100%),
      radial-gradient(1.2px 1.2px at 77.5% 57.9%, rgba(255,255,255,0.58), rgba(255,255,255,0) 100%),
      radial-gradient(1.3px 1.3px at 45.9% 10.0%, rgba(255,255,255,0.52), rgba(255,255,255,0) 100%),
      radial-gradient(1.0px 1.0px at 86.7% 54.0%, rgba(255,255,255,0.45), rgba(255,255,255,0) 100%),
      radial-gradient(1.3px 1.3px at 88.9% 24.5%, rgba(255,255,255,0.38), rgba(255,255,255,0) 100%),
      radial-gradient(1.1px 1.1px at 50.2% 5.7%, rgba(255,255,255,0.58), rgba(255,255,255,0) 100%),
      radial-gradient(0.8px 0.8px at 6.3% 37.5%, rgba(255,255,255,0.53), rgba(255,255,255,0) 100%),
      radial-gradient(0.8px 0.8px at 4.4% 21.0%, rgba(255,255,255,0.27), rgba(255,255,255,0) 100%),
      radial-gradient(0.9px 0.9px at 62.1% 22.8%, rgba(255,255,255,0.49), rgba(255,255,255,0) 100%),
      radial-gradient(0.8px 0.8px at 43.0% 32.1%, rgba(255,255,255,0.58), rgba(255,255,255,0) 100%),
      radial-gradient(0.8px 0.8px at 3.4% 32.4%, rgba(255,255,255,0.42), rgba(255,255,255,0) 100%),
      radial-gradient(1.3px 1.3px at 22.2% 56.7%, rgba(255,255,255,0.60), rgba(255,255,255,0) 100%),
      linear-gradient(180deg, #04060e 0%, #060b17 22%, #0a1324 46%, #101c31 70%, #17273f 88%, #1d3049 100%);
    will-change:transform;
  }
  .strip{
    position:absolute;left:0;width:200%;
    will-change:transform;
  }
  .strip svg{width:100%;height:100%;display:block;}
  @keyframes drift{
    from{transform:translate3d(-50%,0,0);}
    to  {transform:translate3d(0,0,0);}
  }

  /* distance sets the pace: the ridge barely creeps, the near wisps race.
     Vertical placement is set in JS, anchored to the window opening rather
     than to #view, which may be cropped by a narrow screen. */
  @keyframes bob { 0%,100%{translate:0 0} 50%{translate:0 var(--bob)} }
  #sRidge{--bob:3px; opacity:.62; animation:drift 210s linear infinite, bob 41s ease-in-out infinite;}
  #sDeck {--bob:9px;              animation:drift  84s linear infinite, bob 26s ease-in-out infinite;}
  #sNear {--bob:13px;opacity:.30; animation:drift  27s linear infinite, bob 19s ease-in-out infinite;}


  /* ── signs of life in the sky ──
     Tiny elements, animated only on opacity and translate. They sit inside
     #view, so the glass still occludes them like everything else out there. */
  @keyframes twinkle { 0%,100%{opacity:var(--lo)} 50%{opacity:var(--hi)} }
  .tw{position:absolute;width:2px;height:2px;border-radius:50%;
      background:#fff;will-change:opacity;
      animation:twinkle var(--dur) ease-in-out infinite var(--del);}

  /* mostly waiting, then a quick streak — each has its own keyframes
     below, since custom properties cannot be step selectors */
  .shoot{position:absolute;width:60px;height:1.5px;border-radius:1px;
         background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9));
         opacity:0;will-change:opacity,translate;transform-origin:100% 50%;}
  @keyframes shoot0{0%{opacity:0;translate:0 0}0.00%{opacity:0;translate:0 0}0.90%{opacity:.85}3.40%{opacity:0;translate:260px 150px}100%{opacity:0;translate:260px 150px}}
  @keyframes shoot1{0%{opacity:0;translate:0 0}0.00%{opacity:0;translate:0 0}0.90%{opacity:.85}3.40%{opacity:0;translate:200px 118px}100%{opacity:0;translate:200px 118px}}
  @keyframes shoot2{0%{opacity:0;translate:0 0}0.00%{opacity:0;translate:0 0}0.90%{opacity:.85}3.40%{opacity:0;translate:170px 96px}100%{opacity:0;translate:170px 96px}}

  /* ── the cabin: image with a transparent window, laid over the view ── */
  picture{display:contents;}
  #frame{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }

  /* back to hub */
  #topNav{
    position:fixed;top:0;left:0;right:0;height:50px;
    padding:0 20px;display:flex;align-items:center;
    z-index:400;
  }
  #homeBtn{
    color:rgba(255,255,255,0.62);text-decoration:none;cursor:none;
    transition:color .4s ease;
  }
  #homeBtn:hover{color:rgba(255,255,255,0.95);}
  #navSep{color:rgba(255,255,255,0.34);margin:0 2px;}
  #navSection{color:rgba(255,255,255,0.78);}

  @media (hover:none){
    #cur{display:none;}
    *,*::before,*::after{cursor:auto!important;}
  }
  @media (prefers-reduced-motion:reduce){
    .strip{animation:none;transform:translate3d(-50%,0,0);}
  }
</style>
</head>
<body>
<div id="overlay"></div>
<script>window.addEventListener('pageshow',()=>{const o=document.getElementById('overlay');if(o)o.classList.remove('on');});</script>
<div id="cur"></div>

<!-- SoundCloud — invisible, autoplaying, no controls exposed.
     The opening track is picked in the URL rather than by skipping once the
     player is up: a skip re-cues the deck and that reload is what used to
     hold back the first note. start_track is read before anything loads, so
     a random pick costs nothing. -->
<script>
(function(){
  const TRACKS_KEY = 'odile.radio.tracks';
  let len = 10;                 /* until the widget tells us the real count */
  try { const n = parseInt(localStorage.getItem(TRACKS_KEY), 10); if (n > 0) len = n; } catch(e){}
  const f = document.createElement('iframe');
  f.id = 'sc-widget';
  f.src = 'https://w.soundcloud.com/player/?url=' +
    encodeURIComponent('https://soundcloud.com/user-322526836/sets/heavens-gate') +
    '&auto_play=true&start_track=' + Math.floor(Math.random() * len) +
    '&hide_related=true&show_comments=false&show_user=false' +
    '&show_reposts=false&show_teaser=false&visual=false';
  f.allow = 'autoplay';
  f.tabIndex = -1;
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:absolute;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.currentScript.parentNode.insertBefore(f, document.currentScript);
})();
</script>

<script>
/* cursor */
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px';
});

/* back to hub */
document.getElementById('homeBtn').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('overlay').classList.add('on');
  setTimeout(() => window.location.href = 'odile_hub.html', 700);
});

/* ══════════════════════════════════════════════════════
   THE WINDOW OPENING
   Measured off the cabin image's alpha channel: the glass spans 17.8%→81.1%
   of its width and 13.5%→87.2% of its height. Sizing the sky to that hole
   instead of the viewport cuts the parallax textures to roughly 40% of what
   they were, which is most of what made this page stutter.
══════════════════════════════════════════════════════ */
(function(){
  const view = document.getElementById('view');
  const IW = 2000, IH = 1129;                      /* cabin image, natural px */
  const X0 = 0.178, X1 = 0.811, Y0 = 0.1346, Y1 = 0.8716;
  const PAD = 0.025;             /* slack for the shake and the 1.012 scale */

  /* each band as a fraction of the opening: [top, height] */
  const BANDS = { sNear:[0.06,0.26], sRidge:[0.38,0.26], sDeck:[0.60,0.40] };

  function fitView(){
    const vw = innerWidth, vh = innerHeight;
    /* mirror object-fit: cover so the box tracks the glass at any aspect */
    const s = Math.max(vw / IW, vh / IH);
    const dw = IW * s, dh = IH * s;
    const ox = (vw - dw) / 2, oy = (vh - dh) / 2;

    /* the opening, in viewport coordinates */
    const wl = ox + (X0 - PAD) * dw, wt = oy + (Y0 - PAD) * dh;
    const ww = (X1 - X0 + PAD * 2) * dw, wh = (Y1 - Y0 + PAD * 2) * dh;

    /* On a screen whose shape differs from the image, cover crops hard and
       the opening runs well past the edges. Clip to what can actually be
       seen — off-screen sky still costs a full texture. */
    const M = 8;
    const cl = Math.max(wl, -M), ct = Math.max(wt, -M);
    const cr = Math.min(wl + ww, vw + M), cb = Math.min(wt + wh, vh + M);
    view.style.left   = cl + 'px';
    view.style.top    = ct + 'px';
    view.style.width  = Math.max(0, cr - cl) + 'px';
    view.style.height = Math.max(0, cb - ct) + 'px';

    /* keep the horizon tied to the glass, not to the clipped box */
    const dy = wt - ct;
    for (const id in BANDS){
      const [t, h] = BANDS[id], el = document.getElementById(id);
      el.style.top    = (dy + t * wh) + 'px';
      el.style.height = (h * wh) + 'px';
    }
  }
  fitView();
  addEventListener('resize', fitView, { passive:true });
  addEventListener('orientationchange', fitView, { passive:true });
})();

/* ══════════════════════════════════════════════════════
   TURBULENCE — the cabin never sits perfectly still
══════════════════════════════════════════════════════ */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const scene = document.getElementById('scene');
  const view  = document.getElementById('view');
  const t0 = performance.now();

  let settle = 1;              /* rougher air on arrival, easing to cruise */

  (function shake(now){
    const t = (now - t0) / 1000;
    settle += (0 - settle) * 0.0035;
    /* incommensurable frequencies so the motion never visibly repeats,
       under a slow envelope that breathes between calm and bumpy air */
    const env = (0.62 + 0.38 * (0.5 + 0.5 * Math.sin(t * 0.13 + 1.1))) * (1 + settle * 1.4);
    const x = (Math.sin(t*0.71)*2.3 + Math.sin(t*1.93+1.3)*0.85 + Math.sin(t*3.71+2.1)*0.3) * env;
    const y = (Math.cos(t*0.89+0.5)*1.9 + Math.sin(t*2.31+0.7)*0.7 + Math.cos(t*4.13)*0.26) * env;
    const r = (Math.sin(t*0.47)*0.15 + Math.sin(t*1.71+0.9)*0.055) * env;
    scene.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(3)}deg) scale(1.012)`;
    /* A long, shallow bank. It goes on the world rather than the cabin: a
       passenger banks with the aircraft, so what they see tilt is the
       horizon. Amplitude is kept under a degree — the view is the window's
       bounding box plus 2.5% of slack, and more rotation than this would
       swing a corner out from behind the glass. */
    const bank = Math.sin(t*0.083 + 0.4) * 0.40 + Math.sin(t*0.037 + 2.2) * 0.20;
    /* the view lags the glass a touch — parallax between window and world */
    view.style.transform  = `translate3d(${(-x*0.42).toFixed(2)}px,${(-y*0.5).toFixed(2)}px,0) rotate(${bank.toFixed(3)}deg)`;
    requestAnimationFrame(shake);
  })(t0);
})();

/* ══════════════════════════════════════════════════════
   SOUND — music up front, cabin ambience underneath
══════════════════════════════════════════════════════ */
const MUSIC_FADE = 1800;   /* short: the music has to be audible at once */
const AMB_FADE   = 4000;   /* the room tone can take its time */

/* ── cabin ambience: two elements crossfaded so the loop has no seam ── */
const AMB_URL = 'plane-cabin.m4a';
const AMB_VOL = 0.42;      /* sits under the music */
const XFADE   = 4;         /* seconds of overlap at the seam */
const beds = [new Audio(AMB_URL), new Audio(AMB_URL)];
beds[0].preload = 'auto';
/* the second bed is not needed until the first is nearly through, and
   fetching both up front doubled the bytes competing with the artwork
   during the opening seconds */
beds[1].preload = 'none';
beds.forEach(a => { a.volume = 0; });
let bed = 0, ambGain = 0, ambPrev = performance.now(), armed = false;

function playBeds(){ beds[bed].play().catch(()=>{}); }

/* The crossfade below is driven by rAF, which a background tab throttles to
   a crawl — it can sail straight past the 4s seam and leave the room tone
   stopped for good. If a bed ever reaches its end, hand over by force. */
beds.forEach((a, i) => a.addEventListener('ended', () => {
  if (bed !== i) return;
  a.currentTime = 0;
  const nxt = beds[1 - bed];
  nxt.preload = 'auto';
  nxt.currentTime = 0;
  nxt.volume = ambGain * ambGain * AMB_VOL;
  nxt.play().catch(()=>{});
  bed = 1 - bed; armed = false;
}));

function tickAmbience(now){
  /* advanced by frame delta so a backgrounded tab resumes the swell
     smoothly instead of snapping to full volume when focused */
  ambGain = Math.min(ambGain + Math.min(now - ambPrev, 100) / AMB_FADE, 1);
  ambPrev = now;
  const base = ambGain * ambGain * AMB_VOL;

  const cur = beds[bed], nxt = beds[1-bed];
  const d = cur.duration;
  /* arm the standby bed a little before the seam so it is buffered in time
     without costing anything at page load */
  if (!armed && d && cur.currentTime > d - XFADE - 15) {
    armed = true; nxt.preload = 'auto'; nxt.load();
  }
  if (d && cur.currentTime > d - XFADE) {
    if (nxt.paused) { nxt.currentTime = 0; nxt.play().catch(()=>{}); }
    const k = Math.max(0, Math.min((d - cur.currentTime) / XFADE, 1));
    cur.volume = base * k;
    nxt.volume = base * (1 - k);
    if (k <= 0.001) { cur.pause(); cur.currentTime = 0; bed = 1 - bed; armed = false; }
  } else {
    cur.volume = base;
    if (!nxt.paused) nxt.volume = 0;
  }
  requestAnimationFrame(tickAmbience);
}

/* ── SoundCloud playlist ──
   The iframe already carries auto_play, so the deck is rolling by the time
   the API binds; we only take the volume down to zero and ride it back up.
   Nothing is skipped or re-cued first — that reload was what delayed the
   first note. */
const widget = SC.Widget(document.getElementById('sc-widget'));
let started = false, fading = false;

function startPlayback(){ widget.play(); }

function fadeIn(){
  if (fading) return;
  fading = true;
  let prev = performance.now(), t = 0;
  (function ramp(now){
    t = Math.min(t + Math.min(now - prev, 100) / MUSIC_FADE, 1);
    prev = now;
    /* near-linear: a quadratic curve would keep the opening seconds
       inaudible, which reads as the music failing to start */
    widget.setVolume(Math.round(Math.pow(t, 1.25) * 100));
    if (t < 1) requestAnimationFrame(ramp);
  })(prev);
}

widget.bind(SC.Widget.Events.READY, () => {
  widget.setVolume(0);
  startPlayback();
  /* learn how long the playlist really is so the next visit can draw from
     all of it — asked once playback is under way, so it costs nothing */
  widget.getSounds(list => {
    if (list && list.length) {
      try { localStorage.setItem('odile.radio.tracks', list.length); } catch(e){}
    }
  });
});
widget.bind(SC.Widget.Events.PLAY,   () => { started = true; fadeIn(); });
widget.bind(SC.Widget.Events.FINISH, () => { widget.next(); setTimeout(startPlayback, 200); });

/* keep nudging for a few seconds: the widget may not have been ready on the
   first call, and some browsers only release audio once the tab is focused */
let tries = 0;
const nudge = setInterval(() => {
  if (started || ++tries > 20) return clearInterval(nudge);
  startPlayback();
}, 400);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !started) startPlayback();
});

/* everything starts on its own; these listeners are only a safety net for
   browsers that refuse unprompted autoplay — nothing is asked of the visitor */
playBeds();
requestAnimationFrame(tickAmbience);

['pointerdown','keydown','touchstart','scroll'].forEach(ev => {
  document.addEventListener(ev, () => {
    if (!started) startPlayback();
    if (beds[bed].paused) playBeds();
  }, { passive:true });
});
</script>
</body>
</html>
