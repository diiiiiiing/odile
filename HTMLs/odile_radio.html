<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODILE — RADIO</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; }
  body {
    background:#6b6b6d; cursor:none;
    font-family:-apple-system,'Helvetica Neue',sans-serif; font-weight:300; font-size:12.5px;
    animation:fadeIn 1.2s ease both;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  #cur{position:fixed;width:5px;height:5px;background:#FFD5F8;
    box-shadow:0 0 5px 0px #FFD5F866;
    pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}
  #overlay{position:fixed;inset:0;background:#b8b8bc;z-index:1000;
    opacity:0;pointer-events:none;transition:opacity .7s ease;}
  #overlay.on{opacity:1;pointer-events:auto;}

  /* ── the whole POV: shakes as one, as if the head were in the cabin ── */
  #scene{
    position:fixed;inset:0;z-index:1;
    will-change:transform;
  }

  /* ── outside the window ──
     Everything out here is flat polygons moved with transform only: no
     filters, no background-position, nothing that forces a repaint per
     frame. Each strip is two copies of one tile, so sliding it by exactly
     half its width loops seamlessly.

     #view is sized by JS to hug the window opening rather than the whole
     viewport. The sky is only ever visible through that hole, and every
     strip is 200% of this box — painting it full-bleed meant rasterising
     textures more than twice the area actually seen. */
  #view{
    position:absolute;inset:0;
    overflow:hidden;
    background:linear-gradient(180deg,
      #fcfcfd 0%, #f3f3f7 30%, #e8e8ef 54%, #dcdce5 76%, #d0d0db 100%);
    will-change:transform;
  }
  .strip{
    position:absolute;left:0;width:200%;
    will-change:transform;
  }
  .strip svg{width:100%;height:100%;display:block;}
  @keyframes drift{
    from{transform:translate3d(-50%,0,0);}
    to  {transform:translate3d(0,0,0);}
  }

  /* distance sets the pace: the ridge barely creeps, the near wisps race.
     Vertical placement is set in JS, anchored to the window opening rather
     than to #view, which may be cropped by a narrow screen. */
  #sRidge{animation:drift 210s linear infinite;opacity:.55;}
  #sDeck {animation:drift  84s linear infinite;}
  #sNear {animation:drift  27s linear infinite;opacity:.55;}

  /* ── the cabin: image with a transparent window, laid over the view ── */
  picture{display:contents;}
  #frame{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }

  /* back to hub */
  #topNav{
    position:fixed;top:0;left:0;right:0;height:50px;
    padding:0 20px;display:flex;align-items:center;
    z-index:400;
  }
  #homeBtn{
    color:rgba(255,255,255,0.62);text-decoration:none;cursor:none;
    transition:color .4s ease;
  }
  #homeBtn:hover{color:rgba(255,255,255,0.95);}
  #navSep{color:rgba(255,255,255,0.34);margin:0 2px;}
  #navSection{color:rgba(255,255,255,0.78);}

  @media (hover:none){
    #cur{display:none;}
    *,*::before,*::after{cursor:auto!important;}
  }
  @media (prefers-reduced-motion:reduce){
    .strip{animation:none;transform:translate3d(-50%,0,0);}
  }
</style>
</head>
<body>
<div id="overlay"></div>
<script>window.addEventListener('pageshow',()=>{const o=document.getElementById('overlay');if(o)o.classList.remove('on');});</script>
<div id="cur"></div>

<!-- SoundCloud — invisible, autoplaying, no controls exposed -->
<iframe id="sc-widget"
  src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/user-322526836/sets/heavens-gate&auto_play=true&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
  style="position:absolute;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;"
  allow="autoplay" tabindex="-1" aria-hidden="true"></iframe>

<div id="scene">
  <div id="view">

    <!-- distant ridge -->
    <div class="strip" id="sRidge">
      <svg viewBox="0 0 2400 200" preserveAspectRatio="none">
        <g id="ridge" fill="#a9a9b6">
          <polygon points="0,140 85,96 165,130 275,60 360,118 455,88 570,134 690,70 795,124 900,100 1020,138 1115,108 1200,140 1200,200 0,200"/>
        </g>
        <use href="#ridge" x="1200"/>
      </svg>
    </div>

    <!-- the cloud deck the plane rides above -->
    <div class="strip" id="sDeck">
      <svg viewBox="0 0 2400 300" preserveAspectRatio="none">
        <g id="deck">
          <polygon fill="#e2e2ea" points="0,120 90,98 175,126 300,72 395,104 470,88 590,130 700,96 810,120 900,76 1010,112 1105,94 1200,120 1200,300 0,300"/>
          <polygon fill="#ffffff" points="0,172 110,150 205,178 320,138 430,166 545,142 660,180 775,152 880,176 985,146 1100,170 1200,172 1200,300 0,300"/>
        </g>
        <use href="#deck" x="1200"/>
      </svg>
    </div>

    <!-- near wisps streaking past the glass -->
    <div class="strip" id="sNear">
      <svg viewBox="0 0 2400 260" preserveAspectRatio="none">
        <g id="near" fill="#ffffff">
          <polygon points="30,150 240,118 420,140 260,164"/>
          <polygon points="560,70 780,46 900,68 700,92"/>
          <polygon points="950,190 1150,164 1190,178 1030,206"/>
        </g>
        <use href="#near" x="1200"/>
      </svg>
    </div>

  </div>
  <img id="frame" src="plane-window.png" alt="" decoding="async" fetchpriority="high">
</div>

<nav id="topNav">
  <a id="homeBtn" href="odile_hub.html">odile.xyz</a><span id="navSep"> / </span><span id="navSection">radio</span>
</nav>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
/* cursor */
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px'; cur.style.top = e.clientY+'px';
});

/* back to hub */
document.getElementById('homeBtn').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('overlay').classList.add('on');
  setTimeout(() => window.location.href = 'odile_hub.html', 700);
});

/* ══════════════════════════════════════════════════════
   THE WINDOW OPENING
   Measured off the cabin image's alpha channel: the glass spans 17.8%→81.1%
   of its width and 13.5%→87.2% of its height. Sizing the sky to that hole
   instead of the viewport cuts the parallax textures to roughly 40% of what
   they were, which is most of what made this page stutter.
══════════════════════════════════════════════════════ */
(function(){
  const view = document.getElementById('view');
  const IW = 2000, IH = 1129;                      /* cabin image, natural px */
  const X0 = 0.178, X1 = 0.811, Y0 = 0.1346, Y1 = 0.8716;
  const PAD = 0.025;             /* slack for the shake and the 1.012 scale */

  /* each band as a fraction of the opening: [top, height] */
  const BANDS = { sRidge:[0.50,0.16], sDeck:[0.55,0.45], sNear:[0.10,0.30] };

  function fitView(){
    const vw = innerWidth, vh = innerHeight;
    /* mirror object-fit: cover so the box tracks the glass at any aspect */
    const s = Math.max(vw / IW, vh / IH);
    const dw = IW * s, dh = IH * s;
    const ox = (vw - dw) / 2, oy = (vh - dh) / 2;

    /* the opening, in viewport coordinates */
    const wl = ox + (X0 - PAD) * dw, wt = oy + (Y0 - PAD) * dh;
    const ww = (X1 - X0 + PAD * 2) * dw, wh = (Y1 - Y0 + PAD * 2) * dh;

    /* On a screen whose shape differs from the image, cover crops hard and
       the opening runs well past the edges. Clip to what can actually be
       seen — off-screen sky still costs a full texture. */
    const M = 8;
    const cl = Math.max(wl, -M), ct = Math.max(wt, -M);
    const cr = Math.min(wl + ww, vw + M), cb = Math.min(wt + wh, vh + M);
    view.style.left   = cl + 'px';
    view.style.top    = ct + 'px';
    view.style.width  = Math.max(0, cr - cl) + 'px';
    view.style.height = Math.max(0, cb - ct) + 'px';

    /* keep the horizon tied to the glass, not to the clipped box */
    const dy = wt - ct;
    for (const id in BANDS){
      const [t, h] = BANDS[id], el = document.getElementById(id);
      el.style.top    = (dy + t * wh) + 'px';
      el.style.height = (h * wh) + 'px';
    }
  }
  fitView();
  addEventListener('resize', fitView, { passive:true });
  addEventListener('orientationchange', fitView, { passive:true });
})();

/* ══════════════════════════════════════════════════════
   TURBULENCE — the cabin never sits perfectly still
══════════════════════════════════════════════════════ */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const scene = document.getElementById('scene');
  const view  = document.getElementById('view');
  const t0 = performance.now();

  (function shake(now){
    const t = (now - t0) / 1000;
    /* incommensurable frequencies so the motion never visibly repeats,
       under a slow envelope that breathes between calm and bumpy air */
    const env = 0.62 + 0.38 * (0.5 + 0.5 * Math.sin(t * 0.13 + 1.1));
    const x = (Math.sin(t*0.71)*2.3 + Math.sin(t*1.93+1.3)*0.85 + Math.sin(t*3.71+2.1)*0.3) * env;
    const y = (Math.cos(t*0.89+0.5)*1.9 + Math.sin(t*2.31+0.7)*0.7 + Math.cos(t*4.13)*0.26) * env;
    const r = (Math.sin(t*0.47)*0.15 + Math.sin(t*1.71+0.9)*0.055) * env;
    scene.style.transform = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0) rotate(${r.toFixed(3)}deg) scale(1.012)`;
    /* the view lags the glass a touch — parallax between window and world */
    view.style.transform  = `translate3d(${(-x*0.42).toFixed(2)}px,${(-y*0.5).toFixed(2)}px,0)`;
    requestAnimationFrame(shake);
  })(t0);
})();

/* ══════════════════════════════════════════════════════
   SOUND — music up front, cabin ambience underneath
══════════════════════════════════════════════════════ */
const MUSIC_FADE = 1800;   /* short: the music has to be audible at once */
const AMB_FADE   = 4000;   /* the room tone can take its time */

/* ── cabin ambience: two elements crossfaded so the loop has no seam ── */
const AMB_URL = 'plane-cabin.m4a';
const AMB_VOL = 0.42;      /* sits under the music */
const XFADE   = 4;         /* seconds of overlap at the seam */
const beds = [new Audio(AMB_URL), new Audio(AMB_URL)];
beds[0].preload = 'auto';
/* the second bed is not needed until the first is nearly through, and
   fetching both up front doubled the bytes competing with the artwork
   during the opening seconds */
beds[1].preload = 'none';
beds.forEach(a => { a.volume = 0; });
let bed = 0, ambGain = 0, ambPrev = performance.now(), armed = false;

function playBeds(){ beds[bed].play().catch(()=>{}); }

/* The crossfade below is driven by rAF, which a background tab throttles to
   a crawl — it can sail straight past the 4s seam and leave the room tone
   stopped for good. If a bed ever reaches its end, hand over by force. */
beds.forEach((a, i) => a.addEventListener('ended', () => {
  if (bed !== i) return;
  a.currentTime = 0;
  const nxt = beds[1 - bed];
  nxt.preload = 'auto';
  nxt.currentTime = 0;
  nxt.volume = ambGain * ambGain * AMB_VOL;
  nxt.play().catch(()=>{});
  bed = 1 - bed; armed = false;
}));

function tickAmbience(now){
  /* advanced by frame delta so a backgrounded tab resumes the swell
     smoothly instead of snapping to full volume when focused */
  ambGain = Math.min(ambGain + Math.min(now - ambPrev, 100) / AMB_FADE, 1);
  ambPrev = now;
  const base = ambGain * ambGain * AMB_VOL;

  const cur = beds[bed], nxt = beds[1-bed];
  const d = cur.duration;
  /* arm the standby bed a little before the seam so it is buffered in time
     without costing anything at page load */
  if (!armed && d && cur.currentTime > d - XFADE - 15) {
    armed = true; nxt.preload = 'auto'; nxt.load();
  }
  if (d && cur.currentTime > d - XFADE) {
    if (nxt.paused) { nxt.currentTime = 0; nxt.play().catch(()=>{}); }
    const k = Math.max(0, Math.min((d - cur.currentTime) / XFADE, 1));
    cur.volume = base * k;
    nxt.volume = base * (1 - k);
    if (k <= 0.001) { cur.pause(); cur.currentTime = 0; bed = 1 - bed; armed = false; }
  } else {
    cur.volume = base;
    if (!nxt.paused) nxt.volume = 0;
  }
  requestAnimationFrame(tickAmbience);
}

/* ── SoundCloud playlist ──
   The iframe already carries auto_play, so the deck is rolling by the time
   the API binds; we only take the volume down to zero and ride it back up.
   Nothing is skipped or re-cued first — that reload was what delayed the
   first note. */
const widget = SC.Widget(document.getElementById('sc-widget'));
let started = false, fading = false;

function startPlayback(){ widget.play(); }

function fadeIn(){
  if (fading) return;
  fading = true;
  let prev = performance.now(), t = 0;
  (function ramp(now){
    t = Math.min(t + Math.min(now - prev, 100) / MUSIC_FADE, 1);
    prev = now;
    /* near-linear: a quadratic curve would keep the opening seconds
       inaudible, which reads as the music failing to start */
    widget.setVolume(Math.round(Math.pow(t, 1.25) * 100));
    if (t < 1) requestAnimationFrame(ramp);
  })(prev);
}

widget.bind(SC.Widget.Events.READY, () => {
  widget.setVolume(0);
  startPlayback();
});
widget.bind(SC.Widget.Events.PLAY,   () => { started = true; fadeIn(); });
widget.bind(SC.Widget.Events.FINISH, () => { widget.next(); setTimeout(startPlayback, 200); });

/* keep nudging for a few seconds: the widget may not have been ready on the
   first call, and some browsers only release audio once the tab is focused */
let tries = 0;
const nudge = setInterval(() => {
  if (started || ++tries > 20) return clearInterval(nudge);
  startPlayback();
}, 400);

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !started) startPlayback();
});

/* everything starts on its own; these listeners are only a safety net for
   browsers that refuse unprompted autoplay — nothing is asked of the visitor */
playBeds();
requestAnimationFrame(tickAmbience);

['pointerdown','keydown','touchstart','scroll'].forEach(ev => {
  document.addEventListener(ev, () => {
    if (!started) startPlayback();
    if (beds[bed].paused) playBeds();
  }, { passive:true });
});
</script>
</body>
</html>
