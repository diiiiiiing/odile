<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ODILE — FEED</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg-color: #b8b8bc;
    --txt-1: rgba(255,255,255,.85);
    --txt-2: rgba(255,255,255,.45);
    --txt-3: rgba(255,255,255,.28);
    --line-1: rgba(255,255,255,.50);
    --line-2: rgba(255,255,255,.20);
    --line-3: rgba(255,255,255,.08);
    --chat-bg: rgba(0,0,0,.15);
    /* glass UI (post overlay) scale */
    --s1: rgba(255,255,255,.10);
    --s2: rgba(255,255,255,.18);
    --s3: rgba(255,255,255,.22);
    --s4: rgba(255,255,255,.28);
    --b1: rgba(255,255,255,.25);
    --b2: rgba(255,255,255,.30);
    --b3: rgba(255,255,255,.35);
    --t1: rgba(255,255,255,.28);
    --t2g: rgba(255,255,255,.45);
    --t3g: rgba(255,255,255,.50);
    --t4g: rgba(255,255,255,.6);
    --t5g: rgba(255,255,255,.75);
    --t6g: rgba(255,255,255,.8);
    --t7g: rgba(255,255,255,.9);
    --t8g: rgba(255,255,255,.95);
    --overlay-tint: rgba(184,184,188,.3);
    --highlight-1: rgba(255,255,255,.6);
    --highlight-2: rgba(255,255,255,.15);
    --near-color: rgba(255,160,80,.8);
  }
  body.bright {
    --bg-color: #FFFFFF;
    --txt-1: rgba(0,0,0,.85);
    --txt-2: rgba(0,0,0,.45);
    --txt-3: rgba(0,0,0,.28);
    --line-1: rgba(0,0,0,.35);
    --line-2: rgba(0,0,0,.14);
    --line-3: rgba(0,0,0,.06);
    --chat-bg: rgba(255,255,255,.35);
    /* glass UI (post overlay) scale */
    --s1: rgba(0,0,0,.035);
    --s2: rgba(0,0,0,.05);
    --s3: rgba(0,0,0,.06);
    --s4: rgba(0,0,0,.08);
    --b1: rgba(0,0,0,.10);
    --b2: rgba(0,0,0,.12);
    --b3: rgba(0,0,0,.16);
    --t1: rgba(0,0,0,.28);
    --t2g: rgba(0,0,0,.45);
    --t3g: rgba(0,0,0,.5);
    --t4g: rgba(0,0,0,.6);
    --t5g: rgba(0,0,0,.72);
    --t6g: rgba(0,0,0,.8);
    --t7g: rgba(0,0,0,.9);
    --t8g: rgba(0,0,0,.95);
    --overlay-tint: rgba(255,255,255,.55);
    --highlight-1: rgba(255,255,255,.7);
    --highlight-2: rgba(0,0,0,.03);
    --near-color: rgba(200,90,0,.85);
  }
  html, body { background:var(--bg-color); transition: background-color 1.2s cubic-bezier(.65,0,.35,1); }
  body {
    cursor: none;
    overflow-y: scroll;
    overflow-x: hidden;
    animation: fadeIn .6s ease both;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  #iri {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; background-color: var(--bg-color);
    transition: background-color 1.2s cubic-bezier(.65,0,.35,1),
                opacity 1.2s cubic-bezier(.65,0,.35,1);
  }
  body.bright #iri { opacity: 0; }
  #cur {
    position: fixed; width: 5px; height: 5px;
    background: #1E8A8C; pointer-events: none;
    box-shadow: 0 0 5px 0px #1E8A8C66;
    z-index: 9999; transform: translate(-50%,-50%);
  }
  #overlay {
    position: fixed; inset: 0; background: #b8b8bc; z-index: 1000;
    opacity: 0; pointer-events: none; transition: opacity .7s ease;
  }
  #overlay.on { opacity:1; pointer-events:auto; }

  #feed {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 0;
  }

  .feed-item {
    cursor: none; display: block;
    line-height: 0; position: relative;
  }
  .feed-item img, .feed-item video {
    display: block; width: 100%; height: auto;
  }
  .feed-item video { cursor: none; }
  .feed-ph {
    width: 100%; aspect-ratio: 3 / 4;
    background: rgba(255,255,255,0.18); display: block;
  }

  .pseudo-label {
    position: absolute; bottom: 7px; right: 9px;
    font: 12.5px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: #fff; letter-spacing: .05em;
    opacity: 0; transition: opacity .25s;
    pointer-events: auto;
    text-shadow: none;
    white-space: nowrap; text-transform: lowercase;
  }
  .feed-item:hover .pseudo-label { opacity: 1; }

  /* top nav */
  #topNav {
    position: fixed; top: 0; left: 0; right: 0; height: 50px;
    padding: 0 20px; display: flex; align-items: center;
    z-index: 400;
    font: 300 12.5px/1 -apple-system, 'Helvetica Neue', sans-serif;
  }
  #navHome {
    color: var(--txt-2); text-decoration: none;
    cursor: none; transition: color .5s ease;
  }
  #navHome:hover { color: var(--txt-1); }
  #navSep { color: var(--txt-3); margin: 0 2px; transition: color .5s ease; }
  #navSection { color: rgba(255,255,255,.7); transition: color .5s ease; }
  body.bright #navSection { color: var(--txt-1); }

  /* ── CHAT ── */
  #chat {
    position: fixed; bottom: 24px; right: 24px;
    width: 256px; z-index: 500;
    display: flex; flex-direction: column; gap: 5px;
  }
  #chat-toggle { display: none; }
  #chat-dot { display: none; }
  #chat-msgs {
    height: 210px;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: 3px; padding: 8px 10px 4px;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(transparent, black 28px);
    mask-image: linear-gradient(transparent, black 28px);
  }
  #chat-msgs::-webkit-scrollbar { display: none; }
  .chat-msg {
    font: 300 12.5px/1.5 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--txt-1);
    transition: color .5s ease;
    word-break: break-word;
    display: flex; align-items: baseline; gap: 5px;
    animation: msgIn .6s cubic-bezier(.22,1,.36,1) both,
               msgFloat var(--float-dur, 6s) ease-in-out var(--float-delay, 0s) infinite;
    flex-shrink: 0;
    will-change: transform, opacity;
  }
  @keyframes msgIn {
    from { opacity:0; transform:translateY(6px); filter:blur(3px); }
    to   { opacity:1; transform:translateY(0);    filter:blur(0); }
  }
  @keyframes msgFloat {
    0%, 100% { transform: translate(0, 0); opacity: .82; }
    50%      { transform: translate(var(--drift-x, 1px), var(--drift-y, -2px)); opacity: 1; }
  }
  .chat-dot {
    width: 5px; height: 5px; border-radius: 50%;
    flex-shrink: 0; margin-top: 2px;
  }
  .chat-emoji {
    width: 16px; height: 16px; object-fit: contain;
    vertical-align: middle; margin: 0 1px;
    display: inline;
  }
  #chat-emojis {
    display: flex; gap: 2px; justify-content: flex-start; padding: 0 2px 0 10px;
  }
  .emoji-btn {
    background: none; border: none; cursor: none;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    opacity: .45; transition: opacity .15s, transform .15s;
    flex-shrink: 0; padding: 0;
  }
  .emoji-btn:hover { opacity: 1; transform: scale(1.2); }
  .emoji-btn img { width: 16px; height: 16px; object-fit: contain; display: block; }
  #chat-bottom {
    display: flex; gap: 6px; align-items: center;
  }
  #chat-input-wrap {
    flex: 1;
    border: 1px solid var(--line-2);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    background: var(--chat-bg);
    transition: background-color .5s ease, border-color .5s ease;
  }
  #chat-input {
    width: 100%; background: none; border: none; outline: none;
    font: 300 12.5px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--txt-1);
    padding: 7px 10px;
    cursor: none;
    transition: color .5s ease;
  }
  #chat-input::placeholder { color: var(--txt-3); transition: color .5s ease; }
  #chat-send {
    flex-shrink: 0;
    background: none; border: none;
    color: var(--txt-1); cursor: none;
    opacity: .5;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .2s ease;
  }
  #chat-send svg { width: 18px; height: 18px; display: block; }
  #chat-send .cooldown-label {
    display: none;
    font: 300 12px/1 -apple-system, 'Helvetica Neue', sans-serif;
  }
  #chat-send.cooldown svg { display: none; }
  #chat-send.cooldown .cooldown-label { display: inline; }
  #chat-send:not(:disabled):hover { opacity: .85; }
  #chat-send:disabled { opacity: .25; }

  /* logo */
  #logo {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    z-index: 10; pointer-events: none;
    width: clamp(80px, 12vw, 160px);
    opacity: .7;
    display: block;
    filter: brightness(0) saturate(100%) invert(74%) sepia(25%) saturate(520%) hue-rotate(136deg) brightness(98%) contrast(86%);
    transition: top 1.2s cubic-bezier(.65,0,.35,1), width 1.2s cubic-bezier(.65,0,.35,1),
                transform 1.2s cubic-bezier(.65,0,.35,1), opacity .9s ease;
  }
  #logo-path {
    fill: #030302;
  }

  /* ── INTRO ── */
  body.intro #logo {
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: min(60vw, 520px);
    opacity: 0;
  }
  body.intro #logo.show {
    opacity: 1;
  }
  #topNav, #chat, #submit-btn, #chat-toggle, #feed, #sentinel-top, #sentinel-bottom {
    transition: opacity .8s ease .3s;
  }
  body.intro #topNav, body.intro #chat, body.intro #submit-btn, body.intro #chat-toggle,
  body.intro #feed, body.intro #sentinel-top, body.intro #sentinel-bottom {
    opacity: 0;
    pointer-events: none;
  }

  /* submit button — Instagram-style "create" icon */
  #submit-btn {
    position: fixed; bottom: 24px; left: 24px;
    z-index: 500;
    background: none; border: 1px solid var(--line-2); border-radius: 50%;
    color: var(--txt-1);
    cursor: none;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    opacity: .6;
    transition: opacity .2s ease, border-color .2s ease;
  }
  #submit-btn svg { width: 20px; height: 20px; display: block; }
  #submit-btn:hover { opacity: 1; border-color: var(--line-1); }

  /* text card in feed */
  .text-card {
    width: 100%; padding: 16px 0;
    background: none;
    box-sizing: border-box;
  }
  .text-card p {
    font: 400 22px/1.45 -apple-system, 'Helvetica Neue', Helvetica, sans-serif;
    color: var(--txt-1); letter-spacing: -.02em;
    white-space: pre-wrap; word-break: break-word;
    margin: 0;
    transition: color .5s ease;
  }

  /* submit overlay */
  #submit-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: var(--overlay-tint);
    backdrop-filter: blur(40px) saturate(1.8);
    -webkit-backdrop-filter: blur(40px) saturate(1.8);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, background-color .5s ease;
  }
  #submit-overlay.on { opacity: 1; pointer-events: auto; }

  /* card — liquid glass */
  #form-card {
    background: var(--s4);
    backdrop-filter: blur(60px) saturate(2);
    -webkit-backdrop-filter: blur(60px) saturate(2);
    border: .5px solid var(--b2);
    border-radius: 24px;
    padding: 20px 20px 22px;
    width: min(360px, 90vw);
    box-shadow: 0 8px 40px rgba(0,0,0,.10),
      inset 0 1px 0 var(--highlight-1),
      inset 0 -1px 0 var(--highlight-2);
    position: relative;
    display: flex; flex-direction: column; gap: 10px;
    transition: background-color .5s ease, border-color .5s ease, box-shadow .5s ease;
  }

  /* card header */
  #card-header {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  #card-title {
    font: 400 13px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t4g); letter-spacing: .02em;
    transition: color .5s ease;
  }
  #submit-close {
    background: none;
    border: none;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font: 13px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t2g); cursor: none;
    flex-shrink: 0;
    transition: color .5s ease;
  }
  #submit-close:hover { color: var(--t7g); }

  /* segmented control */
  #type-toggle {
    display: flex;
    background: var(--s1);
    border-radius: 10px; padding: 3px; gap: 3px;
    transition: background-color .5s ease;
  }
  .type-btn {
    flex: 1; border: none; border-radius: 8px;
    font: 400 12.5px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t3g); cursor: none;
    padding: 8px 0; letter-spacing: .02em;
    background: none;
    transition: background .18s, color .5s ease, box-shadow .18s;
  }
  .type-btn.active {
    background: var(--s4);
    color: var(--t7g);
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  /* drop zone */
  #drop-zone {
    width: 100%; height: min(190px, 42vw);
    border: 1px dashed var(--b3);
    border-radius: 14px;
    background: var(--s1);
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: border-color .2s, background .2s, background-color .5s ease;
  }
  #drop-zone.over {
    border-color: var(--t5g);
    background: var(--s2);
  }
  #drop-text {
    text-align: center;
    font: 14.5px/1.75 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t3g);
    pointer-events: none;
    transition: color .5s ease;
  }
  #drop-text small { font-size: 12.5px; color: var(--t1); transition: color .5s ease; }
  #file-input {
    position: absolute; inset: 0;
    opacity: 0; cursor: none; width: 100%; height: 100%;
  }
  #preview-wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; overflow: hidden; border-radius: 12px;
  }
  #preview-wrap img, #preview-wrap video {
    max-width: 100%; max-height: 100%; object-fit: contain; display: block;
  }

  /* text zone */
  #text-zone { display: none; position: relative; }
  #text-zone.on { display: block; }
  #text-input {
    width: 100%; height: min(190px, 42vw);
    background: var(--s2);
    border: 1px solid var(--b3);
    border-radius: 14px;
    padding: 14px 14px 28px; resize: none; outline: none;
    font: 14px/1.55 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t6g);
    transition: background-color .5s ease, border-color .5s ease, color .5s ease;
  }
  #text-input::placeholder { color: var(--t1); transition: color .5s ease; }
  #char-count {
    position: absolute; bottom: 10px; right: 12px;
    font: 12.5px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t1); pointer-events: none;
    transition: color .5s ease;
  }
  #char-count.near { color: var(--near-color); }

  /* instagram input */
  #pseudo-input {
    background: var(--s1);
    border: .5px solid var(--b1);
    border-radius: 11px;
    padding: 12px 14px;
    font: 14px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t6g); outline: none; width: 100%;
    transition: background-color .5s ease, border-color .5s ease, color .5s ease;
  }
  #pseudo-input::placeholder { color: var(--t1); transition: color .5s ease; }

  /* send button */
  #submit-send {
    background: var(--s2);
    border: .5px solid var(--b2);
    border-radius: 12px;
    padding: 14px;
    font: 400 13px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t5g); cursor: none;
    width: 100%; letter-spacing: .04em;
    transition: background .18s, transform .15s, background-color .5s ease, border-color .5s ease, color .5s ease;
    box-shadow: inset 0 1px 0 var(--highlight-2);
    margin-top: 2px;
  }
  #submit-send:hover:not(:disabled) {
    background: var(--s4);
    color: var(--t8g);
  }
  #submit-send:active:not(:disabled) { transform: scale(.98); }
  #submit-send:disabled { opacity: .3; }

  /* status */
  #submit-status {
    text-align: center;
    font: 12.5px/1 -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--t2g); min-height: 14px;
    transition: color .5s ease;
  }

  /* ── MOBILE ── */
  @media (max-width: 700px) {
    #chat {
      left: 10px; right: 10px; width: auto; bottom: 64px;
      opacity: 0; transform: translateY(12px) scale(.98);
      pointer-events: none; transform-origin: bottom right;
      transition: opacity .35s cubic-bezier(.22,1,.36,1),
                  transform .35s cubic-bezier(.22,1,.36,1);
    }
    #chat.open {
      opacity: 1; transform: none; pointer-events: auto;
    }
    #chat-msgs {
      height: 120px;
    }
    #submit-btn, #chat-toggle {
      display: flex; align-items: center; justify-content: center;
      position: fixed; bottom: 10px; z-index: 501;
      border: 1px solid var(--line-2); border-radius: 50%; background: none;
      color: var(--txt-1);
      cursor: none;
      padding: 0; width: 34px; height: 34px; opacity: .6;
      transition: opacity .25s ease, border-color .25s ease;
    }
    #submit-btn svg, #chat-toggle svg { width: 20px; height: 20px; display: block; }
    #chat-toggle { right: 10px; }
    #chat-toggle .close-icon { display: none; }
    #chat-toggle.open .chat-icon { display: none; }
    #chat-toggle.open .close-icon { display: block; }
    #chat-toggle.open { opacity: 1; }
    #chat-dot {
      display: block;
      width: 0; height: 6px; border-radius: 50%;
      background: var(--near-color);
      opacity: 0; transform: scale(.5);
      margin-left: 0;
      transition: opacity .25s ease, transform .25s ease,
                  width .25s ease, margin-left .25s ease;
    }
    #chat-dot.show { opacity: 1; transform: scale(1); width: 6px; margin-left: 6px; }
    #chat-input, #pseudo-input, #text-input {
      font-size: 16px; /* avoid iOS auto-zoom on focus */
    }
    #chat-input { padding: 9px 12px; }
    #chat-send {
      height: 30px; padding: 0 14px; font-size: 12.5px;
    }
    .emoji-btn { width: 30px; height: 30px; }
    .emoji-btn img { width: 18px; height: 18px; }
    #submit-btn {
      left: 10px; right: auto; top: auto;
    }
    body.chat-open #submit-btn {
      opacity: 0; pointer-events: none;
    }
    #logo {
      width: clamp(60px, 18vw, 90px); top: 14px;
    }
    #topNav {
      padding: 0 12px;
    }
    #form-card {
      width: 92vw; padding: 16px 16px 18px;
    }
    #drop-zone, #text-input {
      height: min(220px, 50vw);
    }
  }

  /* no custom cursor on touch devices */
  @media (hover: none) {
    #cur { display: none; }
    *, *::before, *::after { cursor: auto !important; }
  }
</style>
</head>
<body class="intro">
<div id="iri"></div>
<div id="overlay"></div>
<script>window.addEventListener('pageshow',()=>{const o=document.getElementById('overlay');if(o)o.classList.remove('on');});</script>
<div id="cur"></div>

<nav id="topNav">
  <a id="navHome" href="odile_hub.html">odile.xyz</a><span id="navSep"> / </span><span id="navSection">feed</span>
</nav>

<script>
/* intro — odilegram fades in centered, then moves to top as UI fades in */
(function () {
  const logo = document.getElementById('logo');
  // double rAF: ensure initial opacity is painted before the fade-in transition starts
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      logo.classList.add('show');
    });
  });
  setTimeout(() => {
    document.body.classList.remove('intro');
    document.body.classList.add('bright');
  }, 1600);
})();

/* Supabase */
const { createClient } = supabase;
const sb = createClient(
  'https://iwmfhvhhbpcsjcsakigg.supabase.co',
  'sb_publishable_wp_9hP65hwOLHAoPDAhQRA_MYR5ER3-'
);

/* Sanity */
const PID = 'zgrgr7sj', DS = 'production';
let emojiUrls = [];

async function loadEmojis() {
  const q = `*[_type=="sanity.imageAsset" && references("I02pFZIEVcuOi5ODxOXGGm")]{url}`;
  try {
    const res = await fetch(`https://${PID}.api.sanity.io/v2021-10-21/data/query/${DS}?query=${encodeURIComponent(q)}`);
    const { result } = await res.json();
    emojiUrls = (result || []).map(r => r.url + '?w=80&auto=format');
    const container = document.getElementById('chat-emojis');
    container.innerHTML = '';
    emojiUrls.forEach((url, i) => {
      const btn = document.createElement('button');
      btn.className = 'emoji-btn';
      btn.dataset.emoji = `e${i + 1}`;
      const img = document.createElement('img');
      img.src = url;
      img.alt = `[e${i + 1}]`;
      btn.appendChild(img);
      btn.addEventListener('click', () => {
        const tag = `[e${i + 1}]`;
        const pos = chatInput.selectionStart ?? chatInput.value.length;
        chatInput.value = chatInput.value.slice(0, pos) + tag + chatInput.value.slice(pos);
        chatInput.focus();
      });
      container.appendChild(btn);
    });
  } catch (e) { console.error('emoji load failed', e); }
}

/* app settings (chat cooldown / submission moderation), set from admin */
let appSettings = { chat_cooldown_seconds: 0, require_approval: true };
async function loadSettings() {
  const { data } = await sb
    .from('app_settings')
    .select('chat_cooldown_seconds, require_approval')
    .eq('id', 1)
    .maybeSingle();
  if (data) appSettings = data;
}
loadSettings();

/* cursor */
const cur = document.getElementById('cur');
document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
});

/* nav */
document.getElementById('navHome').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('overlay').classList.add('on');
  setTimeout(() => window.location.href = 'odile_hub.html', 700);
});

/* iridescent bg */
let mx = .5, my = .5;
const iri = document.getElementById('iri');
const blobs   = [{x:50,y:100},{x:20,y:60},{x:80,y:40},{x:50,y:50}];
const base    = [{x:50,y:100},{x:20,y:60},{x:80,y:40},{x:50,y:50}];
const blobDef = [
  {ax: .38, ay: .30,  ease:.05,  color:'220,180,60',  op:.70, ex:90, ey:70},
  {ax:-.42, ay: .34,  ease:.04,  color:'200,160,210', op:.50, ex:70, ey:60},
  {ax: .36, ay:-.38,  ease:.045, color:'160,210,200', op:.40, ex:60, ey:50},
  {ax: .18, ay: .16,  ease:.03,  color:'210,200,190', op:.30, ex:80, ey:80},
];
document.addEventListener('mousemove', e => { mx = e.clientX/innerWidth; my = e.clientY/innerHeight; });
(function tick() {
  let g = '';
  blobs.forEach((b,i) => {
    const d = blobDef[i];
    b.x += (base[i].x + (mx-.5)*d.ax*100 - b.x) * d.ease;
    b.y += (base[i].y + (my-.5)*d.ay*100 - b.y) * d.ease;
    g += `radial-gradient(ellipse ${d.ex}% ${d.ey}% at ${b.x.toFixed(1)}% ${b.y.toFixed(1)}%, rgba(${d.color},${d.op}) 0%, transparent 55%),`;
  });
  iri.style.backgroundImage = g.slice(0,-1);
  requestAnimationFrame(tick);
})();

/* feed state */
const PLACEHOLDER = Array(12).fill({_id:'',thumb:'',videoUrl:'',pseudo:''});
let items     = [...PLACEHOLDER];
let cursor    = 0;
let preCursor = 0;
const BATCH   = 10;
const feed    = document.getElementById('feed');
const isMobileFeed = window.matchMedia('(max-width: 700px)').matches;
const SIZES   = isMobileFeed
  ? ['68vw','80vw','92vw','62vw','96vw','72vw','88vw','64vw','94vw','76vw']
  : ['18vw','24vw','33vw','14vw','28vw','20vw','30vw','16vw','26vw','22vw'];
const TEXT_SIZES = isMobileFeed
  ? ['86vw','90vw','88vw','92vw','85vw']
  : ['26vw','28vw','27vw','29vw','26.5vw'];
let sizeIdx   = 0;

function makeCard(item) {
  const div = document.createElement('div');
  div.className = 'feed-item';

  if (item.text) {
    /* text blocks: fixed readable width, centered in feed */
    div.style.width = TEXT_SIZES[sizeIdx % TEXT_SIZES.length];
    sizeIdx++;
    const block = document.createElement('div');
    block.className = 'text-card';
    const p = document.createElement('p');
    p.textContent = item.text;
    block.appendChild(p);
    div.appendChild(block);
  } else {
    div.style.width = SIZES[sizeIdx % SIZES.length];
    sizeIdx++;
  }

  if (!item.text) {
    if (item.videoUrl) {
      const v = document.createElement('video');
      v.src = item.videoUrl;
      v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true;
      div.appendChild(v);
    } else if (item.thumb) {
      const img = document.createElement('img');
      img.src = item.thumb; img.alt = '';
      div.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'feed-ph';
      div.appendChild(ph);
    }
  }

  if (item.pseudo) {
    const lbl = document.createElement('div');
    lbl.className = 'pseudo-label';
    lbl.textContent = '@' + item.pseudo;
    lbl.addEventListener('click', e => {
      e.stopPropagation();
      window.open('https://instagram.com/' + item.pseudo, '_blank');
    });
    div.appendChild(lbl);
  }
  return div;
}

function appendBatch() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < BATCH; i++) {
    frag.appendChild(makeCard(items[cursor % items.length]));
    cursor++;
  }
  feed.appendChild(frag);
}

function prependBatch() {
  const cards = [];
  for (let i = 0; i < BATCH; i++) {
    preCursor--;
    const idx = ((preCursor % items.length) + items.length) % items.length;
    cards.unshift(makeCard(items[idx]));
  }
  const prevHeight = document.body.scrollHeight;
  const prevScroll = window.scrollY;
  const frag = document.createDocumentFragment();
  cards.forEach(c => frag.appendChild(c));
  feed.insertBefore(frag, feed.firstChild);
  window.scrollTo(0, prevScroll + (document.body.scrollHeight - prevHeight));
}

/* observers */
const ioBottom = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) appendBatch();
}, { rootMargin: '400px' });
ioBottom.observe(document.getElementById('sentinel-bottom'));

const ioTop = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) prependBatch();
}, { rootMargin: '400px' });
let topActive = false;
window.addEventListener('scroll', () => {
  if (!topActive && window.scrollY > 300) {
    topActive = true;
    ioTop.observe(document.getElementById('sentinel-top'));
  }
}, { passive: true });

appendBatch(); appendBatch();

/* load approved submissions from Supabase */
async function loadFeed() {
  const { data } = await sb
    .from('submissions')
    .select('id, pseudo, file_url, file_type, text_content')
    .eq('approved', true)
    .order('created_at', { ascending: false });
  if (!data?.length) return;
  items = data.map(r => ({
    _id:      r.id,
    thumb:    r.file_type === 'image' ? r.file_url : '',
    videoUrl: r.file_type === 'video' ? r.file_url : '',
    text:     r.file_type === 'text'  ? r.text_content : '',
    pseudo:   r.pseudo,
  }));
  feed.innerHTML = '';
  cursor = 0; preCursor = 0; sizeIdx = 0;
  appendBatch(); appendBatch();
}
loadFeed();

/* ── submit overlay ── */
const submitOverlay = document.getElementById('submit-overlay');
const submitBtn     = document.getElementById('submit-btn');
const closeBtn      = document.getElementById('submit-close');
const dropZone      = document.getElementById('drop-zone');
const fileInput     = document.getElementById('file-input');
const previewWrap   = document.getElementById('preview-wrap');
const dropText      = document.getElementById('drop-text');
const textZone      = document.getElementById('text-zone');
const textInput     = document.getElementById('text-input');
const charCount     = document.getElementById('char-count');
const pseudoInput   = document.getElementById('pseudo-input');
const sendBtn       = document.getElementById('submit-send');
const statusEl      = document.getElementById('submit-status');

const MAX_CHARS = 280;
let selectedFile = null;
let postType = 'media'; // 'media' | 'text'

/* type toggle */
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    postType = btn.dataset.type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    dropZone.style.display = postType === 'media' ? '' : 'none';
    textZone.classList.toggle('on', postType === 'text');
    selectedFile = null;
    fileInput.value = '';
    previewWrap.innerHTML = '';
    dropText.style.display = '';
    textInput.value = '';
    charCount.textContent = `0 / ${MAX_CHARS}`;
    charCount.classList.remove('near');
    checkReady();
  });
});

function openOverlay()  { submitOverlay.classList.add('on'); }
function closeOverlay() { submitOverlay.classList.remove('on'); resetForm(); }

function resetForm() {
  selectedFile = null;
  postType = 'media';
  fileInput.value = '';
  previewWrap.innerHTML = '';
  dropText.style.display = '';
  textInput.value = '';
  charCount.textContent = `0 / ${MAX_CHARS}`;
  charCount.classList.remove('near');
  pseudoInput.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = '';
  document.querySelectorAll('.type-btn').forEach((b,i) => b.classList.toggle('active', i === 0));
  dropZone.style.display = '';
  textZone.classList.remove('on');
}

function checkReady() {
  const handle = pseudoInput.value.trim();
  if (postType === 'text') {
    sendBtn.disabled = !(textInput.value.trim() && handle);
  } else {
    sendBtn.disabled = !(selectedFile && handle);
  }
}

/* ── HEIC/HEIF support ──
   iPhones export photos as .heic by default, which browsers can't display
   or render in <img>/<video> tags. Convert to JPEG client-side before
   previewing/uploading so it shows correctly for everyone. */
function isHeicFile(file) {
  const type = (file.type || '').toLowerCase();
  const name = (file.name || '').toLowerCase();
  return type === 'image/heic' || type === 'image/heif' ||
         name.endsWith('.heic') || name.endsWith('.heif');
}

async function prepareFile(file) {
  if (!isHeicFile(file)) return file;
  const prevText = dropText.innerHTML;
  dropText.style.display = '';
  dropText.textContent = 'Converting HEIC…';
  try {
    const out = await heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
    const blob = Array.isArray(out) ? out[0] : out;
    const newName = file.name.replace(/\.(heic|heif)$/i, '.jpg');
    return new File([blob], newName, { type: 'image/jpeg' });
  } catch (err) {
    console.error('HEIC conversion failed', err);
    statusEl.textContent = 'could not read HEIC file — try another photo';
    return null;
  } finally {
    dropText.innerHTML = prevText;
  }
}

function setPreview(file) {
  previewWrap.innerHTML = '';
  dropText.style.display = 'none';
  if (file.type.startsWith('video')) {
    const v = document.createElement('video');
    v.src = URL.createObjectURL(file);
    v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
    previewWrap.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    previewWrap.appendChild(img);
  }
}

textInput.addEventListener('input', () => {
  const len = textInput.value.length;
  charCount.textContent = `${len} / ${MAX_CHARS}`;
  charCount.classList.toggle('near', len >= MAX_CHARS * 0.85);
  checkReady();
});

submitBtn.addEventListener('click', openOverlay);
closeBtn.addEventListener('click', closeOverlay);
pseudoInput.addEventListener('input', checkReady);

fileInput.addEventListener('change', async () => {
  if (fileInput.files[0]) {
    const f = await prepareFile(fileInput.files[0]);
    fileInput.value = '';
    if (!f) { checkReady(); return; }
    selectedFile = f;
    setPreview(selectedFile);
    checkReady();
  }
});

dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', async e => {
  e.preventDefault(); dropZone.classList.remove('over');
  const f0 = e.dataTransfer.files[0];
  if (f0 && (f0.type.startsWith('image') || f0.type.startsWith('video') || isHeicFile(f0))) {
    const f = await prepareFile(f0);
    if (!f) return;
    selectedFile = f; setPreview(f); checkReady();
  }
});

sendBtn.addEventListener('click', async () => {
  const handle = pseudoInput.value.trim().replace(/^@/, '');
  if (!handle) return;
  sendBtn.disabled = true;
  statusEl.textContent = postType === 'text' ? 'sending…' : 'uploading…';

  const autoApprove = !appSettings.require_approval;

  if (postType === 'text') {
    const body = textInput.value.trim();
    if (!body) { sendBtn.disabled = false; return; }
    const { error } = await sb.from('submissions').insert({
      pseudo:       handle,
      file_type:    'text',
      text_content: body,
      ...(autoApprove ? { approved: true } : {}),
    });
    if (error) { statusEl.textContent = 'error — try again'; sendBtn.disabled = false; return; }
  } else {
    if (!selectedFile) { sendBtn.disabled = false; return; }
    const ext  = selectedFile.name.split('.').pop().toLowerCase();
    const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const { data: up, error: upErr } = await sb.storage
      .from('media')
      .upload(path, selectedFile, { contentType: selectedFile.type, upsert: false });
    if (upErr) { statusEl.textContent = 'upload error — try again'; sendBtn.disabled = false; return; }
    const { data: { publicUrl } } = sb.storage.from('media').getPublicUrl(up.path);
    const { error: insErr } = await sb.from('submissions').insert({
      pseudo:    handle,
      file_url:  publicUrl,
      file_type: selectedFile.type.startsWith('video') ? 'video' : 'image',
      ...(autoApprove ? { approved: true } : {}),
    });
    if (insErr) { statusEl.textContent = 'error — try again'; sendBtn.disabled = false; return; }
  }

  statusEl.textContent = autoApprove ? 'sent' : 'sent · pending review';
  if (autoApprove) loadFeed();
  setTimeout(closeOverlay, 2200);
});

/* ── CHAT ── */
const CHAT_COLOR = (() => {
  let c = sessionStorage.getItem('chat-color');
  if (!c) {
    const hues = [0,20,40,60,120,160,180,200,220,260,280,300,320];
    const h = hues[Math.floor(Math.random() * hues.length)];
    c = `hsl(${h},60%,72%)`;
    sessionStorage.setItem('chat-color', c);
  }
  return c;
})();

const chatMsgs  = document.getElementById('chat-msgs');
const chatInput = document.getElementById('chat-input');
const chatSend  = document.getElementById('chat-send');

/* ── mobile chat collapse/expand ── */
const chatEl          = document.getElementById('chat');
const chatToggle      = document.getElementById('chat-toggle');
const chatDot         = document.getElementById('chat-dot');

if (chatToggle) {
  chatToggle.addEventListener('click', () => {
    const open = chatEl.classList.toggle('open');
    chatToggle.classList.toggle('open', open);
    document.body.classList.toggle('chat-open', open);
    if (open) {
      chatDot.classList.remove('show');
      requestAnimationFrame(() => { chatMsgs.scrollTop = chatMsgs.scrollHeight; });
    }
  });
}

function addChatMsg(text, color) {
  const el = document.createElement('div');
  el.className = 'chat-msg';
  /* give each message its own gentle, out-of-sync drift so the chat feels
     like it's softly breathing rather than bobbing in lockstep */
  el.style.setProperty('--float-dur', (5 + Math.random() * 3).toFixed(2) + 's');
  el.style.setProperty('--float-delay', (-Math.random() * 8).toFixed(2) + 's');
  el.style.setProperty('--drift-x', (Math.random() * 4 - 2).toFixed(2) + 'px');
  el.style.setProperty('--drift-y', (-1 - Math.random() * 2.5).toFixed(2) + 'px');
  const dot = document.createElement('span');
  dot.className = 'chat-dot';
  dot.style.background = color;
  el.appendChild(dot);
  /* parse [e1]–[eN] emoji tags inline */
  const body = document.createElement('span');
  text.split(/(\[e\d+\])/).forEach(part => {
    const m = part.match(/^\[e(\d+)\]$/);
    if (m) {
      const img = document.createElement('img');
      img.src = emojiUrls[parseInt(m[1]) - 1] || `e${m[1]}.png`;
      img.alt = part;
      img.className = 'chat-emoji';
      body.appendChild(img);
    } else if (part) {
      body.appendChild(document.createTextNode(part));
    }
  });
  el.appendChild(body);
  chatMsgs.appendChild(el);
  while (chatMsgs.children.length > 60) chatMsgs.removeChild(chatMsgs.firstChild);
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
  if (chatHistoryLoaded && chatDot && chatEl && !chatEl.classList.contains('open')) {
    chatDot.classList.add('show');
  }
}

const chatChannel = sb.channel('feed-chat', { config: { broadcast: { self: true } } });
chatChannel.on('broadcast', { event: 'msg' }, ({ payload }) => {
  addChatMsg(payload.text, payload.color);
}).subscribe();

/* load persisted chat history so messages survive a refresh */
let chatHistoryLoaded = false;
async function loadChatHistory() {
  const { data, error } = await sb
    .from('chat_messages')
    .select('text, color, created_at')
    .order('created_at', { ascending: false })
    .limit(60);
  if (!error && data) data.reverse().forEach(m => addChatMsg(m.text, m.color));
  chatHistoryLoaded = true;
}
loadChatHistory();

let chatCooldownUntil = 0;
let chatCooldownTimer = null;

function startChatCooldown() {
  const seconds = appSettings.chat_cooldown_seconds || 0;
  if (seconds <= 0) return;
  chatCooldownUntil = Date.now() + seconds * 1000;
  chatSend.disabled = true;
  const label = chatSend.querySelector('.cooldown-label');
  const tick = () => {
    const remaining = Math.ceil((chatCooldownUntil - Date.now()) / 1000);
    if (remaining <= 0) {
      chatSend.disabled = false;
      chatSend.classList.remove('cooldown');
      clearInterval(chatCooldownTimer);
      chatCooldownTimer = null;
      return;
    }
    chatSend.classList.add('cooldown');
    label.textContent = remaining + 's';
  };
  tick();
  if (chatCooldownTimer) clearInterval(chatCooldownTimer);
  chatCooldownTimer = setInterval(tick, 250);
}

function sendChatMsg() {
  if (Date.now() < chatCooldownUntil) return;
  const text = chatInput.value.trim();
  if (!text) return;
  chatChannel.send({ type: 'broadcast', event: 'msg', payload: { text, color: CHAT_COLOR } });
  sb.from('chat_messages').insert({ text, color: CHAT_COLOR }).then(({ error }) => {
    if (error) console.error('chat insert error', error);
  });
  chatInput.value = '';
  startChatCooldown();
}

chatSend.addEventListener('click', sendChatMsg);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChatMsg(); });

loadEmojis();
</script>
